__BASE_CSS__
/* ---------- tools 33 (her 12.11 07:57–08:09): 🎧 decoding prep — her own page to listen to a film, mark its hard pieces and keep them ---------- */
html,body{height:100%}
body{overflow:hidden}
.prep{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;max-width:none;padding:10px 16px 8px;gap:8px;box-sizing:border-box}
.pp-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pp-top h1{margin:0 8px 0 0;font-size:1.25rem}
.pp-file{max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-stat{color:var(--muted);font-weight:700;font-size:.9rem}
.pp-stat.ok{color:var(--ok-ink, #1E6B2E)}
.pp-stat.warn{color:#A35A00}
.pp-sp{flex:1}
.pp-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,38%);gap:14px;min-height:0}
.pp-left{display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;min-height:0;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 10px}
.pp-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:.92rem}
.pp-filter input{font:inherit;font-weight:700;border:2px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--card);color:var(--ink)}
.pp-filter .t{width:5.2em;text-align:center}
.pp-filter .q{flex:1;min-width:10em}
.pp-filter .n{color:var(--muted);font-weight:700;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pp-filter .n .bad{color:#B00020}
.pp-filter .nav{font:inherit;font-size:1.15rem;line-height:1;font-weight:900;width:28px;height:26px;border-radius:8px;border:2px solid var(--instr);background:var(--card);color:var(--instr);cursor:pointer;padding:0 0 2px}
.chip.sm{font-size:.75rem;padding:1px 8px}
.cue-x .hit{box-shadow:inset 0 -3px 0 #FF8A00;font-weight:800}
.cue-x .hit.now{background:rgba(255,138,0,.28);border-radius:3px}
.pp-cues{overflow:auto;min-height:0;padding-right:4px}
.cue{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:baseline;padding:3px 4px;border-radius:8px}
.cue.cur{background:var(--ground)}
.cue.wsel{box-shadow:inset 4px 0 0 var(--instr)}
.cue-pl{width:26px;height:26px;border-radius:50%;border:0;background:var(--instr);color:var(--instr-ink);font-size:.7rem;cursor:pointer;align-self:center}
.cue-pl.ctxpick{background:#E08A00}
.cue-pl.stopb{background:var(--ink);color:var(--card);font-size:.8rem}
.cue-t, .cue-pl{user-select:none}
.cue-t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;font-weight:700;cursor:pointer}
.cue-x{font-size:1.05rem;line-height:1.55;user-select:text;cursor:text}
.cue-x mark{border-radius:4px;padding:0 1px;cursor:pointer;color:inherit}
.cue-x mark.draft{outline:2px dashed var(--instr);background:rgba(6,147,227,.15)}
.cue-x mark.on{outline:2px solid var(--ink)}
.pp-right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0}
.pp-vid{position:relative;aspect-ratio:16/9;width:100%;max-height:26vh;background:#000;border-radius:12px;overflow:hidden;justify-self:center}
.pp-vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pp-vid .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:12px;font-size:.9rem}
.pp-side{overflow:auto;min-height:0;display:grid;gap:10px;align-content:start}
.pp-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px;display:grid;gap:8px}
.pp-card h3{margin:0;font-size:1rem}
.pp-line{margin:0;font-size:1.1rem;line-height:1.5}
.pp-line b{border-radius:4px;padding:0 2px}
.pp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pp-lab{font-weight:800;font-size:.85rem;color:var(--muted);min-width:5.5em}
.chip{font:inherit;font-size:.88rem;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:2px 10px;cursor:pointer}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .sw{display:inline-block;width:.8em;height:.8em;border-radius:3px;margin-right:5px;vertical-align:-.05em}
.chip.sub{font-weight:700}
.chip.hard.on{background:#FFE3B3;border-color:#A35A00;color:#5A3200}
.pp-in{font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card);color:var(--ink);min-width:0}
.pp-in.grow{flex:1}
.pp-btn{font:inherit;font-weight:800;font-size:.9rem;border:2px solid var(--instr);color:var(--instr);background:var(--card);border-radius:10px;padding:4px 10px;cursor:pointer}
.pp-btn.pri{background:var(--instr);color:var(--instr-ink)}
.pp-btn.quiet{border-color:var(--line);color:var(--muted)}
.pp-why{font-size:.8rem;font-weight:700;color:var(--muted)}
.pp-hint.sm{font-size:.78rem;margin:0}
.pp-btn[disabled]{opacity:.45;cursor:default}
.pp-hint{margin:0;color:var(--muted);font-size:.88rem}
.pp-bank details{border-top:1px solid var(--line);padding:4px 0}
.pp-bank summary{cursor:pointer;font-weight:800}
.pp-bank ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:2px}
.pp-bank li{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto auto auto;align-items:center;gap:5px;padding:2px 4px;border-radius:8px}
.pp-bank li.now{background:var(--ground);outline:2px solid var(--instr)}
.pp-bank li.open{background:var(--ground)}
.pp-bank li .tm{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.pp-bank .bk-t{cursor:pointer;line-height:1.3}
.pp-bank .bk-t:hover{text-decoration:underline}
.bk-pl{width:24px;height:24px;border-radius:50%;border:0;background:var(--instr);color:var(--instr-ink);font-size:.65rem;cursor:pointer}
.bk-c{font:inherit;font-size:.72rem;font-weight:900;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:0 6px;cursor:pointer;line-height:1.5}
.bk-c.hd.on{background:#FFE3B3;border-color:#A35A00;color:#5A3200}
.bk-c.role.diag, .chip.role.diag{background:#DCEEFF;border-color:#0B5A8A;color:#0B4A72}
.bk-c.role.train, .chip.role.train{background:#DDF5DD;border-color:#2C7A35;color:#1F5A26}
.bk-x{border:0;background:transparent;color:var(--muted);font-size:.9rem;cursor:pointer;padding:0 2px}
.bk-x:hover{color:var(--ink)}
.bk-all{font:inherit;font-size:.75rem;font-weight:800;margin-left:8px;border:1.5px solid var(--instr);color:var(--instr);background:transparent;border-radius:99px;padding:0 8px;cursor:pointer}
.bk-hid summary{color:var(--muted)}
.cue-x mark.hid{opacity:.45;background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(0,0,0,.08) 4px 6px)}
.pp-wave{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 10px;display:grid;gap:6px}
.pp-wave canvas{display:block;width:100%;height:104px;border-radius:10px;cursor:crosshair;touch-action:none;
  --fw-bg:#F3F7FA;--fw-sel:rgba(6,147,227,.20);--fw-edge:#0693E3;--fw-wave:#3D6F8F;--fw-tick:#6B6B6B;--fw-cur:#1D1D1B;--fw-head:#E00000;--fw-ctx:rgba(224,138,0,.18);--fw-piece:rgba(29,29,27,.07);--fw-rule:#E4ECF2}
:root[data-theme="dark"] .pp-wave canvas{--fw-bg:#15191D;--fw-sel:rgba(108,195,255,.22);--fw-edge:#6CC3FF;--fw-wave:#7FB6DA;--fw-tick:#A4A7AB;--fw-cur:#ECECEA;--fw-head:#FF7A7A;--fw-ctx:rgba(255,170,60,.18);--fw-piece:rgba(255,255,255,.06);--fw-rule:#22282E}
.pp-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pp-ctl kbd{font:inherit;font-size:.72rem;font-weight:800;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--ground);color:var(--muted)}
.pp-sel{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.pp-legal{font-size:.75rem;color:var(--muted)}
.pp-legal a{color:inherit}
.pp-row h3{margin-right:4px}
.pp-stat.sm{font-size:.8rem}
@media (max-height:800px){ .pp-vid{max-height:18vh} .pp-wave canvas{height:86px} .pp-card{padding:8px 10px;gap:6px} .pp-line{font-size:1rem} .chip{padding:1px 9px} .pp-btn{padding:3px 9px} .pp-in{padding:3px 8px} .prep{gap:6px;padding-top:8px} }
@media (max-width:900px){ body{overflow:auto} .prep{height:auto} .pp-main{grid-template-columns:1fr} .pp-cues{max-height:50vh} }
</style>

<body>
<div class="prep" id="app"></div>
<script>
const D = __DATA__;
const TOOLS_VERSION = "__TOOLS_VERSION__";
const PAGE_ID = "__PAGE_ID__";
const TABLE_PAGE = __LIVE__;   /* the -live page keeps the bank in her table; it has no live changes of its own, so the shared live polling stays off */
const LIVE_ON = false, LIVE_URL = "__SYNC_URL__";
__BASE_JS__
/* ================= 🎧 decoding prep (tools 33; her 12.11 07:57: «мою подготовку к уроку тоже вынести к нам на тулзу… при подготовке я
   продолжаю прыгать между кучей экранов»; 08:00: «экраны, анализ и решение на урок, их желательно разделить… сложность B2/C1 можно
   отмечать сразу по ходу»; 08:08: context «в репликах, но очень по-разному… таймстемп… выбираю либо на субтитрах, либо на вейв-форме»;
   08:09: «играю либо через эту нижнюю полоску… либо кликаю на субтитры… кнопочка play у начала субтитров»).
   Screen 1, the analysis: her film and its subtitles from her computer (nothing is uploaded); the lines as in the .srt, ▶ at each; the
   waveform under them, drawn as the sound plays; words chosen in a line = a piece with a feature (her own list, with subtopics and colours),
   hard for B2 / C1, a note and its context (from a line, from the waveform, or none). The pieces are her bank for this film: on this
   computer, and with her code in her table (sheet «Decoding bank»), so it is the same on both computers. ================= */
const P = {v: null, url: "", film: "", sub: "", key: "", cues: [], pieces: [], features: [], cur: -1, sel: null, cursor: null, win: [0, 12],
  draft: null, ctxPick: false, from: "", to: "", q: "", playing: null, raf: 0, au: null, pk: {lo: {}, hi: {}}, pkKey: "", pkDirty: false,
  dirty: {p: new Set(), del: new Set(), f: false}, saveT: 0, saved: "", status: "", rate: 1, keepN: 0, dragging: false, mouseDown: false,
  whole: true, only: false, hits: {}, hitList: [], hitAt: -1, hitKey: "", findBad: false};
const isHer = () => { try{ return localStorage.getItem("hw-role") === "teacher" && !!localStorage.getItem("hw-code"); }catch(e){ return false; } };
const tableOn = () => TABLE_PAGE && !!LIVE_URL && isHer();
const PALETTE = ["#FFF06A", "#7CF07C", "#9FD3FF", "#FFB3C7", "#FFC98A", "#C9B3FF", "#A8F0E4", "#E0E0A0"];
const tm = t => { t = Math.max(0, t || 0); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t - h * 3600 - m * 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + (s < 10 ? "0" : "") + s.toFixed(2); };
const tmS = t => { const x = tm(t); return x.replace(/\.\d+$/, ""); };
const parseT = s => { const m = String(s || "").trim().replace(",", ".").match(/^(?:(\d+):)?(\d+):(\d+(?:\.\d+)?)$/); return m ? (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]) : null; };
const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
/* ---------- the subtitles: .srt or .ass (Aegisub), as they are — a cue is a line ---------- */
function parseSubs(txt){
  /* a line break inside a cue is a space: <br/> (her The Intern .srt, 12.11), \N in .ass, a lone \r */
  const out = [], clean = s => String(s).replace(/<br\s*\/?>/gi, " ").replace(/\{[^}]*\}/g, "").replace(/<[^>]+>/g, "").replace(/\\[Nnh]/g, " ").replace(/[\s\u0085\u200b]+/g, " ").trim();
  if(/^\s*\[Script Info\]/m.test(txt) || /^Dialogue:/m.test(txt)){
    txt.split(/\r\n?|\n/).forEach(l => { const m = l.match(/^Dialogue:\s*[^,]*,([^,]+),([^,]+),(?:[^,]*,){6}(.*)$/); if(!m) return;
      const s = parseT(m[1]), e = parseT(m[2]), t = clean(m[3]); if(s != null && e != null && t) out.push({s, e, t}); });
  } else {
    txt.replace(/\r\n?|[\u2028\u2029\u0085]/g, "\n").split(/\n\s*\n/).forEach(b => { const L = b.split("\n").filter(x => x.trim() !== ""); const i = L.findIndex(x => /-->/.test(x)); if(i < 0) return;
      const m = L[i].match(/(\d+:\d+:\d+[.,]\d+)\s*-->\s*(\d+:\d+:\d+[.,]\d+)/); if(!m) return;
      const t = clean(L.slice(i + 1).join(" ")); if(t) out.push({s: parseT(m[1]), e: parseT(m[2]), t}); });
  }
  return out.sort((a, b) => a.s - b.s);
}
/* ---------- files: chosen once, Chrome / Edge remember them (IndexedDB) ---------- */
function idb(){ return new Promise((res, rej) => { try{ const r = indexedDB.open("hw-prep", 1); r.onupgradeneeded = () => r.result.createObjectStore("h"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); }
async function idbPut(k, v){ try{ const db = await idb(); db.transaction("h", "readwrite").objectStore("h").put(v, k); }catch(e){} }
async function idbGet(k){ try{ const db = await idb(); return await new Promise(res => { const r = db.transaction("h").objectStore("h").get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); }catch(e){ return null; } }
async function pick(kind){
  const types = kind === "film" ? [{description: "The film", accept: {"video/*": [".mp4", ".m4v", ".mkv", ".webm", ".mov"]}}] : [{description: "Subtitles", accept: {"text/plain": [".srt", ".ass", ".ssa", ".txt"]}}];
  if(window.showOpenFilePicker){ try{ const [h] = await showOpenFilePicker({id: "prep-" + kind, types}); idbPut(kind, h); use(kind, await h.getFile()); }catch(e){} return; }
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = kind === "film" ? "video/*,.mkv" : ".srt,.ass,.ssa,.txt"; inp.style.display = "none"; document.body.appendChild(inp);
  inp.addEventListener("change", () => { const f = inp.files && inp.files[0]; if(f) use(kind, f); inp.remove(); }); inp.click();
}
async function reopen(kind){ const h = await idbGet(kind); if(!h) return pick(kind);
  try{ if((await h.queryPermission({mode: "read"})) !== "granted" && (await h.requestPermission({mode: "read"})) !== "granted") return pick(kind); use(kind, await h.getFile()); }catch(e){ pick(kind); } }
function video(){ if(!P.v){ const v = document.createElement("video"); v.playsInline = true; v.preload = "auto"; v.addEventListener("loadedmetadata", () => { waveDraw(); }); P.v = v; } return P.v; }
async function use(kind, f){
  if(kind === "film"){ const v = video(); if(P.url) URL.revokeObjectURL(P.url); P.url = URL.createObjectURL(f); P.film = f.name; v.src = P.url; v.load(); peaksLoad(f.name + "|" + f.size); }
  else { P.sub = f.name; P.cues = parseSubs(await f.text()); P.key = f.name.replace(/\.(srt|ass|ssa|txt)$/i, ""); P.cur = -1; await bankLoad(); }
  render();
}
/* ---------- the waveform: drawn from what plays (a whole film is too big to read here), kept per film file ---------- */
const FW = 100;
function audio(){ if(!P.au){ try{ const C = window.AudioContext || window.webkitAudioContext, ac = new C(), src = ac.createMediaElementSource(video()), an = ac.createAnalyser();
    an.fftSize = 2048; src.connect(an); an.connect(ac.destination); P.au = {ac, an, buf: new Float32Array(an.fftSize)}; }catch(e){ P.au = {off: true}; } }
  if(P.au.ac && P.au.ac.state !== "running") try{ P.au.ac.resume(); }catch(e){} }
function capture(){ const A = P.au, v = P.v; if(!A || !A.an || !v || v.paused) return;
  A.an.getFloatTimeDomainData(A.buf); const sr = A.ac.sampleRate, N = A.buf.length, now = v.currentTime, per = sr / FW / (v.playbackRate || 1), k = Math.floor(N / per);
  for(let c = 0; c < k; c++){ const a = Math.floor(N - (c + 1) * per), z = Math.floor(N - c * per); let lo = 0, hi = 0;
    for(let i = Math.max(0, a); i < z; i++){ const x = A.buf[i]; if(x < lo) lo = x; if(x > hi) hi = x; }
    const b = Math.floor((now - (c + .5) / FW) * FW); if(b < 0) continue; P.pk.lo[b] = Math.max(-127, Math.round(lo * 127)); P.pk.hi[b] = Math.min(127, Math.round(hi * 127)); }
  P.pkDirty = true; }
async function peaksKeep(){ if(!P.pkDirty || !P.pkKey) return; P.pkDirty = false; idbPut("pk:" + P.pkKey, {lo: P.pk.lo, hi: P.pk.hi}); }
async function peaksLoad(key){ P.pkKey = key; P.pk = {lo: {}, hi: {}}; const v = await idbGet("pk:" + key); if(v && P.pkKey === key){ P.pk = {lo: Object.assign({}, v.lo, P.pk.lo), hi: Object.assign({}, v.hi, P.pk.hi)}; waveDraw(); } }
function stop(){ cancelAnimationFrame(P.raf); clearTimeout(P.nextT); if(P.v) try{ P.v.pause(); }catch(e){} P.playing = null; nowMark(); bankMark(); waveDraw(); }
/* tools 36 (her 12.11 13:19–13:21): from a line or a point on the waveform the film plays ON — the waveform and the line follow; a piece stops at its end */
const TAIL = .4;   /* a line plays a little past its subtitle's end: the .srt end often cuts the last sound */
function play(s, e, what, more){
  if(!P.url){ nudge("[data-pick='film']"); return; }
  stop(); const v = video(); audio(); v.playbackRate = P.rate; P.playing = Object.assign({s, e, what}, more || {}); nowMark(); bankMark();
  const go = () => { const p = v.play(); if(p && p.catch) p.catch(() => {});
    const tick = () => { if(!P.playing) return; capture(); if(what === "run") follow(v.currentTime); waveDraw(); if(v.currentTime >= e || v.ended){ const next = P.playing.next; stop(); peaksKeep(); if(next) P.nextT = setTimeout(next, 700); return; } if(what === "run" && ++P.keepN % 600 === 0) peaksKeep(); P.raf = requestAnimationFrame(tick); };
    P.raf = requestAnimationFrame(tick); };
  if(Math.abs(v.currentTime - s) < .05 && v.readyState >= 2) go(); else { v.addEventListener("seeked", go, {once: true}); v.currentTime = Math.max(0, s); }
}
/* the playhead runs on: the waveform turns its page when the head nears the right edge (unless she moved it away), and the line it is in lights up */
function follow(t){
  const [w0, w1] = P.win, w = w1 - w0;
  if(!P.dragging && t >= w0 && t <= w1 + .3 && t > w1 - w * .08){ P.win = [t - w * .08, t - w * .08 + w]; }
  const C = P.cues; if(!C.length) return; let lo = 0, hi = C.length - 1, k = -1;
  while(lo <= hi){ const m = (lo + hi) >> 1; if(C[m].s <= t + .02){ k = m; lo = m + 1; } else hi = m - 1; }
  if(k > -1 && k !== P.cur) setCur(k);
}
function setCur(k, force){
  const L = document.getElementById("pp-cues"); if(!L){ P.cur = k; return; }
  const old = L.querySelector(".cue.cur"), el = L.querySelector(`.cue[data-c="${k}"]`), lr = L.getBoundingClientRect();
  const seen = x => { const a = x.getBoundingClientRect(); return a.bottom > lr.top && a.top < lr.bottom; };
  const lead = force || (!P.mouseDown && (!old || seen(old)));   /* she follows along (her line was on screen) → the list follows; she scrolled away → it stays */
  if(old) old.classList.remove("cur"); P.cur = k;
  if(el){ el.classList.add("cur"); const a = el.getBoundingClientRect();
    if(lead && (a.bottom > lr.bottom - 6 || a.top < lr.top + 2)) L.scrollTo({top: L.scrollTop + (a.top - lr.top) - lr.height * .25, behavior: "smooth"}); }
  markSel();
  nowMark();
}
/* the line that plays on shows ■ (stop) instead of ▶ */
function nowMark(){
  document.querySelectorAll(".cue-pl.stopb").forEach(b => { b.classList.remove("stopb"); b.textContent = P.ctxPick ? "⏮" : "▶"; const l = P.ctxPick ? "Context from this line" : "Play from this line"; b.title = l; b.setAttribute("aria-label", l); });
  if(P.playing && P.playing.what === "run" && !P.ctxPick){ const b = document.querySelector(`.cue[data-c="${P.cur}"] .cue-pl`);
    if(b){ b.classList.add("stopb"); b.textContent = "■"; b.title = "Stop"; b.setAttribute("aria-label", "Stop"); } }
}
/* tools 36 (her 12.11 13:47: «быстро пройтись по списку и проверить, что всё играет»): ▶ in the bank plays exactly what the students will hear — the context, then the piece */
function playBank(id, next){ const x = P.pieces.find(p => p.id === id); if(!x) return; const a = x.ctx != null ? Math.min(x.ctx, x.s) : x.s;
  P.cur = x.c0; winTo(a, x.e); play(a, x.e + TAIL, "bank", {id, next}); setCur(x.c0); }

addEventListener("pagehide", () => { if(P.draft) commitDraft(true); });
addEventListener("resize", waveDraw);
async function copyText(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); let ok = false; try{ ok = document.execCommand("copy"); }catch(x){} ta.remove(); return ok; } }
/* for a chat (Authentic Listening, a lesson chat): the bank by feature, each piece in the decoding block's own form ({{the gap}}) */
function chatText(){
  const shownP = P.pieces.filter(x => !x.hidden), hid = P.pieces.length - shownP.length;   /* hidden pieces stay out of the chat text (they are in ⬇ JSON) */
  const out = [`🎧 Decoding bank · ${P.key} · ${shownP.length} pieces${hid ? ` (+ ${hid} hidden, not here)` : ""} · ${new Date().toLocaleDateString("en-GB")}`];
  const groups = {}; shownP.forEach(x => { (groups[x.f || "_"] = groups[x.f || "_"] || []).push(x); });
  Object.keys(groups).forEach(k => { out.push("", `## ${k === "_" ? "no feature yet" : featName(k)} (${groups[k].length})`);
    bankOrder(groups[k]).forEach(x => { const pp = pieceParts(x); out.push(`${roleOf(x) === "diag" ? "DIAGNOSTIC" : "training"} · ${tm(x.s)}-${tm(x.e)}${x.ctx != null ? ` · ctx ${tm(x.ctx)}` : ""} · ${[x.b2 ? "hard B2" : "", x.c1h ? "hard C1" : ""].filter(Boolean).join(", ") || "no group (reserve)"} · ${pp.pre}{{${pp.gap}}}${pp.post}${x.note ? ` · ${x.note}` : ""} · id ${x.id}`); }); });
  return out.join("\n");
}
/* the start: the filter as she left it; the files remembered by the browser come back with one click (▶ Open … again) */
(() => { const f = store.get("prep-filter"); if(f){ P.from = f.from || ""; P.to = f.to || ""; P.q = f.q || ""; P.whole = f.whole !== false; P.only = !!f.only; } })();
P.status = tableOn() ? "Your code is here: the bank goes to your table" : TABLE_PAGE ? "Enter your code on any homework page to keep the bank in your table" : "This page keeps the bank on this computer · the live page keeps it in your table";
render();
