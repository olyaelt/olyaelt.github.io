<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>__TITLE__</title>
<link rel="stylesheet" href="../../fonts/homework-sans.css">
<style>
__BASE_CSS__
/* ---------- the deck: read, say it another way, flip, Got it / Again ---------- */
.progress{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pd{width:.95rem;height:.95rem;border-radius:50%;background:var(--line);transition:background .25s, transform .25s}
.pd.got{background:var(--ok)}
.pd.again{background:var(--again)}
.pd.pop{animation:dotpop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes dotpop{0%{transform:scale(.3)}55%{transform:scale(1.9)}100%{transform:scale(1)}}
.card.tint-ok{border-color:var(--ok);background:color-mix(in srgb, var(--ok) 16%, var(--card))}
.card.tint-again{border-color:var(--again);background:color-mix(in srgb, var(--again) 20%, var(--card))}
.pd.now{transform:scale(1.35);box-shadow:0 0 0 2px var(--ground), 0 0 0 4px var(--instr)}
.pd.tap{border:0;padding:0;cursor:pointer}
.pd.tap:hover{transform:scale(1.4)}
.pd.looked{transform:scale(1.35);box-shadow:0 0 0 2px var(--ground), 0 0 0 4px var(--muted)}
.card.lookback{border-style:dashed;border-color:var(--muted)}
.card.back-in{animation:dealback .45s cubic-bezier(.2,.8,.2,1)}
@keyframes dealback{from{opacity:0;transform:translateX(-60px) rotate(-2deg)}to{opacity:1;transform:none}}
.card{position:relative;min-height:200px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:2px solid var(--line);
  display:grid;align-content:start;gap:12px;padding:28px 32px 34px;cursor:pointer;transition:border-color .18s, background .18s, transform .15s, box-shadow .15s}
.card:not(.open):hover{transform:translateY(-2px);box-shadow:0 2px 0 rgba(29,29,27,.08), 0 16px 34px rgba(29,29,27,.12)}
.card.open{cursor:default;border-color:var(--instr)}
.card.enter{animation:deal .5s cubic-bezier(.2,.8,.2,1)}
@keyframes deal{from{opacity:0;transform:translateX(60px) rotate(2deg)}to{opacity:1;transform:none}}
.card.card-hidden .say{opacity:.45}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .lbl{font-size:.88rem;letter-spacing:.07em;text-transform:uppercase;font-weight:900;color:var(--label)}
.card .say{font-size:2.05rem;font-weight:700;line-height:1.25;margin:0}
.say .ctx{color:var(--muted);font-weight:500}
/* the key word (tools 4, her decision 27.10): red bold capitals after the sentence, as on her slides and in the homework rewrites */
.kw{color:var(--label);font-weight:900;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;margin-left:.45em}
.back-list .f .kw,.all-row .f .kw{font-size:.9em}
.ans{display:grid;gap:6px;border-top:2px dashed var(--line);padding-top:14px}
.ans .say{color:var(--flip-ink);font-weight:900}
.ans.show{animation:reveal .45s cubic-bezier(.2,.8,.2,1)}
@keyframes reveal{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.card .corner{position:absolute;right:18px;bottom:10px;color:var(--muted);font-size:.9rem}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;min-height:64px}
.actions .btn{min-width:11rem}
.end{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:26px 30px;display:grid;gap:14px}
.end h2{font-size:1.9rem;font-weight:900}
.end p{margin:0}
.back-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.back-list li{background:var(--ground);border-left:5px solid var(--again);border-radius:10px;padding:8px 14px}
.back-list .f{color:var(--muted);display:block;font-size:.95rem}
.back-list .f .ctx{opacity:.75}
.back-list .b{font-weight:900;color:var(--flip-ink);font-size:1.15rem}
.check{display:inline-flex;gap:8px;align-items:center;font-weight:700}
.check input{width:1.1rem;height:1.1rem}
.stage-wrap.enter{animation:deal .45s cubic-bezier(.2,.8,.2,1)}
.head .gear{margin-left:0}
/* the groups' decks on her screen (30.10, her wish): grey = no group has answered the card yet, green = nobody sent it back,
   orange = sent back into the deck, the bigger the more often; tap → the card, to go through it with the class */
.gdots{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:6px 12px;min-height:2.6rem}
.gd-lbl{font-weight:900;font-size:.9rem;margin-right:2px}
.gd{width:var(--s);height:var(--s);border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer;flex:none;transition:transform .2s}
.gd:hover{transform:scale(1.2)}
.gd.gd-ok{background:var(--ok)}
.gd.gd-again{background:var(--again)}
.gd.looked{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--instr)}
.gd-meta{color:var(--muted);font-size:.82rem;margin-left:auto;display:flex;gap:8px;align-items:center}
.gd-meta button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:.82rem;text-decoration:underline;padding:0}
.card .lbl.from-groups{color:var(--again)}
</style>
</head>
<body>
<div class="wrap"><main class="main" id="main"></main><div class="side" id="side"></div></div>
<footer class="legal"><a href="../../impressum.html">Impressum</a> · <a href="../../datenschutz.html">Datenschutz</a></footer>
<script>
const D = __DATA__;
const REVIEW = __REVIEW__;          /* cards from the earlier part, for "+ N from Part 1" (null if none) */
const STICKER = "__STICKER__";
const TOOLS_VERSION = "__TOOLS_VERSION__";
const PAGE_ID = "__PAGE_ID__";       /* e.g. c1-schools/cards-1: the Again list is remembered on this device for the next part */
const LIVE_ON = __LIVE__, LIVE_URL = "__SYNC_URL__";   /* the "-live" page: Olya's changes during the lesson (tools 7) */
__BASE_JS__
const AGAIN_KEY = id => "tool-again-" + id;
let useReview = !!(REVIEW && (params.get("review") === "1"));
let boxOpen = true, settings = false;
let S;
function deck(){
  const own = D.cards.map((c, i) => liveCard(i)).filter(c => !liveHidden("cards." + c.i));
  if(!useReview || !REVIEW) return shuffle(own);
  /* review: first the cards this device marked "Again" in the earlier part, then random ones */
  const again = store.get(AGAIN_KEY(REVIEW.page)) || [];
  const all = REVIEW.cards.map(([f, b, k], i) => ({id: "r" + i, f, b, k, review: true}));
  const first = shuffle(all.filter((c, i) => again.includes(i))), rest = shuffle(all.filter((c, i) => !again.includes(i)));
  return shuffle(own.concat(first.concat(rest).slice(0, REVIEW.n)));
}
/* a card as the groups see it now (live version: her corrections; D itself never changes) */
const liveCard = i => { const [f, b, k] = D.cards[i]; return {id: "o" + i, i, f: liveText(`cards.${i}.0`, f), b: liveText(`cards.${i}.1`, b), k: liveText(`cards.${i}.2`, k || "")}; };
/* her changes arrive: corrected texts go into the deck; removed cards leave it (the one on the screen stays until they answer it) */
function liveAdjust(){
  if(!S) return;
  S.cards.forEach(c => { if(c.id[0] === "o"){ const n = liveCard(c.i); c.f = n.f; c.b = n.b; c.k = n.k; } });
  const gone = id => id[0] === "o" && liveHidden("cards." + id.slice(1));
  const now = S.queue[0];
  S.queue = S.queue.filter((id, j) => j === 0 || !gone(id));
  S.cards = S.cards.filter(c => c.id === now || c.id === S.look || !gone(c.id));
}
/* the first answer from her table, before anyone has tapped: deal the deck again without what she removed */
const liveFresh = () => { if(S && !S.shown && !S.flipped && !S.speak && !S.look) newRound(); };
const liveLabel = p => { const v = pathGet(D, p); return Array.isArray(v) ? v[0].replace(/\(\(|\)\)/g, "") : typeof v === "string" ? v : p; };
const cardTools = c => c && c.id[0] === "o" ? liveTools("cards." + c.i, {fields: `cards.${c.i}.0|cards.${c.i}.1|cards.${c.i}.2`}) : "";
/* ---------- the groups' decks (30.10, her wish): on the -live page each group's ↺ Again / ✓ Got it per card goes to her table
   (a random device id; the name only if a student's code is saved on the device). The counts are never reset (her decision 03:33:
   a page is made for one group, so after the lesson it is a snapshot of where that group struggled, to come back to next time).
   Her screen gets a row of dots in card order: grey = no group has answered it yet, green = answered, nobody sent it back,
   orange = sent back into the deck, the bigger the more often. Tap a dot → that card, to go through it with the class. ---------- */
const SHARE = LIVE_ON && !!LIVE_URL, sharing = () => SHARE && !liveTeacher();
const DEV = (() => { const ok = d => /^[a-z0-9]{12,40}$/.test(d || ""), make = () => Array.from({length: 16}, () => "abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(Math.random() * 36)]).join("");
  try{ let d = localStorage.getItem("tool-dev"); if(!ok(d)){ d = make(); localStorage.setItem("tool-dev", d); } return d; }catch(e){ return make(); } })();
const studentCode = () => { try{ return localStorage.getItem("hw-role") === "teacher" ? "" : (localStorage.getItem("hw-code") || ""); }catch(e){ return ""; } };
const DKEY = "tool-deckstats-" + PAGE_ID;
let DS = (() => { const v = store.get(DKEY); return v && v.again && Array.isArray(v.got) ? v : {again: {}, got: []}; })(), dsT = null;
function deckNote(id, ok){
  if(!sharing() || !id || id[0] !== "o") return; const i = pidOf("cards", +id.slice(1));   /* kept by the card's permanent number */
  if(ok){ if(!DS.got.includes(i)) DS.got.push(i); } else DS.again[i] = (DS.again[i] || 0) + 1;
  store.set(DKEY, DS); clearTimeout(dsT); dsT = setTimeout(deckSend, 2000);
}
async function deckSend(){
  dsT = null; const res = await livePost({action: "toolDeck", tool: PAGE_ID, dev: DEV, code: studentCode(), again: DS.again, got: DS.got});
  if(!res.ok && ["offline", "busy", "server"].includes(res.error)) dsT = setTimeout(deckSend, 10000);
}
let GD = {decks: [], err: "", loaded: false}, gdBusy = false;
const GSINCE = "tool-deck-since-" + PAGE_ID;
async function gdFetch(){
  if(!liveTeacher() || gdBusy) return; gdBusy = true;
  const res = await livePost({action: "toolList", tool: PAGE_ID, code: localStorage.getItem("hw-code") || ""});
  gdBusy = false;
  if(res.ok && Array.isArray(res.decks)){ GD.decks = res.decks; GD.loaded = true; GD.err = ""; GD.skew = (Number(res.now) || Date.now()) - Date.now(); }
  else GD.err = res.ok || res.error === "no-page" ? "old-script" : (res.error || "error");
  paintGroupDots();
}
if(liveTeacher()){ setTimeout(gdFetch, 400); setInterval(() => { if(!document.hidden) gdFetch(); }, 15000); }
function groupStats(){
  const since = Number(store.get(GSINCE)) || 0, rows = GD.decks.filter(r => r.ts >= since);
  return {n: rows.length, hidden: GD.decks.length - rows.length, card: i => rows.reduce((s, r) => { const a = Number((r.again || {})[i]) || 0;
    return {again: s.again + a, groups: s.groups + (a ? 1 : 0), got: s.got + ((r.got || []).includes(i) ? 1 : 0)}; }, {again: 0, groups: 0, got: 0})};
}
const plainFront = i => liveCard(i).f.replace(/\(\(|\)\)/g, "");
function groupDotsHTML(){
  if(!liveTeacher() || S.speak) return "";
  const st = groupStats();
  const tip = s => s.again ? `back into the deck ${s.again}× (${s.groups} screen${s.groups === 1 ? "" : "s"})` : s.got ? `got it — nobody sent it back` : "no group has answered it yet";
  const dots = D.cards.map((_, i) => { if(liveHidden("cards." + i)) return ""; const s = st.card(pidOf("cards", i));
    const size = s.again ? Math.min(2.2, 1.1 + .3 * s.again) : .95;
    return `<button class="gd ${s.again ? "gd-again" : s.got ? "gd-ok" : ""} ${S.look === "o" + i ? "looked" : ""}" style="--s:${size.toFixed(2)}rem" data-gd="o${i}" title="${esc(plainFront(i))} — ${tip(s)}" aria-label="Card ${i + 1}: ${tip(s)}"></button>`; }).join("");
  const meta = GD.err === "old-script" ? "⚠️ redeploy the script (Deploy → New version)" : GD.err ? "⚠️ not updated: " + (GD.err === "offline" ? "no connection" : GD.err)
    : !GD.loaded ? "loading…" : `${st.n} screen${st.n === 1 ? "" : "s"} · every 15 s${st.n ? ` <button data-gd-copy>${GD.copied || "📋 Copy the hard cards"}</button> <button data-gd-fresh>${GD.sure ? "Hide these? Tap again" : "🧹 Start fresh"}</button>` : ""}${st.hidden ? ` <button data-gd-all>Show ${st.hidden} older</button>` : ""}`;
  return `<div class="gdots" id="gdots"><span class="gd-lbl">👥 The groups:</span>${dots}<span class="gd-meta">${meta}</span></div>`;
}
function wireGroupDots(root){
  root.querySelectorAll("[data-gd]").forEach(b => b.addEventListener("click", () => { const id = b.dataset.gd; if(!byId(id)) return;
    S.look = S.look === id ? null : id; S.lookFrom = S.look ? "groups" : null; S.lookOpen = false; S.fresh = true; render(); }));
  root.querySelectorAll("[data-gd-fresh]").forEach(b => b.addEventListener("click", () => { if(!GD.sure){ GD.sure = true; paintGroupDots(); return; }
    GD.sure = false; store.set(GSINCE, Date.now() + (GD.skew || 0)); paintGroupDots(); }));
  root.querySelectorAll("[data-gd-all]").forEach(b => b.addEventListener("click", () => { store.set(GSINCE, 0); paintGroupDots(); }));
  root.querySelectorAll("[data-gd-copy]").forEach(b => b.addEventListener("click", async () => {
    const t = hardCardsText(); GD.copied = !t ? "Nothing sent back yet" : (await copyText(t)) ? "Copied ✓" : "Couldn't copy"; paintGroupDots();
    setTimeout(() => { GD.copied = ""; paintGroupDots(); }, 2200); }));
}
/* 📋 for the next lesson and the homework: the cards sent back, most often first, front → answer */
function hardCardsText(){
  const st = groupStats(), plain = s => String(s).replace(/\(\(|\)\)/g, "");
  const hard = D.cards.map((_, i) => ({i, s: st.card(pidOf("cards", i))})).filter(x => x.s.again && !liveHidden("cards." + x.i)).sort((a, b) => b.s.again - a.s.again || a.i - b.i);
  if(!hard.length) return "";
  const ok = D.cards.filter((_, i) => { const s = st.card(pidOf("cards", i)); return s.got && !s.again; }).length, none = D.cards.filter((_, i) => { const s = st.card(pidOf("cards", i)); return !s.got && !s.again; }).length;
  return [`${D.title}${D.part ? " (" + D.part + ")" : ""} — the cards sent back into the deck`].concat(hard.map(x => { const c = liveCard(x.i);
    return `${x.s.again}×${x.s.groups > 1 ? ` (on ${x.s.groups} screens)` : ""} · ${plain(c.f)}${c.k ? " " + c.k.toUpperCase() : ""} → ${c.b}`; }), "", `Got it, never sent back: ${ok} · not reached: ${none}`).join("\n");
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
  let ok = false; try{ ok = document.execCommand("copy"); }catch(e){} ta.remove(); return ok;
}
/* only the row of dots changes when new counts come in (the card she is showing stays as it is) */
function paintGroupDots(){ const el = document.getElementById("gdots"); if(!el) return; const h = groupDotsHTML(); if(el.outerHTML === h) return;
  el.insertAdjacentHTML("afterend", h); el.remove(); wireGroupDots(document.getElementById("gdots").parentElement); }
function newRound(cards){
  const list = cards || deck();
  S = { cards: list, queue: list.map(c => c.id), got: new Set(), again: new Set(), shown: 0, flipped: false, fresh: true };
}
newRound();
const byId = id => S.cards.find(c => c.id === id);
/* flip in place, so the card turns over (a full re-render would just swap it) */
function flip(){
  if(!S.queue.length || S.flipped || S.busy) return; S.flipped = true;
  const card = document.querySelector(".card"), act = document.querySelector(".actions");
  if(!card || !act){ render(); return; }
  card.classList.remove("enter"); card.classList.add("open"); card.removeAttribute("role"); card.removeAttribute("tabindex");
  const ans = card.querySelector(".ans"); ans.hidden = false; ans.classList.add("show");
  const corner = card.querySelector(".corner"); if(corner) corner.remove();
  act.innerHTML = actionsHTML(); wireActions();
  const first = act.querySelector("[data-got]"); if(first) first.focus({preventScroll: true});
}
/* the front: ((…)) is grey context; a card's key word (cards: [[front, back, key]]) follows the sentence in red capitals */
const fHTML = (s, k) => esc(s).replace(/\(\((.+?)\)\)/g, '<span class="ctx">$1</span>') + (k ? ` <span class="kw">${esc(k)}</span>` : "");
/* Got it / Again: the card lights up green or orange, grows a little and flies into its dot, which fills with that colour */
function answer(ok){
  if(S.busy || !S.queue.length) return;
  const id = S.queue[0], scene = document.querySelector(".scene"), back = document.querySelector(".card"), dot = document.querySelector(`.pd[data-id="${id}"]`);
  if(!scene || !dot || calm()){ commit(ok); return; }
  S.busy = true;
  document.querySelectorAll(".actions button").forEach(b => b.disabled = true);
  if(back) back.classList.add(ok ? "tint-ok" : "tint-again");
  const a = scene.getBoundingClientRect(), d = dot.getBoundingClientRect();
  const dx = d.left + d.width / 2 - (a.left + a.width / 2), dy = d.top + d.height / 2 - (a.top + a.height / 2);
  scene.animate([
    {transform: "none", opacity: 1},
    {transform: "scale(1.05)", opacity: 1, offset: .32},
    {transform: `translate(${dx}px, ${dy}px) scale(.03)`, opacity: .35}], {duration: 720, easing: "cubic-bezier(.55,0,.25,1)"}).onfinish = () => { S.busy = false; commit(ok); };
}
function commit(ok){
  const id = S.queue.shift();
  deckNote(id, ok);   /* the -live page: this group's counts go to her table */
  if(ok) S.got.add(id);
  else { S.again.add(id); const k = 2 + Math.floor(Math.random() * 2); if(S.queue.length >= k) S.queue.splice(k, 0, id); else S.queue.push(id); }
  S.flipped = false; S.shown++; S.fresh = true; S.popId = id;
  const ended = !S.queue.length;
  if(ended){ const mine = [...S.again].filter(x => x[0] === "o").map(x => +x.slice(1)); store.set(AGAIN_KEY(PAGE_ID), mine); }
  render();
  if(ended) confetti(document.querySelector(".end h2"));   /* the end of the deck gets its moment, as in the homework (no score) */
}
function headHTML(){
  return `<header class="head"><span class="part">${esc(D.part)}</span><h1>${esc(D.title)}</h1>
      ${D.speaking && D.speaking.length ? stagesHTML([["cards", "🃏 Cards"], ["speak", "💬 Speaking"]], S.speak ? "speak" : "cards") : ""}
      ${REVIEW ? `<button class="gear" data-settings aria-expanded="${settings}" aria-label="Settings" title="Settings">⚙</button>` : ""}</header>
    ${settings ? `<div class="settings"><label class="check"><input type="checkbox" data-review ${useReview ? "checked" : ""}> Add ${REVIEW.n} cards from ${esc(REVIEW.part)}</label></div>` : ""}
    ${S.speak ? "" : `<p class="hint-top">${esc(D.hint || "Think together. Take turns to say it another way — the others agree or not. Then tap the card to check.")}</p>`}`;
}
/* the dots: a card already answered can be tapped to look at it again (her case: one student pressed Got it, the other hadn't finished reading) */
function progressHTML(){
  const now = S.queue[0];
  return `<div class="progress">${S.cards.map(c => { const seen = S.got.has(c.id) || S.again.has(c.id), cls = `pd ${S.got.has(c.id) ? "got" : S.again.has(c.id) ? "again" : ""} ${c.id === now && !S.look ? "now" : ""} ${c.id === S.look ? "looked" : ""} ${c.id === S.popId ? "pop" : ""}`;
    return seen && c.id !== now ? `<button data-id="${c.id}" data-look="${c.id}" class="${cls} tap" aria-label="Look at this card again"></button>` : `<span data-id="${c.id}" class="${cls}" aria-hidden="true"></span>`; }).join("")}</div>`;
}
function lookHTML(){
  const c = byId(S.look), wasGot = S.got.has(c.id), shut = S.lookFrom === "groups" && !S.lookOpen;   /* her 👥 dot (31.10): the front first, so the group does it again */
  return `<div class="scene"><div class="card ${shut ? "" : "open"} lookback ${S.fresh ? "back-in" : ""}" ${shut ? `data-lookflip role="button" tabindex="0" aria-label="Show the answer"` : ""}>
      ${S.lookFrom === "groups" && liveTeacher() ? (() => { const s = groupStats().card(pidOf("cards", c.i)); return `<span class="lbl from-groups">👥 ${s.again ? `Back into the deck ${s.again}× · ${s.groups} screen${s.groups === 1 ? "" : "s"}` : s.got ? "Nobody sent it back" : "No group has answered it yet"}</span>`; })() : `<span class="lbl">Looking back</span>`}
      <p class="say">${fHTML(c.f, c.k)}</p>
      ${shut ? `<span class="corner">tap to check ↓</span>` : `<div class="ans"><p class="say">${esc(c.b)}</p></div>`}
    </div></div>
    <div class="actions">${wasGot ? `<button class="btn again" data-look-again>↺ Again — back into the deck</button>` : ""}<button class="btn primary" data-look-done>Back to the cards →</button></div>`;
}
function lookAgain(){   /* it was "Got it", but they want it once more: it goes back into the deck, 2–3 cards later */
  const id = S.look; S.got.delete(id); S.again.add(id); deckNote(id, false);
  if(!S.queue.includes(id)){ const k = 2 + Math.floor(Math.random() * 2); if(S.queue.length >= k) S.queue.splice(k, 0, id); else S.queue.push(id); }
  S.look = null; S.popId = id; render();
}
function cardHTML(){
  const c = byId(S.queue[0]);
  return `<div class="scene"><div class="card ${S.flipped ? "open" : ""} ${S.fresh ? "enter" : ""} ${c.id[0] === "o" && liveTeacher() && liveHidden("cards." + c.i) ? "card-hidden" : ""}" data-flip data-live-host ${S.flipped ? "" : `role="button" tabindex="0" aria-label="Show the answer"`}>
      <span class="card-top"><span class="lbl">${c.review ? `From ${esc(REVIEW.part)}` : "Say it another way"}</span>${cardTools(c)}</span>
      <p class="say">${fHTML(c.f, c.k)}</p>
      <div class="ans" ${S.flipped ? "" : "hidden"}><p class="say">${esc(c.b)}</p></div>
      ${S.flipped ? "" : `<span class="corner">tap to check ↓</span>`}
    </div></div>
    <div class="actions">${actionsHTML()}</div>`;
}
const actionsHTML = () => S.flipped
  ? `<button class="btn again" data-again>↺ Again later</button><button class="btn ok" data-got>✓ Got it</button>` : "";
function wireActions(){
  document.querySelectorAll("[data-again]").forEach(b => b.addEventListener("click", () => { againHint(document.querySelector(".scene") || document.querySelector(".card")); answer(false); }));
  document.querySelectorAll("[data-got]").forEach(b => b.addEventListener("click", () => answer(true)));
}
function endHTML(){
  const back = S.cards.filter(c => S.again.has(c.id));
  return `<section class="end"><h2>${back.length ? "Done! Come back to these" : "Done! You got them all"}</h2>
    ${back.length ? `<ul class="back-list">${back.map(c => `<li><span class="f">${fHTML(c.f, c.k)}</span><span class="b">${esc(c.b)}</span></li>`).join("")}</ul>`
      : `<p>No cards to come back to this time.</p>`}
    <div class="row-actions">${back.length ? `<button class="btn" data-redo>Go through these again</button>` : ""}${D.speaking && D.speaking.length ? `<button class="btn primary" data-speak>💬 Speaking →</button>` : `<button class="btn" data-restart>All the cards again</button>`}</div></section>`;
}
/* after the speaking tasks: the hard cards again, or all of them — so the task never runs out */
function speakView(){
  const hard = S.cards.filter(c => S.again.has(c.id)).length;
  return speakHTML(liveList(D.speaking, "speaking"), `${hard ? `<button class="btn" data-redo>The hard cards again</button>` : ""}<button class="btn primary" data-restart>All the cards again</button>`);
}
function render(){
  liveApply();   /* her latest changes, at the group's tap (live version) */
  const main = document.getElementById("main"), side = document.getElementById("side");
  if(!S.look) S.lookFrom = null;
  main.innerHTML = liveBarHTML(liveLabel) + headHTML() + groupDotsHTML() + (S.speak ? `<section class="stage-wrap ${S.stageIn ? "enter" : ""}">${speakView()}</section>` : progressHTML() + (S.look ? lookHTML() : S.queue.length ? cardHTML() : endHTML()));
  wireSpeak(main, render); wireGroupDots(main);
  /* 📋 under the box: a fallback for her, not something to invite a click (27.10) */
  const st = side.scrollTop;
  side.innerHTML = (boxOpen ? boxHTML(D.box, {clickable: true, collapsible: true}) : `<div class="peek"><button class="btn" data-box-show>Show the box</button></div>`)
    + allHTML("All the cards", S.cards.concat(liveTeacher() ? D.cards.map((_, i) => i).filter(i => liveHidden("cards." + i) && !S.cards.some(c => c.i === i)).map(liveCard) : [])
        .map(c => `<div class="all-row live-host ${c.id[0] === "o" ? liveDim("cards." + c.i) : ""}" data-live-host><span><span class="f">${fHTML(c.f, c.k)}</span><span class="b">${esc(c.b)}</span></span>${cardTools(c)}</div>`).join(""));   /* her screen: hidden cards too, greyed */
  side.scrollTop = st; wireAll(side); wireBox(side, render);
  wireLive(main, p => pathGet(D, p) || ""); wireLive(side, p => pathGet(D, p) || "");
  S.fresh = false; S.popId = null; S.stageIn = false;
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(b => b.addEventListener("click", () => fn(b)));
  on("[data-flip]", flip); wireActions();
  on("[data-look]", b => { S.look = b.dataset.look === S.look ? null : b.dataset.look; S.fresh = true; render(); });
  on("[data-look-done]", () => { S.look = null; S.fresh = true; render(); });
  on("[data-lookflip]", () => { S.lookOpen = true; render(); });
  on("[data-look-again]", lookAgain);
  on("[data-speak]", () => { S.speak = true; spkReset(); S.look = null; S.stageIn = true; render(); scrollTo(0, 0); });
  on("[data-stage]", b => { const sp = b.dataset.stage === "speak"; if(sp === !!S.speak || S.busy) return; S.speak = sp; S.look = null; S.fresh = true; S.stageIn = sp; render(); scrollTo(0, 0); });
  on("[data-redo]", () => { newRound(shuffle(S.cards.filter(c => S.again.has(c.id)))); render(); });
  on("[data-restart]", () => { newRound(); render(); });
  on("[data-settings]", () => { settings = !settings; render(); });
  on("[data-box-toggle]", () => { boxOpen = false; render(); });
  on("[data-box-show]", () => { boxOpen = true; render(); });
  document.querySelectorAll("[data-review]").forEach(x => x.addEventListener("change", () => { useReview = x.checked; newRound(); render(); }));
}
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("input, textarea")) return;
  if(S.speak) return;
  if(S.look){ if(e.key === "Escape"){ S.look = null; S.fresh = true; render(); } return; }
  if(!S.queue.length) return;
  if(e.key === " " || e.key === "Enter"){ if(e.target.closest && e.target.closest("button, a, label")) return; e.preventDefault(); flip(); }
  else if(S.flipped && (e.key === "1" || e.key === "ArrowLeft")) answer(false);
  else if(S.flipped && (e.key === "2" || e.key === "ArrowRight")) answer(true);
});
liveRerender = () => render();
render();
</script>
</body>
</html>
