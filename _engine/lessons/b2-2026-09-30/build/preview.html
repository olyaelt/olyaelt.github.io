<title>What have you been up to? homework</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../fonts/homework-sans.css">
<style>
/* Layout: one calm column like a slide on a phone — task list home, then one task step per screen with a sticky action bar. Colours are Olya's deck colours. */
:root{
  --ground:#F6F1DC;      /* the cream frame around her slides */
  --card:#FFFFFF;
  --ink:#1D1D1B;
  --muted:#6B6B6B;
  --line:#D9D2B8;
  --instr:#0693E3;       /* blue instruction box */
  --instr-ink:#FFFFFF;
  --answer:#0000FF;      /* blue answers */
  --label:#E00000;       /* red category labels, key words */
  --hl:#FFFF00;          /* yellow hidden answers */
  --hl-ink:#1D1D1B;
  --share:#00FF00;       /* green: share your reaction */
  --gloss:#0693E3;
  --ipa:#0E8A7E;
  --bubble:#FFFF8C;
  --bubble-ink:#1D1D1B;
  --bubble-line:#1D1D1B;
  --summary:#D9EAD3;     /* green box from the spreadsheet */
  --done:#2E8B3E;
  --date-bg:#FF9900;
  --rec:#D93025;
  --topic-a:#FFF3CF; --topic-b:#E2EFFB;
  --ok-bg:#EAF7EC; --ok-chip:#CDEFD3; --ok-ink:#1E6B2E;
  --no-bg:#FDECEB; --no-chip:#F9D2CF; --no-ink:#A1261B;
  --good-hl:#BFF2B8; --strike:#9A9A9A; --fix-bg:#D6E6FF; --note-ink:#0B2F8F; --note-bg:#DCE9FF; --note-line:#7FA6E8; --next-line:#6DBA7C;
  --date-ink:#1D1D1B;
  --fig-filter:none;
  --font-body:"Homework Sans","Calibri","Carlito","Segoe UI",system-ui,sans-serif;
  --step-0:clamp(1rem,0.96rem + 0.2vw,1.0625rem);
  --step-1:clamp(1.125rem,1.06rem + 0.3vw,1.25rem);
  --step-2:clamp(1.375rem,1.25rem + 0.6vw,1.625rem);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121416; --card:#1C1F23; --ink:#ECECEA; --muted:#A4A7AB; --line:#33373D;
    --instr:#1578C0; --instr-ink:#FFFFFF; --answer:#8FB0FF; --label:#FF7A7A;
    --hl:#FFF34D; --hl-ink:#111111; --share:#52F552; --gloss:#5BB8F5; --ipa:#4CC5B3;
    --bubble:#3B391F; --bubble-ink:#F3F0D0; --bubble-line:#8C8760; --summary:#22362A; --done:#62C774;
    --fig-filter:invert(1) hue-rotate(180deg);
    --ok-bg:#18301E; --ok-chip:#24502E; --ok-ink:#9BE3A8; --no-bg:#3A1E1C; --no-chip:#5A2622; --no-ink:#FFB4AB; --good-hl:#BFF2B8; --strike:#8A8D91; --fix-bg:#22345A; --note-ink:#F2F5FF; --note-bg:#30518C; --note-line:#6F95D9; --next-line:#6FC481; --topic-a:#2A2614; --topic-b:#162636;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121416; --card:#1C1F23; --ink:#ECECEA; --muted:#A4A7AB; --line:#33373D;
  --instr:#1578C0; --instr-ink:#FFFFFF; --answer:#8FB0FF; --label:#FF7A7A;
  --hl:#FFF34D; --hl-ink:#111111; --share:#52F552; --gloss:#5BB8F5; --ipa:#4CC5B3;
  --bubble:#3B391F; --bubble-ink:#F3F0D0; --bubble-line:#8C8760; --summary:#22362A; --done:#62C774;
  --fig-filter:invert(1) hue-rotate(180deg);
  --ok-bg:#18301E; --ok-chip:#24502E; --ok-ink:#9BE3A8; --no-bg:#3A1E1C; --no-chip:#5A2622; --no-ink:#FFB4AB; --good-hl:#BFF2B8; --strike:#8A8D91; --fix-bg:#22345A; --note-ink:#F2F5FF; --note-bg:#30518C; --note-line:#6F95D9; --next-line:#6FC481; --topic-a:#2A2614; --topic-b:#162636;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--font-body);font-size:var(--step-0);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--instr);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- home ---------- */
.lesson-head{display:grid;gap:6px;padding-block:8px 18px}
.date{display:inline-flex;align-self:start;justify-self:start;font-weight:900;letter-spacing:.04em;font-size:.85rem;
  background:var(--date-bg);color:var(--date-ink);padding:3px 10px;border-radius:6px}
.lesson-head h1{font-size:var(--step-2);line-height:1.2;font-weight:900}
.lesson-head p{margin:0;color:var(--muted)}
details.summary{background:var(--summary);border-radius:var(--radius);padding:12px 16px;margin-bottom:22px}
details.summary summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.summary summary::-webkit-details-marker{display:none}
details.summary summary::after{content:"Show";font-weight:400;color:var(--muted)}
details.summary[open] summary::after{content:"Hide"}
.summary ul{margin:10px 0 2px;padding:0;list-style:none;display:grid;gap:6px}
.summary li b{font-weight:700}
.ru{font-style:italic;color:var(--muted)}
.ipa{color:var(--ipa);font-style:normal;white-space:nowrap}
.ipa.o{color:#B45309}
/* engine 47 (her wish 29.10): "More about these phrases" — what the glossaries said, folded under the Useful language box */
.box details.box-more{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.box details.box-more summary{cursor:pointer;font-weight:700;color:var(--instr);font-size:.92em}
.box-more .bm-in{display:grid;gap:3px;margin-top:6px;font-size:.88em}
.box-more h5{margin:8px 0 1px;color:var(--label);font-size:.85em;letter-spacing:.07em;font-weight:900}
.box-more .bm-row{margin:0;line-height:1.4}
.box-more .m{color:var(--muted)}
.box-more .bm-strip{border:2px solid var(--line);border-radius:8px;padding:4px 10px 6px;margin-top:8px}
.box-more .bm-strip h5{margin-top:2px}
.box-more .bm-strip p{margin:0;line-height:1.45}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ipa.o{color:#F6B26B} }
:root[data-theme="dark"] .ipa.o{color:#F6B26B}
.section{display:grid;gap:10px;margin-bottom:22px}
.section h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:900}
.all-hw{justify-self:start;color:var(--instr);font-weight:700;text-decoration:none;margin-bottom:6px}
.sync{margin:0 0 16px}
.sync-on{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;color:var(--muted);font-size:.95rem}
.sync-card{background:var(--card);border:2px solid var(--instr);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.sync-row{display:flex;gap:8px}
.sync-row input{flex:1;min-width:0;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sync-card .small{margin:0}
.sync-msg:empty{display:none}
.sync-card .sync-msg{color:var(--ink);font-weight:700}
.linklike{background:none;border:0;padding:0;color:var(--instr);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.total{font-size:.92rem}
.slow-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spd-l{font-weight:700}
.spd{display:inline-flex;border:2px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card)}
.spd button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--ink);padding:6px 13px;min-width:46px;cursor:pointer}
.spd button+button{border-left:2px solid var(--line)}
.spd button[aria-pressed="true"]{background:var(--instr);color:var(--instr-ink)}
.react{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;font-weight:400;color:var(--ink)}
.chips{display:inline-flex;gap:6px}
.chip{font:inherit;font-weight:700;border:2px solid var(--ok-ink);background:transparent;color:var(--ok-ink);border-radius:99px;padding:4px 12px;cursor:pointer}
.chip.on{background:var(--ok-ink);color:var(--card)}
.ask-box{display:grid;gap:8px;margin-top:10px}
.ask-box textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.react-msg{margin:6px 0 0;font-weight:400}
.react-msg:empty{display:none}
.fb-q{margin:0;font-style:italic}
.teacher .status{display:none}
.teacher .task-btn{padding-right:16px!important}
.teacher-bar{align-items:center}
.preview-bar{align-items:center;background:var(--card);border:2px dashed var(--instr);border-radius:12px;padding:8px 12px;color:var(--ink)}
.chip-t{font:inherit;font-size:.9rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 12px;cursor:pointer}
.chip-t[aria-pressed="true"]{border-color:var(--instr);background:var(--instr);color:var(--instr-ink)}
.t-strip{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;width:100%;margin:0 0 12px;padding:9px 12px;text-align:left;font:inherit;font-size:.95rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;cursor:pointer}
.t-strip.open{border-left-color:var(--instr)}
/* engine 41: a task for later (not in the total time) and, for her, the TubeQuizard copy of a listening task */
.later-tag{display:inline-block;vertical-align:.15em;font-size:.72rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1.5px solid var(--line);border-radius:99px;padding:0 8px;margin-left:4px;white-space:nowrap}
.tq-link{margin:4px 2px 0;font-size:.9rem;color:var(--muted)}
.tq-alt{margin:4px 2px 0;font-size:.9rem;color:var(--muted)}.tq-alt a{color:var(--instr)}
.tq-link button{font:inherit;background:none;border:0;padding:0;color:var(--instr);text-decoration:underline;cursor:pointer}

.t-strip-go{color:var(--instr);font-weight:700;white-space:nowrap}
.t-line{display:flex;flex-wrap:wrap;align-items:center;gap:5px;width:100%;text-align:left;background:transparent;border:0;padding:8px 4px 2px;cursor:pointer;font:inherit}
.t-chip{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-size:.8rem;font-weight:700}
.t-chip.on{background:var(--done);border-color:var(--done);color:#fff}
.t-chip.wide{margin:2px 0}
.t-count{font-weight:700;color:var(--muted);font-size:.9rem}
.t-badges{margin-left:auto;font-size:.88rem;color:var(--muted)}
.t-line.hot .t-badges{color:var(--label)}
.hot{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin:0 0 16px;border-left:5px solid var(--label)}
.hot ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.hot .small{margin:4px 0 0}
.hot.unl-note{border-left-color:var(--muted);border-style:dashed}
.hot.unl-note.is-pub{border:0;border-left:5px solid var(--done)}
.t-pub{margin:8px 0 0}
.tool.primary-t{background:var(--instr);border-color:var(--instr);color:var(--instr-ink)}
.tool[disabled]{opacity:.5;cursor:default}
.tool.rv-ok{background:var(--good-hl);color:var(--hl-ink)}
.t-mkbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:-4px 0 12px}
.t-mkbar:empty{display:none}
.t-mk-h{font-weight:700;color:var(--label);font-size:.95rem}
.t-mk-go.on{box-shadow:inset 0 0 0 2px var(--label)}
.t-mk-go.is-done{opacity:.6}
.t-marked{box-shadow:inset 0 0 0 3px var(--label);border-radius:10px}
.say-row.t-marked{padding-left:10px;padding-right:10px}
.t-marked-done{box-shadow:inset 0 0 0 2px var(--line)}
.t-mk-who{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:.9rem;font-weight:700;color:var(--label);margin:0 0 4px}
.t-mk-who.is-done{color:var(--muted)}
.t-mk-note{font-weight:400;color:var(--ink)}
.hot.fbnew{border:2px solid var(--label);border-left-width:6px}
.hot.fbnew>b{color:var(--label)}
.hot.fbnew li span{color:var(--muted);font-size:.9rem}
.fb-read{margin-top:10px}
.fb-isread{color:var(--done);font-weight:700;margin:8px 0 0}
.hot.wait{border-left-color:var(--instr)}
.hot.wait li span{color:var(--muted);font-size:.9rem}
.t-item.t-focus{outline:3px solid var(--instr);outline-offset:2px}
.t-panel p{margin:0}
.t-item{margin-top:12px}
.t-task{margin-bottom:12px}
.t-item .task-peek{margin:6px 0 8px}
.t-text{background:var(--ground);border-radius:10px;padding:10px 12px;line-height:1.6}
.t-link{color:var(--instr);font-weight:700}
.t-tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{font:inherit;font-weight:700;border-radius:8px;padding:5px 10px;cursor:pointer;border:2px solid var(--line);background:var(--card)}
.tool.good{background:var(--good-hl);color:var(--hl-ink)}
.tool.del{color:var(--strike);text-decoration:line-through}
.tool.ins{color:#0000FF;background:var(--hl)}
.tool.cmt{color:var(--note-ink);background:var(--note-bg)}
.t-ta{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.t-prev{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;min-height:2em}
.t-fb{display:grid;gap:8px;margin-top:8px}
.t-prev-h{margin-bottom:-4px}
.t-copy{margin-left:auto}
.t-msg{align-self:center}
.hot.wait .tool{margin-left:8px;font-size:.9rem;padding:3px 8px}
.t-prev:empty{display:none}
.t-msg:empty{display:none}
.mk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--instr);font:inherit;font-weight:900;font-size:.95rem;line-height:1;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;margin-left:6px;padding:0}
.mk.on{background:var(--instr);border-color:var(--instr);color:var(--instr-ink)}
.mk.demo{width:22px;height:22px;font-size:.8rem;margin:0 2px;cursor:default}
.mk-row{margin:0;display:flex;justify-content:flex-end}
.mk-right{margin-top:-4px}
.mk-hint{margin:0;font-size:.88rem;color:var(--muted);text-align:right}
.ln{position:relative}
.ln .mk{position:absolute;right:8px;top:8px}
.say-a{display:flex;align-items:center;gap:6px}
.say-a .reveal{flex:1}
.ln.has-mk{padding-right:46px}
.flagged{margin-top:10px;display:grid;gap:6px;font-weight:400;color:var(--ink)}
.fl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:var(--card);border-radius:10px;padding:6px 10px}
.fl-s{font-style:italic}
.note-box{display:flex;gap:6px;width:100%}
.note-box input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--ground);color:var(--ink)}
.note-box .btn{min-height:36px;padding:0 12px}
.meter{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin:0 0 16px;display:grid;gap:8px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.meter-top span{font-weight:900;color:var(--ink)}
.strip{display:flex;gap:3px;background:#1D1D1B;border-radius:6px;padding:9px 6px;position:relative}
.strip::before,.strip::after{content:"";position:absolute;left:6px;right:6px;height:3px;background:repeating-linear-gradient(90deg,#F6F1DC 0 5px,transparent 5px 11px);opacity:.55}
.strip::before{top:3px}.strip::after{bottom:3px}
.strip i{flex:1;height:22px;border-radius:2px;background:#3A3A36}
.strip i.on{background:linear-gradient(180deg,#FFE066,#FF9900)}
.meter .small{margin:0}
.gate-note{margin:4px 2px 0;color:var(--muted)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,520px);background:#1D1D1B;color:#fff;font-weight:700;padding:12px 16px;border-radius:12px;z-index:61;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .5s}
.toast.out{opacity:0}
.topic-earlier{background:var(--card);border:2px dashed var(--line)}
.task-wrap{display:grid;gap:0}
.fb-line{display:block;width:100%;text-align:left;margin-top:-6px;padding:12px 14px 8px;border-radius:0 0 12px 12px;font:inherit;font-size:.92rem;font-weight:700;border:0;background:var(--note-bg);color:var(--note-ink);cursor:pointer}
.fb-line.is-new::after{content:" • new";color:var(--label)}
.fb-wait{background:transparent;color:var(--muted);font-weight:400;cursor:default;padding:8px 4px 0;margin-top:0}
.fb-key{margin:0 0 10px}
.fb-item{margin-bottom:12px}
.fb-text{font-size:var(--step-1);line-height:1.6}
.fb-good{background:var(--good-hl);color:var(--hl-ink);border-radius:2px;padding:0 2px;font-weight:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fb-del{text-decoration:line-through;text-decoration-thickness:2px;color:var(--strike)}
.fb-ins{color:#0000FF;font-weight:900;background:var(--hl);border-radius:3px;padding:0 2px;text-decoration:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fb-note{color:var(--note-ink);font-weight:400;font-size:.95em;background:var(--note-bg);border-radius:3px;padding:1px 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fb-overall{margin:0 0 14px;padding:10px 14px 12px;border:2px solid var(--note-line);border-left-width:6px;border-radius:12px;background:var(--card);color:var(--ink);line-height:1.55}
.fb-overall.fb-next{margin:14px 0 0;border-color:var(--next-line)}
.fb-overall-h{font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.fb-orig summary{cursor:pointer;color:var(--muted)}
.fb-sent{margin-top:6px;white-space:normal}
.task-row{position:relative}
.task-row .status{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--card);cursor:pointer;padding:0;width:38px;height:38px;font-size:1.05rem}
.task-row.is-done .status{border-color:var(--done);background:var(--done);color:var(--card)}
.task-btn{display:grid;grid-template-columns:1fr;align-items:center;gap:12px;padding-right:62px!important;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;
  transition:transform .12s ease,border-color .12s ease}
.task-btn:hover{border-color:var(--instr)}
.task-btn:active{transform:scale(.99)}
.task-btn .t{font-weight:700;font-size:var(--step-1);line-height:1.3}
.task-btn .m{color:var(--muted);font-size:.9rem;margin-top:2px}
.task-btn .alt{font-size:.9rem;margin-top:6px}
.status{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:transparent}
.done-banner{background:var(--ok-bg);color:var(--ok-ink);font-weight:700;border-radius:12px;padding:10px 14px;margin-bottom:10px}
.foot{color:var(--muted);font-size:.88rem;display:grid;gap:4px;padding-top:6px}

/* ---------- task view ---------- */
.taskbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px 10px;display:grid;gap:8px}
.taskbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--instr);font-weight:700}
.count{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--instr);width:0;transition:width .25s ease}
.task-title{font-size:var(--step-1);font-weight:900;line-height:1.25}
.instr{background:var(--instr);color:var(--instr-ink);font-weight:700;padding:10px 14px;border-radius:4px;margin-block:12px 14px}
.instr-why{display:block;font-weight:400;margin-top:3px}
.stage{display:grid;gap:16px}
@media (min-width:720px){ .stage.with-box{grid-template-columns:minmax(0,1fr) 250px;align-items:start} }
.panel{background:var(--card);border-radius:var(--radius);padding:16px;min-width:0;display:grid;gap:12px}

/* dialogue with gaps */
.dlg{display:grid;gap:10px;margin:0}
.dlg p{margin:0;line-height:1.9}
.spk{font-style:italic;color:var(--muted)}
.chunk{cursor:pointer;border-radius:3px}
.chunk,.gap,.gap .f,.gap .r,.gap-input,.gap-in{font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0}   /* a ligature (ti, fi) would show a hidden letter */
.gap .f{font-weight:700;color:var(--answer)}
.gap .r{font-weight:700;background:var(--hl);color:transparent;padding:1px 0;border-radius:2px;transition:color .15s ease}
.gap .r:empty{display:none}
.chunk.open .gap .r{color:var(--hl-ink)}
/* engine 48 (her read-through 30.10: blue on yellow was hard on the eyes): an opened gap is one chunk, the first letters and the rest
   black bold on the yellow, in dark mode too (engine 46 had made the rest blue) */
.chunk.open .gap .f{color:var(--hl-ink);background:var(--hl);border-radius:2px 0 0 2px}
.dlg b.given{color:var(--answer)}
/* engine 30: "!" after an opened gap = "I want to revise this" (kept on this device) */
/* engine 32 (her decision 27.10): a green bookmark, not a second round sign next to "?" — "?" asks Olya, the bookmark is for me */
.rev{display:inline-grid;place-items:center;width:1.25em;height:1.5em;margin:0 1px 0 2px;padding:0;border:0;border-radius:4px;background:none;color:var(--done);vertical-align:-.3em;cursor:pointer}
.rev svg{width:.78em;height:1.05em;overflow:visible}
.rev path{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.rev.on path{fill:currentColor}
.rev:hover{background:color-mix(in srgb, var(--done) 14%, transparent)}
.rev.demo{cursor:default;height:1.2em}
/* engine 34: the bookmark hint sits on top, right under the instruction (her wish: at the bottom of a long text nobody sees it) */
.rev-hint{margin:-6px 0 12px;font-size:.92rem;color:var(--muted)}
/* engine 33: the bookmark on every practice item; next to a hidden answer it shows once the answer is open */
.reveal:not(.open) ~ .rev:not(.on){display:none}
.say-a .rev,.lb .rev{flex:none;font-size:1.15rem}
.lb-item{display:flex;align-items:center;gap:6px}
.lb-item .reveal{flex:1}
.ln .rev{position:absolute;right:8px;top:9px;font-size:1.1rem}
.ln.has-mk .rev{right:46px}
.ln.has-rev{padding-right:40px}
.ln.has-mk.has-rev{padding-right:80px}
.mk-row .rev{font-size:1.25rem;margin-left:6px}
.target .rev{font-size:1.1rem}
.chunk:not(.open) + .rev:not(.on){display:none}
/* engine 52: "?" beside every gap, every say-it row and look-back item — it shows once the answer is open, as the bookmark */
.chunk:not(.open) + .rev + .mk:not(.on),.chunk:not(.open) + .mk:not(.on),.reveal:not(.open) ~ .mk:not(.on){display:none}
.dlg .mk{width:26px;height:26px;font-size:.85rem;margin:0 2px 0 4px;vertical-align:-.25em}
.lb-item .mk{margin-left:0}
.chunk.plain{cursor:default}
.gap-n{display:block;color:var(--label);font-size:.88rem;line-height:1.35;margin:1px 0 2px}
.gap-n[hidden]{display:none}
.more-below{position:fixed;left:50%;transform:translateX(-50%);z-index:5;font:inherit;font-weight:700;font-size:.95rem;background:var(--instr);color:var(--instr-ink);border:0;border-radius:99px;padding:7px 16px;box-shadow:0 2px 10px rgba(0,0,0,.28);cursor:pointer}
.more-below[hidden]{display:none}
.say-note{margin:2px 0 0}
.chunk.plain .gap .f,.chunk.plain .gap .r,.chunk.plain .gap.o .r{font-weight:inherit;color:inherit;background:none}
.gap.o .r{background:#F6B26B;font-weight:400}
.chunk.open .gap.o .r{color:#3B2300}
.box.gloss p{line-height:1.7}
.trap{color:var(--muted);text-decoration:line-through}
.say-row .q .en{font-style:normal;color:var(--ink)}
.gap .r::selection{background:var(--hl)}

/* rewrite */
.orig{margin:0;font-size:var(--step-1)}
.orig .hl{font-weight:inherit;background:rgba(128,128,128,.2);border-bottom:2px solid var(--muted);border-radius:3px 3px 0 0;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.panel.checked .orig{font-style:italic;color:var(--muted)}
.key{margin:0;color:var(--label);font-weight:900;font-size:var(--step-1);letter-spacing:.03em}
.target{margin:0;font-size:var(--step-1)}
.blank{color:var(--muted);letter-spacing:.1em}
.ans{color:var(--answer);font-weight:700}
.note{margin:0;font-size:.95rem}
.gap-input{font:inherit;font-weight:700;color:var(--answer);background:var(--ground);border:0;border-bottom:2px dashed var(--muted);border-radius:4px 4px 0 0;
  padding:2px 6px;width:min(100%,13em);margin-block:2px}
.gap-input::placeholder{color:var(--muted);font-weight:400;font-style:italic}
.gap-input:focus{border-bottom-color:var(--instr)}
.yours{margin:0}
.verdict{display:grid;gap:6px;padding:12px 14px;border-radius:12px}
.verdict.ok{background:var(--ok-bg)}
.verdict.no{background:var(--no-bg)}
.chip{justify-self:start;font-weight:900;padding:2px 12px;border-radius:999px;font-size:.92rem}
.verdict.ok .chip{background:var(--ok-chip);color:var(--ok-ink)}
.verdict.no .chip{background:var(--no-chip);color:var(--no-ink)}
.verdict p{margin:0;font-size:var(--step-1);line-height:1.5}
.good{background:var(--good-hl);color:var(--hl-ink);border-radius:2px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.wrong{text-decoration:line-through;text-decoration-thickness:2px;color:var(--strike)}
.fix{color:var(--answer);font-weight:900;background:var(--fix-bg);border-radius:3px;padding:0 2px}
.legend{font-size:.85rem;color:var(--muted)}
.tick{color:var(--done);font-weight:900}

/* say it */
.say{display:grid;gap:10px}
.say-row{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.say-row:first-child{border-top:0;padding-top:0}
.say-row .q{font-style:italic;color:var(--muted)}
.reveal{display:block;width:100%;text-align:left;font-weight:700;background:var(--hl);color:transparent;border:0;border-radius:3px;padding:6px 8px;cursor:pointer;min-height:2.2em}
.reveal.open{color:var(--hl-ink)}
.reveal:not(.open) *{color:transparent !important}   /* marked answers stay hidden until tapped */
.reveal.open .pp,.reveal.open .g{color:#0000FF}.reveal.open .ps{color:#C00000}   /* on yellow: the slide colours, in dark mode too */
.small{font-size:.9rem;color:var(--muted)}
s{color:var(--muted)}

/* share and ask */
.convo{display:grid;gap:12px}
.turn{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;gap:8px}
.turn.b{grid-template-columns:minmax(0,1fr) auto}
.fig{height:84px;width:auto;filter:var(--fig-filter)}
.bubble{position:relative;border:2px solid var(--bubble-line);border-radius:22px;padding:10px 14px;line-height:1.45}
.turn.a .bubble{background:var(--bubble);color:var(--bubble-ink);border-bottom-left-radius:6px}
.turn.b .bubble{background:var(--card);border-bottom-right-radius:6px}
.situation{margin:0;font-style:italic;color:var(--muted)}
.use{margin:0}
.use b{letter-spacing:.03em}
.hint .s,.mark-s{background:var(--share);color:var(--hl-ink)}
.hint .a,.mark-a{background:var(--hl);color:var(--hl-ink)}
.mark-s,.mark-a{padding:1px 2px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.dots{letter-spacing:.3em;font-weight:900}
.notes{display:grid;gap:4px;font-size:.95rem;border-top:1px dashed var(--line);padding-top:10px}
.g{color:var(--gloss);font-weight:700}
.pp{color:var(--answer);font-weight:700}   /* present perfect: blue, as on her slides */
.ps{color:var(--label);font-weight:700}    /* past simple: red */
.next-line{opacity:0;transform:translateY(6px);animation:rise .3s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* useful language box */
.box{background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:12px 14px 14px;margin-top:18px;position:relative;font-size:.92rem;display:grid;gap:2px}
.box .sticker{width:150px;height:auto;margin:-26px 0 2px -8px}
.box h4{margin:8px 0 2px;color:var(--label);font-size:.8rem;letter-spacing:.06em;font-weight:900}
.box h4:first-of-type{margin-top:0}
.box p{margin:0;line-height:1.4}
.box .n{display:inline-block;min-width:1.5em;font-weight:700}

/* look back */
.lb{display:grid;gap:14px}
.lb-group{display:grid;gap:6px}
.lb-group .phrase{color:var(--gloss);font-weight:700;font-size:var(--step-1)}

/* end */
.end{display:grid;justify-items:center;text-align:center;gap:14px;padding:28px 16px}
.end .cloud{background:var(--bubble);color:var(--bubble-ink);border:2px solid var(--bubble-line);border-radius:48% 52% 46% 54%/55% 45% 55% 45%;padding:34px 30px;font-size:var(--step-2);font-weight:700;line-height:1.3;max-width:420px}

/* link + write tasks */
.steps-list{margin:0;padding-left:1.3em;display:grid;gap:4px}
.video{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden}
.video iframe,.video > div{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-consent{display:grid;place-items:center;text-align:center;padding:10px 14px;color:#fff;background:#1D1D1B;font-size:.9rem;line-height:1.35}
.yt-consent p{margin:0 0 8px}.yt-consent a{color:#9CC9FF}.yt-consent .small{color:#C9C9C9;margin:6px 0 0;font-size:.8rem}
.vmsg{position:absolute;inset:0;z-index:2;margin:0;display:grid;place-items:center;text-align:center;padding:16px;color:#fff;font-size:.95rem;background:#1D1D1B}
.vmsg p{margin:0 0 8px}.vmsg a{color:#9CC9FF}.vmsg .small{color:#C9C9C9;margin:8px 0 0;font-size:.85rem}
.vmsg .btn{margin:8px 0 2px}
.vload{position:absolute;inset:0;z-index:1;display:grid;place-items:center;margin:0;color:#C9C9C9;font-size:.9rem;pointer-events:none}
.lines{display:grid;gap:6px}
.ln{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start;text-align:left;width:100%;background:transparent;border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;cursor:pointer;line-height:1.6}
.ln .pl{width:30px;height:30px;border-radius:50%;border:0;background:var(--instr);color:var(--instr-ink);display:grid;place-items:center;font-size:.8rem;cursor:pointer}
.whole-note{color:var(--muted);font-size:.85rem;white-space:nowrap}
.gap-in{font:inherit;font-weight:700;color:var(--answer);background:var(--hl);border:0;border-bottom:2px solid var(--hl-ink);border-radius:4px 4px 0 0;padding:0 6px;margin:1px 0;max-width:100%}
.gap-in:focus{background:var(--card);outline:2px solid var(--instr);outline-offset:1px}
/* engine 40: each gap can be checked on its own ("Check" after it, or Enter), as in TubeQuizard; Check answers takes the rest.
   A word, not ✓: a ✓ beside a typed answer read as "right" (her catch, 29.10) — ✓ and green mean right, as in TubeQuizard */
.gap-ck{font:inherit;font-size:.72em;font-weight:900;line-height:1.3;border:2px solid var(--instr);color:var(--instr);background:var(--card);border-radius:99px;padding:0 8px;margin:0 3px 0 5px;vertical-align:.12em;cursor:pointer}
.gap-ck[hidden]{display:none}
.gap-res{font-weight:700;border-radius:3px;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.gap-res.ans{background:var(--hl);color:var(--hl-ink)}
.gap-res.ok{background:var(--ok-chip);color:var(--ok-ink)}
.gap-res.no{background:var(--no-chip);color:var(--no-ink)}
.you-ok,.you-no{font-weight:700;border-radius:3px;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.you-ok{background:var(--ok-chip);color:var(--ok-ink)}.you-no{background:var(--no-chip);color:var(--no-ink)}
.to-ans{color:var(--muted);font-weight:400}
.you-typed{font-weight:700;border-bottom:2px dotted var(--muted)}
.gap-fb{grid-column:2;background:var(--no-bg);border-radius:8px;padding:6px 10px;font-size:.95rem;line-height:1.5}
.chip-x{color:var(--no-ink);font-weight:900}
.ln.playing{border-color:var(--instr);background:var(--ground)}
.ln.has-gap{border-width:2px}
/* engine 37 (a student, 28.10: a ▶ on every line looked as if every line were a task): only the lines with a gap are framed;
   the others are context, quiet and grey, like the grey context on her slides, and still play when tapped */
.ln:not(.has-gap){border-color:transparent;color:var(--muted);padding-top:3px;padding-bottom:3px}
.ln:not(.has-gap) .pl{width:24px;height:24px;font-size:.62rem;margin:3px 0 0 3px;opacity:.85}
.ln:not(.has-gap).playing{color:var(--ink)}
.gapbox{font:inherit;font-weight:700;background:var(--hl);color:var(--hl-ink);border:2px dashed var(--hl-ink);border-radius:6px;padding:0 6px;margin:1px 0;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.gapbox.open{border-style:solid;border-color:transparent}
.gapbox .g-hint{font-size:.8em;font-weight:900;letter-spacing:.02em;padding:0 10px}
.gapbox .g-ans{display:none}
.gapbox.open .g-ans{display:inline}
.gapbox.open .g-hint{display:none}
.gapbox.open{color:var(--hl-ink)}
.tap-hint{margin:0}.tap-hint p{margin:0}
.yt-help{margin-top:4px}.yt-help summary{cursor:pointer;color:var(--instr);font-weight:700}.yt-help p{margin:6px 0 0}
.pc-note{margin:0;padding:10px 12px;border-radius:10px;background:var(--ground);border:1px dashed var(--line)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--instr);color:var(--instr-ink);text-decoration:none;font-weight:900;
  padding:14px 18px;border-radius:12px;border:0;cursor:pointer;min-height:48px}
.cta.secondary{background:transparent;color:var(--instr);border:2px solid var(--instr)}
.model p{margin:0 0 6px}
.check{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
.check legend{font-weight:900;font-size:var(--step-1);padding:0;margin-bottom:2px}
.check label{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;cursor:pointer;line-height:1.45}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--done)}
.box .ru{display:block;font-size:.85rem}
.box .mean{font-size:.85rem}
.think{margin:0;padding-left:1.2em;display:grid;gap:4px}
.preview{background:var(--ground);border-radius:10px;padding:10px 12px;line-height:1.5;max-height:14em;overflow:auto}
.plan-peek summary{cursor:pointer}
.plan-peek .box{margin-top:26px}
.task-card{font-size:var(--step-1);line-height:1.5}
.task-card p{margin:0}
.task-card ul{margin:0;padding-left:1.1em;display:grid;gap:6px}
.task-card .task-h{font-weight:900;font-size:var(--step-2)}
.picks{display:grid;gap:6px}
.pick-h{margin:10px 0 2px;color:var(--label);font-size:.8rem;letter-spacing:.06em;font-weight:900;text-transform:uppercase}
.pick-h:first-child{margin-top:0}
/* engine 31: "Your phrases" grouped by the parts of the conversation; an empty part shows in red, nothing is blocked */
.ph-part{display:grid;gap:6px}
.ph-h{margin:6px 0 0;color:var(--muted);font-size:.8rem;letter-spacing:.06em;font-weight:900;text-transform:uppercase}
.ph-part.empty .ph-h,.ph-part.empty .ph-zero{color:var(--no-ink)}
.ph-back{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ph-zero{margin-top:-4px}
.pick{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;line-height:1.4}
.pick .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;font-size:.8rem;font-weight:900;color:transparent}
.pick.on{background:var(--ok-bg);border-color:var(--done)}
.pick.on .tick{background:var(--done);border-color:var(--done);color:var(--card)}
.pick.on .tick::after{content:"✓"}
.pick .ru{display:block;font-size:.85rem}
.pick .mean{font-size:.85rem}
.pick-count{font-weight:700}
.tenses{margin:4px 0 0}
.model-peek summary{cursor:pointer}
.task-peek{background:var(--ground);border-radius:10px;padding:10px 12px}
.task-peek summary{cursor:pointer}
.task-peek[open] .small{display:none}
.task-peek .task-card{font-size:var(--step-0);margin-top:6px;display:grid;gap:6px}
.task-peek .task-h{display:none}
.model-peek .model{margin-top:8px}
.topic{border-radius:18px;padding:16px;margin-bottom:22px;display:grid;gap:12px}
.topic-0{background:var(--topic-a)}
.topic-1{background:var(--topic-b)}
.topic-head{display:grid;gap:2px}
.topic-n{font-size:.75rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.topic-head h2{font-size:var(--step-2);font-weight:900;line-height:1.2}
.topic-head p{margin:0;color:var(--muted)}
.ul-peek summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.ul-peek summary::-webkit-details-marker{display:none}
.sticker-sm{width:118px;height:auto}
.ul-hint{font-size:.9rem;color:var(--muted);font-weight:700}
.ul-peek[open] .ul-hint{display:none}
.box-home{margin-top:8px}
.sec{display:grid;gap:8px}
.sec-label{justify-self:start;margin:4px 0 0;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:var(--hl);color:var(--hl-ink);padding:2px 8px;border-radius:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--ground);border-radius:12px;padding:4px}
.seg-btn{min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:900;color:var(--muted);cursor:pointer}
.seg-btn.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:grid;gap:4px}
.field input,textarea{font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:10em;resize:vertical;line-height:1.5}
.mode{display:grid;gap:10px}
.saved-note{margin:-4px 2px 0;color:var(--ok-ink);font-weight:700}
.saved-note.warn{color:var(--muted);font-weight:400}
.rec-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rec-btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;border:2px solid var(--rec);background:var(--card);color:var(--rec);font-weight:900;cursor:pointer}
.rec-btn .dot{width:14px;height:14px;border-radius:50%;background:var(--rec)}
.rec-btn.on{background:var(--rec);color:#fff}
.rec-btn.on .dot{background:#fff;border-radius:3px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
audio{width:100%}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.model b{font-weight:700}

/* sticky actions */
.actions{position:sticky;bottom:0;z-index:4;background:var(--ground);display:flex;gap:10px;justify-content:flex-end;
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--instr);background:transparent;color:var(--instr);font-weight:900;cursor:pointer}
.btn.primary{background:var(--instr);color:var(--instr-ink)}
.btn.grow{flex:1}
.btn[disabled]{opacity:.35;cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.next-line{opacity:1;transform:none}}
.legal{max-width:var(--maxw,760px);margin:0 auto;padding:18px 16px 28px;color:var(--muted);font-size:.85rem;text-align:center}
/* engine 29 (her wish, 27.10): on a computer the page grows with the screen, by width and by height, whichever is smaller,
   so the text is big and the Useful language box fits without scrolling; the phone layout stays as it was */
@media (min-width:900px){
  html{font-size:clamp(16px, min(1.35vw, 2.5vh), 26px)}
  .wrap{max-width:50rem}
  .wrap:has(.stage.with-box){max-width:64rem}
  .legal{max-width:64rem}
  .stage.with-box{grid-template-columns:minmax(0,1fr) minmax(250px,22rem)}
  .stage .box{font-size:1.15rem}   /* fitBoxes() lowers it until the box fits on the screen */
  .stage .box h4{font-size:.76em}
  .stage .box .ru,.stage .box .mean{font-size:.86em}
  .box .sticker{width:9rem;margin-top:-1.6rem}
  /* her catch (27.10): on a wide screen the Russian goes on the same line as the phrase (on a phone it stays below) */
  .box .ru{display:inline}
  .box.gloss p{line-height:1.4}
  .box .ru.dash::before{content:"– "}
  /* the topic's box on the task list: two columns on a wide screen */
  .box-home{display:block;columns:2 20rem;column-gap:2.5rem;font-size:1.05rem}
  .box-home h4{break-after:avoid}
  .box-home h4:first-child{margin-top:0}
  .box-home p{break-inside:avoid;margin-bottom:3px}
}
.legal a{color:inherit}
/* engine 51: a finished task — its bar on top, ↺ beside the tick at home */
.again-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:0 0 10px;padding:8px 12px;border-radius:10px;background:var(--ok-bg);color:var(--ok-ink);font-weight:800}
.again-bar .linklike{font-weight:800}
.task-row .again-btn{position:absolute;right:58px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--instr);font-size:1.15rem;font-weight:900;cursor:pointer;padding:0}
.task-row.is-done .task-btn{padding-right:104px}
.teacher .again-btn{display:none}
/* engine 49: discussed items stay in "Waiting for your answer", quiet, not counted */
.wait.calm{border-left-color:var(--line)}
.wait .wait-disc-h{margin:8px 0 2px}
.wait ul.wait-disc li,.wait ul.wait-disc li .linklike{color:var(--muted)}
/* ===== sort (engine 49, B2 30.10): say it in English, then sort it into its pattern ===== */
.dlg p.scene{text-align:center;line-height:1.4;margin:2px 0}
.dlg p.scene span{display:inline-block;background:transparent;border:1.5px solid var(--line);color:var(--muted);font-size:.8em;font-weight:700;border-radius:8px;padding:2px 10px}
.sort{display:grid;gap:14px;align-content:start}
.sort-pats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sp{all:unset;box-sizing:border-box;cursor:pointer;display:grid;align-content:start;gap:2px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:8px 10px;min-height:4.6rem;position:relative;transition:border-color .3s,box-shadow .3s,background .3s}
.sp:focus-visible{outline:3px solid var(--instr);outline-offset:2px}
.sp-en{font-weight:900;font-size:1.08rem;line-height:1.2}
.sp-ru{font-size:.86rem;color:var(--muted);font-style:italic;line-height:1.25}   /* engine 52 (her 31.10: less Russian): the English pattern is the label, the Russian small under it */
.sp-c{position:absolute;top:6px;right:8px;min-width:1.4rem;height:1.4rem;border-radius:99px;background:var(--instr);color:var(--instr-ink);font-size:.8rem;font-weight:900;display:grid;place-items:center}
.sp-list{display:grid;gap:2px;margin-top:4px}
.sp-list span,.sp-list li{font-size:.86rem;line-height:1.3;font-weight:700}
.sp.glow{border-color:var(--instr);box-shadow:0 0 0 4px rgba(21,120,192,.18);animation:spGlow 1.4s ease-in-out infinite}
@keyframes spGlow{50%{box-shadow:0 0 0 7px rgba(21,120,192,.28)}}
.sp.shake{animation:spShake .45s ease-in-out}
@keyframes spShake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.sp.landed{animation:spLand .5s ease-out}
@keyframes spLand{40%{transform:scale(1.05);background:var(--good-hl)}}
.sp-why{display:block;margin-top:4px;font-size:.85rem;font-weight:700;color:var(--ok-ink);line-height:1.3}
.sort-card{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;display:grid;gap:8px;touch-action:none}
.sort-card.in{animation:scIn .4s ease-out}
@keyframes scIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.sort-card.nudge{animation:scNudge 1.2s ease-in-out 2}
@keyframes scNudge{30%{transform:translate(var(--nx,0),var(--ny,-8px))}60%{transform:none}}
.sc-n{font-size:.8rem;font-weight:800;color:var(--muted)}
.sc-ru{margin:0;font-size:1.25rem;font-weight:800;line-height:1.35}
.sc-en-row{margin:0;display:flex;align-items:center;gap:6px}
.sc-en-row .reveal{flex:1;font-size:1.12rem}
.sort-card.open .sc-en-row .reveal{cursor:grab;background:var(--fix-bg);color:var(--ink)}
.sc-or{margin:0;color:var(--muted);font-size:.95rem}
.sc-ask{margin:0;font-weight:800;color:var(--instr)}
.sort-card.landed .sc-ask{color:var(--ok-ink)}
.sc-why{margin:0;font-weight:700;border-left:4px solid var(--muted);border-radius:4px;padding:4px 10px;line-height:1.35}
.sort-fly{position:fixed;z-index:50;pointer-events:none;background:var(--fix-bg);color:var(--ink);font-weight:700;border-radius:8px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-width:80vw}
.sort-pats.sum .sp{cursor:default}
.sort-pats.sum .sp-list{list-style:none;margin:6px 0 0;padding:0}
.sort-pats.sum .sp-list li{font-weight:400;font-size:.95rem}
.sort-pats.sum .sp-list li b{font-weight:900}
.sort-end{display:grid;gap:6px;border-top:2px dashed var(--line);padding-top:10px}
.se-q{margin:0;font-weight:800;font-size:1.1rem}
.se-a summary{cursor:pointer;font-weight:800;color:var(--instr)}
.se-a p{margin:6px 0 0;line-height:1.45}
.sort-again{margin:0;text-align:right}
@media (min-width:900px){ .sort:not(.done){grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start} .sort:not(.done) .sort-pats{order:2} }
@media (prefers-reduced-motion: reduce){ .sp.glow,.sp.shake,.sp.landed,.sort-card.in,.sort-card.nudge{animation:none} }
/* ===== /sort ===== */

/* ===== fixit (engine 49, C1 30.10) ===== */
.fx-card{border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:6px;background:var(--ground)}
.fx-t{margin:0;font-size:.82rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fx-pair{display:grid;gap:2px}
.fx-wrong{margin:0;font-size:var(--step-1);color:var(--ink)}
.fx-del{text-decoration:line-through;text-decoration-thickness:2px;color:var(--strike)}
.fx-caret{color:var(--label);font-weight:900;font-size:1.3em;line-height:1}
.fx-right{margin:0;font-size:var(--step-1);font-weight:700}
.fx-fix{color:var(--label);font-weight:900;font-size:1.35em;line-height:1}
.fx-why{margin:4px 0 0;font-size:.98rem}
.fx-ru{margin:0;font-size:.88rem;color:var(--muted)}
.fx-sent{line-height:2.3}
.fx-slot{display:inline-block;vertical-align:middle;width:2.4em;height:1.55em;margin:0 1px;border:2px dashed var(--instr);border-radius:7px;background:var(--card);cursor:pointer;padding:0}
.fx-slot:hover,.fx-slot.over{background:var(--fix-bg);border-style:solid}
.fx-slot.on{background:var(--fix-bg);border-style:solid;box-shadow:0 0 0 3px rgba(6,147,227,.25)}
.fx-slot.shake{animation:fxShake .45s ease-in-out;border-color:var(--label)}
@keyframes fxShake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.fx-chips{display:flex;flex-wrap:wrap;gap:10px}
.fx-chip{font:inherit;font-size:var(--step-1);font-weight:900;border:2px solid var(--instr);background:var(--card);color:var(--instr);border-radius:10px;padding:4px 16px;min-height:44px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.fx-chip.on{background:var(--instr);color:var(--instr-ink,#fff)}
.fx-chip.dragging{opacity:.35}
.fx-ghost{position:fixed;z-index:50;pointer-events:none;margin:0;box-shadow:0 6px 16px rgba(0,0,0,.25);background:var(--instr);color:var(--instr-ink,#fff)}
.fx-msg{margin:0;min-height:1.4em;font-weight:700}
.fx-msg.no{color:var(--again,#C2410C)}
.fx-msg.ok{color:var(--ok-ink,#1F7A35)}
.fx-card.short{gap:3px;padding:8px 14px}
.fx-card.short .fx-wrong,.fx-card.short .fx-right{font-size:1rem}
.fx-ans .fx-in.pop{display:inline-block;animation:fxPop .5s ease-out}
@keyframes fxPop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.fx-q{margin:0;font-weight:800;font-size:var(--step-1);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fx-opts{display:grid;gap:8px}
.fx-opt{font:inherit;font-size:var(--step-1);text-align:left;display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.fx-box{flex:none;width:1.1em;height:1.1em;border:2px solid var(--muted);border-radius:4px}
.fx-opt.on{border-color:var(--instr)}
.fx-opt.on .fx-box{background:var(--instr);border-color:var(--instr)}
.fx-opt.right{background:var(--good-hl);color:var(--hl-ink);border-color:var(--good-hl);cursor:default}
.fx-opt.right .fx-box{border-color:var(--hl-ink)}
.fx-opt.wrong{color:var(--strike);cursor:default}
.fx-opt.wrong .fx-o{text-decoration:line-through;text-decoration-thickness:2px}
.fx-opt.picked .fx-box{background:currentColor}
.fx-tag{margin-left:auto;font-weight:900}
@media (prefers-reduced-motion: reduce){ .fx-slot.shake,.fx-ans .fx-in.pop{animation:none} }
/* ===== /fixit ===== */
</style>

async function syncNow(code, opts={}){
  code = code || myCode(); if(!SYNC_URL || !code || asStudent()) return null;
  if(syncBusy && !opts.keepalive){ syncAgain = true; return null; }
  syncBusy = true;
  const res = await post({ action:"sync", code, page:PAGE_KEY, date:LESSON.date,
      tasks: TASKS.map(t=>({id:t.id, title:t.title, frames:framesOf(t)})),
      events: Object.entries(marks).map(([task,m])=>({task, done:m.done, ts:m.ts})) }, opts);
  syncBusy = false;
  if(!res.ok && res.error === "other-group" && res.gid){ ls.set("hw-code", code); ls.set("hw-role",""); ls.set("hw-who",""); ls.set("hw-gid", res.gid); toOwnGroup(res.gid); return res; }

  if(res.ok && res.role === "teacher"){
    if(code === myCode()){ ls.set("hw-role","teacher"); ls.set("hw-who", res.name||""); teacherData = res; if(res.group){ groupStats = res.group; } syncState = "ok";
      if(!current){ const y = scrollY; renderHome(); scrollTo(0,y); } }
    if(syncAgain){ syncAgain = false; syncNow(); }
    return res;
  }
  if(res.ok){
    let changed = false;
    Object.entries(res.tasks||{}).forEach(([id,m])=>{
      const mine = marks[id];
      if(!mine || m.ts >= mine.ts){ if(!mine || mine.done !== m.done) changed = true; marks[id] = {done:!!m.done, ts:m.ts}; }
    });
    saveMarks();
    if(res.work){ work = res.work; saveWork(); refreshWork(); }
    if(code === myCode()) flushFlags();
    if(res.group && code === myCode()){ groupStats = res.group; ls.set("hw-group-"+GROUP_ID, JSON.stringify(res.group)); refreshMeter(); checkMilestone(res.group, GROUP_ID); }
    if(gotMe(res, code)) refreshMeter();
    if(code === myCode()){ ls.set("hw-who", res.name||""); if(!ls.get("hw-name") && res.name) ls.set("hw-name", res.name); }
    if(changed) refreshTicks();
  }
  if(code === myCode()){ syncState = res.ok ? "ok" : (res.error==="unknown-code" ? "unknown" : "offline"); if(LOCKED() && !document.getElementById("gate")) renderGate(); else refreshSync(); }
  if(syncAgain){ syncAgain = false; syncNow(); }
  return res;
}

/* ---------- group goal: film-strip meter, confetti, milestones ---------- */
const fmtN = n => Number(n||0).toLocaleString("en-GB");
const capFirst = s => String(s||"").charAt(0).toUpperCase() + String(s||"").slice(1);
function meterHTML(gs){
  if(!gs || !gs.goal) return "";
  const pct = Math.min(1, gs.total/gs.goal), n = 20, filled = Math.min(n, Math.round(pct*n));
  return `<section class="meter" aria-label="Our group's goal">
      <div class="meter-top"><b>🎬 Our group</b><span>${gs.reached ? "Goal reached!" : `${fmtN(gs.total)} / ${fmtN(gs.goal)} 🎞`}</span></div>
      <div class="strip" role="img" aria-label="${Math.round(pct*100)}% of the way">${Array.from({length:n},(_,i)=>`<i class="${i<filled?"on":""}"></i>`).join("")}</div>
      <p class="small">${gs.reached ? `🎉 We did it! ${esc(capFirst(gs.reward))} is coming.` : `Every task adds frames — one per minute of work, Over to you counts double. At ${fmtN(gs.goal)} we'll have ${esc(gs.reward)}.`}${gs.size ? ` <b>${gs.week} of ${gs.size}</b> have added something this week.` : ""}</p>
    </section>`;
}
function confetti(big){
  try{ if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; }catch(e){}
  const c = document.createElement("canvas"); c.className = "confetti"; c.setAttribute("aria-hidden","true"); document.body.appendChild(c);
  const d = window.devicePixelRatio || 1, W = c.width = innerWidth*d, H = c.height = innerHeight*d, x = c.getContext("2d");
  if(!x){ c.remove(); return; }
  const cols = ["#0693E3","#FFFF00","#FF9900","#2E8B3E","#E00000","#8FB0FF"];
  const ps = Array.from({length: big ? 170 : 70}, (_,i)=>({ x: W/2 + (Math.random()-.5)*W*(big?.9:.35), y: H*(big?.4:.22),
    vx: (Math.random()-.5)*W*.012, vy: -(Math.random()*.018+.006)*H, s: (5+Math.random()*7)*d, r: Math.random()*6, vr: (Math.random()-.5)*.35, c: cols[i%cols.length] }));
  const t0 = performance.now(), life = big ? 2800 : 1700;
  (function frame(now){
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy += H*.0007; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1-(now-t0)/life); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(now - t0 < life) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg; document.body.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(), 600); }, 4200);
}
/* 25 / 50 / 75 / 100 %: celebrate once per device when the group passes a mark (a new goal starts a new season) */
function checkMilestone(gs, groupId){
  if(!gs || !gs.goal) return;
  const key = "hw-ms-" + groupId + "-" + gs.goal;
  const pct = gs.total/gs.goal*100, ms = pct>=100 ? 100 : pct>=75 ? 75 : pct>=50 ? 50 : pct>=25 ? 25 : 0;
  const seen = ls.get(key);
  if(seen === ""){ ls.set(key, String(ms)); return; }
  if(ms > Number(seen)){
    ls.set(key, String(ms)); confetti(true);
    toast(ms===100 ? `🎉 We did it! ${capFirst(gs.reward)} is coming!` : `🎬 Our group is ${ms}% of the way to ${gs.reward}!`);
  }
}
/* engine 35: someone studying on their own (Group = Self in her table) has their own film instead of the group's:
   it grows with every task, and every 100 frames gets a small celebration (her choice, 28.10). Each code has its own. */
let meStats = (()=>{ try{ const c = localStorage.getItem("hw-code"); return c ? JSON.parse(localStorage.getItem("hw-me-"+c)||"null") : null; }catch(e){ return null; } })();
function meMeterHTML(me){
  const n = 20, part = me.total % 100, filled = Math.round(part / 100 * n), next = (Math.floor(me.total / 100) + 1) * 100;
  return `<section class="meter meter-me" aria-label="Your film">
      <div class="meter-top"><b>🎬 Your film</b><span>${fmtN(me.total)} 🎞</span></div>
      <div class="strip" role="img" aria-label="${part} of 100 frames to the next stop">${Array.from({length:n},(_,i)=>`<i class="${i<filled?"on":""}"></i>`).join("")}</div>
      <p class="small">Every task adds frames — one per minute of work, Over to you counts double. Next stop: ${fmtN(next)} 🎞.${me.week ? ` This week: <b>${fmtN(me.week)} 🎞</b>.` : ""}</p>
    </section>`;
}
function checkMe(me, code){
  const key = "hw-me-ms-" + code, h = Math.floor(me.total / 100), seen = ls.get(key);
  if(seen === ""){ ls.set(key, String(h)); return; }
  if(h > Number(seen)){ ls.set(key, String(h)); confetti(true); toast(`🎬 ${fmtN(h * 100)} frames in your film! Next stop: ${fmtN((h + 1) * 100)}.`); }
}

/* send the marks of finished tasks (also retried after the next sync if there was no connection) */
let flagBusy = false;
async function flushFlags(){
  if(flagBusy || !canMark()) return; flagBusy = true;
  for(const id of Object.keys(flags)){
    const t = TASKS.find(x=>x.id===id); if(!t || !done.has(id)) continue;
    for(const k of Object.keys(flags[id])){
      const f = flags[id][k];
      const res = await post({action:"submit", code:myCode(), page:PAGE_KEY, date:LESSON.date, task:id, title:t.title, type:"marked",
                              text: f.s + (f.note ? "\n— " + f.note : "") + (f.l ? "\n" + f.l : "")});
      if(!res.ok){ flagBusy = false; saveFlags(); return; }
      f.id = res.id; f.sent = true; delete flags[id][k];
      const d = new Date(), p2 = n=>String(n).padStart(2,"0");
      (work[id] = work[id] || []).push({id:res.id, sent:`${p2(d.getDate())}.${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`, type:"marked", text:f.s, feedback:"", seen:false});
    }
    if(!Object.keys(flags[id]).length) delete flags[id];

}

function labelsFor(students){
  const words = n => n.trim().split(/\s+/);
  const lv = [n=>n[0], n=>n.slice(0,2), n=>n[0]+(words(n)[1]||" ")[0], n=>n.slice(0,3), n=>n.slice(0,2)+(words(n)[1]||" ")[0], n=>words(n)[0]];
  return students.map((s,i)=>{
    for(const f of lv){ const c = f(s.name).trim(); if(c && students.every((o,j)=>j===i || f(o.name).trim().toLowerCase() !== c.toLowerCase())) return c; }
    return s.name;
  });
}

/* every line a student could mark: step, row (-1 = the whole card) and the text the ? button sends */
function stuckItems(t){
  const out = [];
  (t.steps||[]).forEach((st, si)=>{
    if(st.type==="rewrite"){ const r = st.r; out.push({si, row:-1, snippet: plainText(r.pre + r.a + r.post)}); }
    else if(st.type==="fix") out.push({si, row:-1, snippet: fixSnippet(st)});   /* engine 49: Fix it */
    else if(st.type==="sayit") (st.s.rows||[]).forEach((row,i)=>out.push({si, row:i, snippet: st.s.html ? plainText(row[1]) : row[1]}));
    else if(st.type==="share"){ const s = st.s, q = s.q || ""; out.push({si, row:-1, snippet: plainText(s.s+(q?" "+q:""))}); }
    else if(st.type==="listen") (st.clip||[]).forEach((l,i)=>out.push({si, row:i, snippet: l[3].map(p=>typeof p==="string"?p:p.gap).join("")}));
    else if(st.type==="dlg") chunkSnips(st.lines).forEach((sn, k)=>out.push({si, row:-1, gap:k, snippet: sn}));   /* engine 52 */
    else if(st.type==="sort") (st.data.items||[]).forEach((x, i)=>out.push({si, row:-1, sort:i, snippet: x.en}));
    else if(st.type==="lookback"){ let k = 0; LOOKBACK.forEach(gp => gp.qa.forEach(([q, a]) => out.push({si, row:-1, lb:k++, snippet: q + " → " + a}))); }
  });
  if(t.kind==="gaps") chunkSnips(t.lines).forEach((sn, k)=>out.push({si:0, row:-1, gap:k, snippet: sn}));
  return out;
}
const rvKey = s => norm(plainText(s));
const noteOf = w => String(w.text||"").split("\n").filter(l=>/^— /.test(l)).map(l=>l.slice(2)).join(" ");
function markedItems(id){

  const marks = (teacherData.work||[]).filter(w=>w.task===id && w.type==="marked");
  const items = stuckItems(t);
  items.forEach(it=>{ const k = rvKey(it.snippet); it.marks = marks.filter(w=>rvKey(String(w.text||"").split("\n")[0]) === k); });
  return items.filter(it=>it.marks.length);
}

function markSel(ta, kind){
  const [a, b] = kind === "note" ? ["[[", "]]"] : ["{", "}"], other = kind === "note" ? /\{([^{}]*)\}/g : /\[\[([\s\S]*?)\]\]/g;
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  const put = (val, from, to) => { ta.value = val; ta.focus(); ta.setSelectionRange(from, to); ta.dispatchEvent(new Event("input")); };
  let m;
  while((m = other.exec(v))){ const from = m.index, to = from + m[0].length;
    if(s >= from && e <= to) return put(v.slice(0, from) + a + m[1] + b + v.slice(to), from + a.length, from + a.length + m[1].length); }
  if(s === e){ const sp = s > 0 && !/\s/.test(v[s-1]) ? " " : ""; return put(v.slice(0, s) + sp + a + b + v.slice(s), s + sp.length + a.length, s + sp.length + a.length); }

let GNK = 0;   /* engine 43: ids that tie a gap to its red note */
function gapLineHTML(line){
  if(line.scene) return `<p class="scene"><span>${esc((line.p || []).join(""))}</span></p>`;   /* engine 49: a date / time line, like WhatsApp's */
  const parts = line.p; let html = "", i = 0, notes = "";

    const x = parts[i];
    if(typeof x === "object" && "r" in x){
      let chunk = "", ns = [];
      while(i < parts.length){
        const y = parts[i];
        if(typeof y === "object" && "r" in y){ chunk += `<span class="gap${y.o?" o":""}"><span class="f">${esc(y.f)}</span><span class="r">${esc(y.r)}</span></span>`; if(y.n) ns.push(y.n); i++; }
        else if(typeof y === "string" && /^\s+$/.test(y) && typeof parts[i+1] === "object" && parts[i+1] && "r" in parts[i+1]){ chunk += y; i++; }
        else break;

      html += `<span class="chunk" role="button" tabindex="0" aria-label="Show the missing words"${nk?` data-nk="${nk}"`:""}>${chunk}</span>`;
      if(nk) notes += `<span class="gap-n" data-nk="${nk}" hidden>${esc(ns.join(" · ")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</span>`;   /* **key word** bold (engine 46) */
    } else if(typeof x === "object" && "b" in x){ html += `<b class="given">${esc(x.b)}</b>`; i++; }   /* given words: blue bold, as the TZ data says (engine 46) */
    else if(typeof x === "object" && "ipa" in x){ html += `<span class="ipa${x.o?" o":""}">${esc(x.ipa)}</span>`; i++; }   /* engine 44: shown IPA (a glossary that helps) */
    else { html += esc(x); i++; }
  }

/* «Fix it» (TZ from the C1 lesson chat 31.10; her wish: the fixed form big and red). Each block opens with its card: the slip with only the
   wrong bit struck grey (‸ = a missing word) and the good part green, the right version with the fix big and red, why in English, then
   in Russian, smaller. Its items are `fix` steps — place (put the word in its ▢: tap a ▢ and a word, or drag the word; her approval
   31.10: «перетащите слово в нужное место») and which (tap every possible option) — or rewrite steps (write) carrying the same card. */
const fixMd = (s, good) => { let h = esc(s||"").replace(/~~(.+?)~~/g, '<span class="fx-del">$1</span>').replace(/\*\*(.+?)\*\*/g, '<b class="fx-fix">$1</b>').replace(/‸/g, '<span class="fx-caret" aria-label="a missing word">‸</span>');
  if(good){ const g = esc(good), i = h.indexOf(g); if(i > -1) h = h.slice(0, i) + `<span class="good">${g}</span>` + h.slice(i + g.length); }
  return h; };
/* the first item of a block shows the whole card; the next ones a shorter card (the slip and the fix, no why), so the item stays on screen */
function fixCardHTML(b, full = true){
  return `<div class="fx-card ${full?"":"short"}">${b.title?`<p class="fx-t">${esc(b.title)}</p>`:""}${(b.card||[]).map(c=>`<div class="fx-pair"><p class="fx-wrong">${fixMd(c.wrong, c.good)}</p><p class="fx-right">${fixMd(c.right)}</p></div>`).join("")}
    ${full&&b.why_en?`<p class="fx-why">${esc(b.why_en)}</p>`:""}${full&&b.why_ru?`<p class="fx-ru">${esc(b.why_ru)}</p>`:""}</div>`;
}
const fixWords = it => Array.isArray(it.word) ? it.word : [it.word];
const fixRight = it => it.pick || fixWords(it)[0];
/* the sentence with the word in its place (red), the other ▢ gone; cap: the word starts the sentence */
const placeAnswerHTML = (it, w) => { const word = it.cap ? w.charAt(0).toUpperCase() + w.slice(1) : w;
  return it.tokens.map((t, i) => t === "▢" ? (i === it.slot ? `<b class="fx-fix fx-in">${esc(word)}</b>` : null) : esc(t)).filter(x => x != null).join(" "); };
function fixSnippet(st){ const it = st.it || {};
  return it.kind === "place" ? plainText(placeAnswerHTML(it, fixRight(it))) : it.kind === "which" ? (it.q ? it.q + " " : "") + (it.opts||[]).join(" / ") : ""; }
const fixSt = {};
function renderFix(st, count, pct){
  const it = st.it, key = current.id + "-" + curS() + (current._once ? "-again" : ""), S = fixSt[key] = fixSt[key] || {sel: null, slot: null, picks: [], msg: ""};
  if(!checked) S.solved = false;
  let inner = "";
  if(it.kind === "place"){
    const ws = fixWords(it);
    inner = checked
      ? `<p class="target fx-ans">${placeAnswerHTML(it, fixRight(it))}${markBtn(String(stepIdx), fixSnippet(st))}${bmBtn(curS(), 0)}</p>${S.solved ? `<p class="fx-msg ok">✓ That's it.</p>` : ""}`
      : `<p class="target fx-sent">${it.tokens.map((t, i) => t === "▢" ? `<button type="button" class="fx-slot ${S.slot === i ? "on" : ""} ${S.shake === i ? "shake" : ""}" data-slot="${i}" aria-label="Put the word here"></button>` : `<span class="fx-tok">${esc(t)}</span>`).join(" ")}</p>
         <div class="fx-chips" role="group" aria-label="The word">${ws.map(w => `<button type="button" class="fx-chip ${S.sel === w ? "on" : ""}" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>
         <p class="fx-msg ${S.msg ? "no" : ""}" aria-live="polite">${esc(S.msg || "")}</p>`;
  } else if(it.kind === "which"){
    const picks = new Set(S.picks), ok = new Set(it.ok || []);
    inner = `${it.q ? `<p class="fx-q">${esc(it.q)}${checked ? markBtn(String(stepIdx), fixSnippet(st)) + bmBtn(curS(), 0) : ""}</p>` : ""}<div class="fx-opts">${(it.opts||[]).map((o, i) => { const on = picks.has(i);
        const cls = checked ? (ok.has(i) ? "right" : "wrong") + (on ? " picked" : "") : (on ? "on" : "");
        const tag = checked && on ? `<span class="fx-tag">${ok.has(i) ? "✓" : "✗"}</span>` : "";
        return `<button type="button" class="fx-opt ${cls}" data-o="${i}" aria-pressed="${on}" ${checked ? "disabled" : ""}><span class="fx-box" aria-hidden="true"></span><span class="fx-o">${esc(o)}</span>${tag}</button>`; }).join("")}</div>
      ${checked && !it.q ? `<p class="mk-row mk-right">${markBtn(String(stepIdx), fixSnippet(st))}${bmBtn(curS(), 0)}</p>` : ""}`;
  }
  const dflt = it.kind === "place" ? "Put the word in the right place: tap a ▢, then the word — or drag the word." : "Tap every possible option. Then tap Check.";
  shell({count, pct, instr: st.instr || dflt,
    stageHTML: `<div class="panel fx ${checked ? "checked" : ""}">${st.card ? fixCardHTML(st.card, st.cardFirst !== false) : ""}${inner}${checked ? markHint() + revHint() : ""}${checked && it.n ? `<p class="note">${esc(it.n)}</p>` : ""}</div>`,
    actionsHTML: navButtons(it.kind === "place" ? "Show the answer" : "Check")});
  wireNav(() => renderTaskKeep());
  if(checked) return;
  if(it.kind === "which"){
    app.querySelectorAll(".fx-opt").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.o, k = S.picks.indexOf(i);
      if(k > -1) S.picks.splice(k, 1); else S.picks.push(i); b.classList.toggle("on", k < 0); b.setAttribute("aria-pressed", k < 0); }));
    return;
  }
  const ws = fixWords(it);
  const place = (i, w) => {
    if(i === it.slot && w === fixRight(it)){ S.msg = ""; S.solved = true; checked = true; renderTaskKeep(); const a = app.querySelector(".fx-in"); if(a) a.classList.add("pop"); return; }
    S.msg = i === it.slot ? "Not quite — try the other word." : "Not quite — try another place."; S.shake = i; S.sel = null; S.slot = null;
    renderTaskKeep(); setTimeout(() => { S.shake = null; const sl = app.querySelector(".fx-slot.shake"); if(sl) sl.classList.remove("shake"); }, 600);
  };
  app.querySelectorAll(".fx-slot").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.slot;
    if(ws.length === 1) return place(i, ws[0]);
    if(S.sel) return place(i, S.sel);
    S.slot = S.slot === i ? null : i; S.msg = ""; renderTaskKeep(); }));
  app.querySelectorAll(".fx-chip").forEach(c => {
    const w = c.dataset.w;
    const tap = () => { if(S.slot != null) return place(S.slot, w); S.sel = S.sel === w ? null : w; S.msg = ""; renderTaskKeep(); };
    /* drag (a bonus; tapping works everywhere): a copy of the chip follows the finger, dropped on a ▢ it's placed there */
    let x0 = 0, y0 = 0, ghost = null, moved = false;
    c.addEventListener("pointerdown", e => { if(e.button > 0) return; x0 = e.clientX; y0 = e.clientY; moved = false; ghost = null; c.setPointerCapture && c.setPointerCapture(e.pointerId); });
    c.addEventListener("pointermove", e => { if(x0 == null || (!moved && Math.hypot(e.clientX - x0, e.clientY - y0) < 6) || !c.hasPointerCapture || !c.hasPointerCapture(e.pointerId)) return;
      if(!moved){ moved = true; const r = c.getBoundingClientRect(); ghost = c.cloneNode(true); ghost.classList.add("fx-ghost"); ghost.style.width = r.width + "px"; document.body.appendChild(ghost); c.classList.add("dragging"); }
      ghost.style.left = (e.clientX - ghost.offsetWidth / 2) + "px"; ghost.style.top = (e.clientY - ghost.offsetHeight / 2) + "px";
      app.querySelectorAll(".fx-slot").forEach(sl => sl.classList.remove("over")); const t = document.elementFromPoint(e.clientX, e.clientY), sl = t && t.closest && t.closest(".fx-slot"); if(sl) sl.classList.add("over"); });
    c.addEventListener("pointerup", e => { if(c.hasPointerCapture && c.hasPointerCapture(e.pointerId)) c.releasePointerCapture(e.pointerId);
      if(!moved){ x0 = null; return; }
      x0 = null; if(ghost){ ghost.remove(); ghost = null; } c.classList.remove("dragging");
      const t = document.elementFromPoint(e.clientX, e.clientY), sl = t && t.closest && t.closest(".fx-slot");
      if(sl) place(+sl.dataset.slot, w); else app.querySelectorAll(".fx-slot").forEach(s2 => s2.classList.remove("over")); });
    c.addEventListener("pointercancel", () => { x0 = null; if(ghost){ ghost.remove(); ghost = null; } c.classList.remove("dragging"); });
    c.addEventListener("click", e => { if(moved){ moved = false; e.preventDefault(); return; } tap(); });
  });
}
