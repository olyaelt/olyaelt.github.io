/* engine 47 (her catch 29.10): when every answer of a step has been opened by hand, the step counts as checked — it shows what Check shows
   (notes, bookmarks) where the student is, and the button says Next / Finish, so there's no extra tap on "Check" */
function checkWhenAllOpen(sel){
  if(checked) return; const items = [...app.querySelectorAll(sel)].filter(c => !c.classList.contains("plain"));
  if(!items.length || !items.every(c => c.classList.contains("open"))) return;
  const y = scrollY; checked = true; renderTaskKeep(); scrollTo(0, y);
}

/* ---------- say it in English ---------- */
function renderSayit(st, count, pct){
  const s = st.s;
  const bx = st.box !== undefined ? st.box : (typeof BOX_CLOCKS !== "undefined" ? BOX_CLOCKS : "");
  shell({count, pct,
    instr: st.instr || (st.first ? "Say it in English — aloud. Then tap the yellow box to check." : "Say it in English."),
    stageHTML: `
      <div class="panel">
        <div class="say">
          ${s.rows.map((row,i)=> st._rows && !st._rows.has(i) ? "" : `<div class="say-row"><span class="q">${row[0]}</span>
            <span class="say-a"><button class="reveal ${checked?"open":""}" data-r="${i}" aria-label="Show the English">${s.html ? row[1] : esc(row[1])}</button>${markBtn(stepIdx+"-"+i, s.html ? plainText(row[1]) : row[1])}${bmBtn(curS(), i)}</span>${checked&&row[2]?`<p class="small say-note">${row[2]}</p>`:""}</div>`).join("")}
        </div>
        ${checked?markHint()+revHint():""}
        ${checked&&s.note?`<p class="small">${s.note}</p>`:""}
      </div>${(checked||st.boxAlways)&&bx?box(bx):""}`,
    withBox: (checked||st.boxAlways) && !!bx, actionsHTML: navButtons()});
  app.querySelectorAll(".reveal").forEach(b=>b.addEventListener("click",()=>{ b.classList.toggle("open"); checkWhenAllOpen(".reveal"); }));
  wireNav(()=>renderTaskKeep());
}

/* ===== sort (engine 49, B2 30.10, her words: «паттерны сбоку… переводят с русского… появляется английский пример… в паттерн… первый за них
   сделать, красиво летел медленно… потом с подсказками, паттерн за паттерном»): four pattern boxes and the Russian lines one by one —
   say it aloud, tap to see the English, then tap a box (or drag the card onto it). mode "auto" flies into its box by itself, "hint" makes
   the right box glow, "free" gives no help; a wrong box shakes and the card's why line shows. Then the four boxes with their lines and the
   noticing question.
   Engine 50 (her test 31.10: "we lead the students, we don't rely on their behaviour" — she looked away, came back to another card; "Show all
   the answers" did the task for her): nothing moves on by itself — after a card lands, its why line stays and the main button says
   "Next card →"; there is no button that skips the task: the main button is Check (show the English), then waits until the card is in
   its box. ===== */
const SORTS = Object.assign({}, typeof lsJSON === "function" ? lsJSON("hw-sort-" + PAGE_KEY, {}) : {});
Object.values(SORTS).forEach(x => { x.busy = false; x.fresh = false; });
const saveSorts = () => ls.set(SORT_KEY, JSON.stringify(SORTS));
function sortState(){ const k = current.id + ":" + curS() + (current._once ? ":once" : ""); return SORTS[k] || (SORTS[k] = {at: 0, open: false, landed: false, placed: {}, done: false, why: null, wrong: null, fresh: true}); }
const sortItems = st => st.data.items.map((it, i) => Object.assign({}, it, {i})).filter(it => !st._rows || st._rows.has(it.i)).map(it => st._rows ? Object.assign(it, {mode: "free"}) : it);
/* a card as it was left: placed → open, in its box, its why line; not yet → closed */
function sortShow(S, items){ const x = items[S.at], p = S.placed[x.i]; S.wrong = null;
  if(p){ S.open = true; S.landed = true; S.why = x.mode !== "free" ? {p, t: x.why} : null; } else { S.open = false; S.landed = false; S.why = null; } }
const sortBold = (en, p) => p === "p2" || /\bto me\b/.test(en) ? esc(en).replace(/(recommended?\b.*?\bto me)/, "<b>$1</b>") : esc(en).replace(/^(.*?\brecommend(?:ed)?)\b/, "<b>$1</b>");
function renderSort(st, count, pct){
  const D = st.data, S = sortState(), items = sortItems(st), pats = D.patterns;
  if(current._review && !S.done){ items.forEach(x => { S.placed[x.i] = x.p; }); S.done = true; }   /* a finished task opens with the answers */
  saveSorts();
  if(S.done) checked = true;
  const inPat = p => items.filter(x => S.placed[x.i] === p);
  if(S.done){
    shell({count, pct, instr: "The four patterns, two sentences each. Then look at all eight.",
      stageHTML: `<div class="panel sort done"><div class="sort-pats sum">${pats.map(p => `<div class="sp"><span class="sp-en">${esc(p.en)}</span><span class="sp-ru">${esc(p.ru)}</span>
        <ul class="sp-list">${inPat(p.id).map(x => `<li>${sortBold(x.en, p.id)} ${markBtn(stepIdx + "-" + x.i, x.en)}${bmBtn(curS(), x.i)}</li>`).join("")}</ul></div>`).join("")}</div>
        ${markHint()}${revHint()}
        ${D.end && !current._once ? `<div class="sort-end"><p class="se-q">${esc(D.end.q)}</p><details class="se-a"><summary>Tap to see</summary><p>${esc(D.end.a)}</p></details></div>` : ""}
        <p class="sort-again"><button class="linklike" data-sort-again>↺ Do it again</button></p></div>`,
      withBox: false, actionsHTML: `<button class="btn" id="prev">Back</button><button class="btn primary grow" id="go">${stepIdx === current.steps.length - 1 ? "Finish" : "Next"}</button>`});
    /* Back = the last card again (her 31.10: "why is Back grey?"); Do it again = from the first card */
    document.getElementById("prev").addEventListener("click", () => { S.done = false; S.at = items.length - 1; sortShow(S, items); checked = false; renderTaskKeep(); });
    document.getElementById("go").addEventListener("click", () => { stepIdx++; checked = false; renderTask(); });
    app.querySelector("[data-sort-again]").addEventListener("click", () => { Object.assign(S, {at: 0, open: false, landed: false, placed: {}, done: false, why: null, wrong: null, fresh: true}); checked = false; renderTaskKeep(); });
    return;
  }
  checked = false;
  const it = items[S.at], last = S.at === items.length - 1;
  const ask = !S.open ? `Say it in English — aloud. Then tap to check.${it.mode === "auto" ? " Watch the first one." : ""}`
    : S.landed ? (it.mode === "free" ? "✓ Right box." : "✓ That's its pattern.")
    : it.mode === "auto" ? "Watch: it goes into its pattern." : "Now put it in its pattern: tap the box (or drag the card).";
  const goLabel = !S.open ? "Check" : S.landed ? (last ? "See all four patterns →" : "Next card →") : it.mode === "auto" ? "Watch…" : "Put it in its pattern ↑";
  shell({count, pct, instr: D.intro || st.instr || "Say each sentence in English, then sort it into its pattern.",   /* engine 52: the data's intro on top */
    stageHTML: `<div class="panel sort"><div class="sort-pats">${pats.map(p => { const xs = inPat(p.id);
        return `<button class="sp${S.open && !S.landed && it.mode === "hint" && p.id === it.p ? " glow" : ""}" data-sp="${p.id}" aria-label="${esc(p.en)} — ${esc(p.ru)}"><span class="sp-en">${esc(p.en)}</span><span class="sp-ru">${esc(p.ru)}</span>
          ${xs.length ? `<span class="sp-c">${xs.length}</span>` : ""}<span class="sp-list">${xs.map(x => `<span>${esc(x.en)}</span>`).join("")}</span>${S.why && S.why.p === p.id ? `<span class="sp-why">${esc(S.why.t)}</span>` : ""}</button>`; }).join("")}</div>
      <div class="sort-card${S.open ? " open" : ""}${S.landed ? " landed" : ""}${S.fresh ? " in" : ""}" data-scard>
        <span class="sc-n">${S.at + 1} of ${items.length}</span>
        <p class="sc-ru">${esc(it.ru)}</p>
        <p class="sc-en-row"><button class="reveal ${S.open ? "open" : ""}" data-sen aria-label="${S.open ? "The English" : "Show the English"}" ${S.landed ? `style="visibility:hidden"` : ""}>${esc(it.en)}</button>${S.open ? markBtn(stepIdx + "-" + it.i, it.en) + bmBtn(curS(), it.i) : ""}</p>
        ${S.open && it.or ? `<p class="sc-or">or: ${esc(it.or)}</p>` : ""}
        <p class="sc-ask">${ask}</p>
        ${S.wrong ? `<p class="sc-why">${esc(S.wrong)}</p>` : ""}
      </div>${S.open ? markHint() + revHint() : ""}</div>`,
    withBox: false, actionsHTML: `<button class="btn" id="prev">Back</button>
          <button class="btn primary grow" id="go" ${S.open && !S.landed ? "disabled" : ""}>${goLabel}</button>`});
  S.fresh = false;
  /* Back = the card before, as it was left (in its box, with its why line) — like the slide before */
  document.getElementById("prev").addEventListener("click", () => { if(S.busy) return; if(S.at > 0){ S.at--; sortShow(S, items); keep(); } else if(stepIdx > 0){ stepIdx--; checked = false; renderTask(); } else goHome(); });
  const box = p => app.querySelector(`[data-sp="${p}"]`);
  const keep = () => { const y = scrollY; renderTaskKeep(); scrollTo(0, y); };
  const next = () => { S.at++; S.fresh = true; if(S.at >= items.length){ S.done = true; checked = true; } else sortShow(S, items); keep(); };
  /* the card's English flies into its box: slowly for the first one (1.2 s), quicker when they tap the box */
  const fly = (p, ms, done) => {
    const enEl = app.querySelector("[data-sen]"); if(!enEl || !box(p)){ done(); return; } const from = enEl.getBoundingClientRect(), to = box(p).getBoundingClientRect();
    if(calmMotion()){ done(); return; }
    const f = document.createElement("div"); f.className = "sort-fly"; f.textContent = it.en; document.body.appendChild(f);
    f.style.left = from.left + "px"; f.style.top = from.top + "px"; f.style.width = from.width + "px";
    const dx = to.left + 8 - from.left, dy = to.top + to.height / 2 - from.top - from.height / 2;
    const sc = Math.min(1, (to.width - 16) / from.width); f.style.transformOrigin = "0 50%";
    const a = f.animate([{transform: "translate(0,0) scale(1)"}, {transform: `translate(${dx}px,${dy}px) scale(${sc.toFixed(2)})`, opacity: .7}], {duration: ms, easing: "ease-in-out", fill: "forwards"});
    enEl.style.visibility = "hidden"; a.onfinish = () => { f.remove(); done(); };
  };
  /* it lands: the box fills, the why line stays (auto / hint) until they tap Next card */
  const land = p => { S.placed[it.i] = p; S.landed = true; S.busy = false; S.why = it.mode !== "free" ? {p, t: it.why} : null; S.wrong = null;
    keep(); const b = box(p); if(b) b.classList.add("landed"); };
  const place = p => {
    if(S.busy || !S.open || S.landed || it.mode === "auto") return;
    if(p === it.p){ S.busy = true; fly(p, 550, () => land(p)); return; }
    S.wrong = it.why; keep(); const b = box(p); if(b){ b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
  };
  const reveal = () => { if(S.open || S.busy) return; S.open = true; keep();
    const c2 = app.querySelector("[data-scard]");
    if(it.mode === "auto"){ S.busy = true; setTimeout(() => fly(it.p, 1200, () => land(it.p)), calmMotion() ? 0 : 700); }
    else if(it.mode === "hint" && c2){ const b = box(it.p).getBoundingClientRect(), r = c2.getBoundingClientRect();
      c2.style.setProperty("--nx", Math.sign(b.left + b.width / 2 - r.left - r.width / 2) * 8 + "px"); c2.style.setProperty("--ny", Math.sign(b.top - r.top) * 8 + "px"); c2.classList.add("nudge"); } };
  app.querySelector("[data-sen]").addEventListener("click", reveal);
  document.getElementById("go").addEventListener("click", () => { if(!S.open) reveal(); else if(S.landed) next(); });
  app.querySelectorAll("[data-sp]").forEach(b => b.addEventListener("click", () => place(b.dataset.sp)));
  /* drag the card onto a box (a bonus: tapping a box works everywhere) */
  const en = app.querySelector("[data-sen]");
  if(S.open && !S.landed && it.mode !== "auto"){
    en.addEventListener("pointerdown", e => { if(S.busy) return; const r = en.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top; let g = null;
      const mv = ev => { if(!g && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < 8) return;
        if(!g){ g = document.createElement("div"); g.className = "sort-fly"; g.textContent = it.en; g.style.width = r.width + "px"; document.body.appendChild(g); }
        g.style.left = ev.clientX - ox + "px"; g.style.top = ev.clientY - oy + "px"; };
      const up = ev => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); if(!g) return; g.remove();
        const t = document.elementFromPoint(ev.clientX, ev.clientY), b = t && t.closest && t.closest("[data-sp]"); if(b) place(b.dataset.sp); };
      addEventListener("pointermove", mv); addEventListener("pointerup", up); });
  }
}
const calmMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

/* ---------- share your reaction and ask ---------- */
function renderShare(st, count, pct){
  const s = st.s, q = s.q || "";
  const turn = (who, text) => who === "b"
    ? `<div class="turn b"><div class="bubble">${esc(text)}</div><img class="fig" src="${IMG_B}" alt=""></div>`
    : `<div class="turn a"><img class="fig" src="${IMG_A}" alt=""><div class="bubble">${esc(text)}</div></div>`;
  const bBubble = checked
    ? `<span class="mark-s">${s.s}</span>${q?` <span class="mark-a">${q}</span>`:""}`
    : (typeof s.hint === "string" ? `<span class="hint">${s.hint}</span>`
      : s.hint ? `<span class="hint"><span class="s">[share your reaction]</span> <span class="a">[ask a question]</span></span>` : `<span class="dots" aria-label="Your turn">• • •</span>`);
  const bx = checked && st.boxAfter !== undefined ? st.boxAfter : st.box !== undefined ? st.box : BOX_SHARE;   /* a step can bring its own box, or none (""); boxAfter = another box on the answer */
  shell({count, pct, instr: s.i,
    stageHTML: `
      <div class="panel convo">
        ${s.ctx?`<p class="situation">${esc(s.ctx)}</p>`:""}
        ${(s.pre||[]).map(([who,text])=>turn(who,text)).join("")}

let ytPromise = null, ytPlayer = null, ytTimer = null, ytWatch = null, ytReady = false, ytVideo = "", ytReadyWatch = null;
/* engine 36 (a C1 student's phone, 28.10: a black box, no message): YouTube says it's ready through one callback,
   window.onYouTubeIframeAPIReady; a browser that puts its own button on YouTube videos (Yandex Browser does) or a slow
   connection can mean that call never reaches us. So we also watch for YT.Player itself, wait up to 20 s instead of 7,
   and a failed load can be tried again (Try again on the message) */
const YT_API_WAIT = 20000, YT_READY_WAIT = 15000; let ytTries = 0;
const ytApiOk = () => !!(window.YT && typeof window.YT.Player === "function");
function loadYT(){
  if(ytApiOk()) return Promise.resolve();
  if(!ytPromise){
    ytPromise = new Promise((res, rej)=>{
      let done = false, poll = null, stop = null;
      const finish = err => { if(done) return; done = true; clearInterval(poll); clearTimeout(stop); if(err){ ytPromise = null; rej(err); } else res(); };
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function(){ try{ if(typeof prev === "function") prev.apply(this, arguments); }catch(e){} if(ytApiOk()) finish(); };
      poll = setInterval(()=>{ if(ytApiOk()) finish(); }, 250);
      stop = setTimeout(()=> finish(new Error("timeout")), YT_API_WAIT);
      const API = 'script[src="https://www.youtube.com/iframe_api"]';
      /* trying again: a failed try can leave YT half-made ({loading: 1}), and then the API script loads nothing, so start clean
         (not on the first try: something else on the page may be loading the API right now) */
      if(++ytTries > 1){ document.querySelectorAll(API).forEach(x => x.remove()); if(window.YT && !ytApiOk()){ try{ window.YT = undefined; }catch(e){} } }
      if(!document.querySelector(API)){
        const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.async = true;
        s.onerror = () => { s.remove(); finish(new Error("blocked")); }; document.head.appendChild(s);
      }
    });
  }
  return ytPromise;
}

}

const taskPeek = () => `<details class="task-peek"><summary><b>Your task</b> <span class="small">tap to see</span></summary><div class="task-card">${TASK_HTML}</div></details>`;
const modelHTML = () => !MODEL.length ? "" : `<details class="model-peek"><summary><b>${typeof MODEL_TITLE!=="undefined"?MODEL_TITLE:"The conversation from class"}</b></summary>
  ${READ_INTRO?`<p class="situation">${READ_INTRO}</p>`:""}<div class="model">${MODEL.map(([sp,line])=>`<p><span class="spk">${sp}:</span> ${line}</p>`).join("")}</div></details>`;

/* 1. the task, short enough to keep in your head */
function renderTaskCard(st, count, pct){
  shell({count, pct, instr:"Here's your task. Keep it in mind.",
    stageHTML:`<div class="panel task-card">${TASK_HTML}</div>`, actionsHTML: plainNext()});
  wireNav(()=>{});
}

/* 2. plan: tap the phrases you'll use */
function renderPlan(st, count, pct){
  const picks = new Set(getList(picksKey()));
  const list = MAP.map((g,gi)=>`<h4 class="pick-h">${g.h}</h4>${g.items.map((it,ii)=>{ const [en,r,mean] = it, id = gi+"-"+ii;
      return `<button class="pick ${picks.has(id)?"on":""}" data-id="${id}" aria-pressed="${picks.has(id)}"><span class="tick" aria-hidden="true"></span>
        <span class="p-txt"><span class="p-en">${en}</span>${mean?` <span class="mean">— ${mean}</span>`:""}${ru(r)}</span></button>`; }).join("")}`).join("");
  /* engine 42: the why under the instruction; PLAN_WHY in the homework data replaces it ("" = none) */
  const why = typeof PLAN_WHY !== "undefined" ? PLAN_WHY : "They'll be with you on the next step, so you remember to use them.";
  shell({count, pct, instr: PLAN_INSTR + (why ? `<span class="instr-why">${why}</span>` : ""),
    stageHTML:`<div class="panel">
        ${taskPeek()}
        <div class="pick-count small" id="pc" aria-live="polite"></div>
        <div class="picks">${list}</div>
        ${TENSES?`<p class="small tenses"><b>Tenses:</b> ${TENSES}</p>`:""}
        ${modelHTML()}
      </div>`,
    actionsHTML: plainNext()});
  const pc = document.getElementById("pc");
  const upd = () => { const n = picks.size; pc.textContent = n ? `Picked: ${n}${n>=(typeof PICK_MIN!=="undefined"?PICK_MIN:3)?" ✓":""}` : "Nothing picked yet"; };
  upd();
  app.querySelectorAll(".pick").forEach(b=>b.addEventListener("click",()=>{
    const id = b.dataset.id; if(picks.has(id)) picks.delete(id); else picks.add(id);
    b.classList.toggle("on", picks.has(id)); b.setAttribute("aria-pressed", picks.has(id));
    ls.set(picksKey(), JSON.stringify([...picks])); upd();
  }));
  wireNav(()=>{});
}

/* 3. record it (or write it), tick the phrases you used, send it */
function renderProduce(st, count, pct){
  /* modes:["write"] on the step (or the task) = writing only, no Record tab (dialogues); default both */
  const modes = (st.modes || current.modes || ["write", "record"]).filter(m => m === "write" || m === "record");
  if(!modes.length) modes.push("write");
  const mode = modes.includes(ls.get("hw-mode")) ? ls.get("hw-mode") : modes[0];
  const instr = modes.includes("record") ? PRODUCE_INSTR : String(PRODUCE_INSTR||"").replace(/\s*\(Prefer to talk\? Tap Record it\.\)/, "");
  const picks = getList(picksKey()), used = new Set(getList(usedKey()));
  const picked = picks.map(id=>{ const [gi,ii] = id.split("-").map(Number); const it = MAP[gi] && MAP[gi].items[ii]; return it ? {id, gi, ii, en:it[0]} : null; }).filter(Boolean);
  /* engine 31 (her decision 27.10): the parts are the moves of the conversation, so the phrases are checked against the same moves;
     on when MAP has 2+ parts, PICK_EACH = false in the homework data = the flat list (menu-style tasks) */
  const byPart = MAP.length > 1 && (typeof PICK_EACH === "undefined" || PICK_EACH !== false);
  const cbHTML = p => `<label><input type="checkbox" data-u="${p.id}" ${used.has(p.id)?"checked":""}><span>${p.en}</span></label>`;
  const planAt = (current.steps || []).findIndex(s => s.type === "plan");
  const partsHTML = () => MAP.map((g, gi) => { const ps = picked.filter(p => p.gi === gi).sort((a, b) => a.ii - b.ii);
      return `<div class="ph-part ${ps.length ? "" : "empty"}"><h4 class="ph-h">${!ps.length && planAt >= 0 ? `<button class="ph-back" data-plan aria-label="${esc(String(g.h).replace(/<[^>]+>/g, ""))}: choose phrases">${g.h}</button>` : g.h}</h4>
        ${ps.length ? ps.map(cbHTML).join("") : `<span class="small ph-zero">0 phrases</span>`}</div>`; }).join("");
  shell({count, pct, instr,
    stageHTML:`<div class="panel">
        ${taskPeek()}
        ${modes.length > 1 ? `<div class="seg" role="tablist">
          <button class="seg-btn ${mode==="write"?"on":""}" data-mode="write" role="tab" aria-selected="${mode==="write"}">Write it</button>
          <button class="seg-btn ${mode==="record"?"on":""}" data-mode="record" role="tab" aria-selected="${mode==="record"}">Record it</button>
        </div>` : ""}
        <div id="m-record" ${mode==="record"?"":"hidden"} class="mode">
          <div class="rec-row" id="rec-row">
            <button class="rec-btn" id="rec"><span class="dot" aria-hidden="true"></span><span id="rec-label">Start recording</span></button>
            <span class="count" id="rec-time" aria-live="polite"></span>
          </div>
          <div id="rec-review" hidden class="mode">
            <audio id="rec-audio" controls preload="metadata"></audio>
            <div class="row-btns"><button class="btn" id="rec-again">Record again</button></div>
            ${PRODUCE_NOTE}
          </div>
          <p class="small" id="rec-msg" hidden></p>
        </div>
        <div id="m-write" ${mode==="write"?"":"hidden"} class="mode">
          <textarea id="txt" rows="7" placeholder="${typeof PRODUCE_PH!=="undefined"?PRODUCE_PH:"A: …&#10;B: …"}&#10;(Tap the microphone on your keyboard to dictate.)">${esc(ls.get(draftKey()))}</textarea>
          <p class="small saved-note" id="txt-saved" aria-live="polite" hidden></p>
        </div>
        <fieldset class="check">
          <legend>Your phrases</legend>
          ${picked.length ? `<span class="small">Did you use them? Tick the ones you did.</span>` : `<span class="small">You didn't pick any phrases. Tap Back to choose some — or just go ahead.</span>`}
          ${byPart ? partsHTML() : picked.map(cbHTML).join("")}
        </fieldset>
        <label class="field"><span class="small">Your name</span><input id="who" type="text" autocomplete="given-name" placeholder="Your name" value="${esc(ls.get("hw-name"))}"></label>
        <div class="row-btns">
          <button class="btn" id="copy" ${mode==="write"?"":"hidden"}>Copy</button>
          <button class="btn primary grow" id="send">Send to Olya</button>
        </div>
        <p class="small" id="msg" hidden></p>
      </div>`,
    actionsHTML: plainNext()});
  const $ = id => document.getElementById(id), who = $("who");
  const say = (id, html) => { const el=$(id); el.hidden=false; el.innerHTML=html; };
  let curMode = mode;
  app.querySelectorAll(".seg-btn").forEach(b=>b.addEventListener("click",()=>{
    curMode = b.dataset.mode; ls.set("hw-mode", curMode);
    app.querySelectorAll(".seg-btn").forEach(x=>{ x.classList.toggle("on", x===b); x.setAttribute("aria-selected", x===b); });
    $("m-record").hidden = curMode!=="record"; $("m-write").hidden = curMode!=="write"; $("copy").hidden = curMode!=="write";
  }));
  who.addEventListener("input",()=>ls.set("hw-name", who.value.trim()));
  app.querySelectorAll("[data-plan]").forEach(b=>b.addEventListener("click",()=>{ if(planAt >= 0){ stepIdx = planAt; checked = false; renderTask(); } }));
  app.querySelectorAll(".check input").forEach(cb=>cb.addEventListener("change",()=>{
    ls.set(usedKey(), JSON.stringify([...app.querySelectorAll(".check input")].filter(x=>x.checked).map(x=>x.dataset.u)));
  }));
  const txt = $("txt"), savedNote = $("txt-saved");
  /* her wish (27.10): the student sees that the text is kept if the page closes or the internet drops — no Save button */
  const showSaved = () => { const has = txt.value.trim() !== ""; savedNote.hidden = !has;
    savedNote.classList.toggle("warn", !lsKeeps);
    savedNote.textContent = lsKeeps ? "✓ Saved on this device" : "This browser won't keep your text after you close the page — tap Copy first."; };
  txt.addEventListener("input",()=>{ ls.set(draftKey(), txt.value); showSaved(); });
  showSaved();

  /* recording */
  const recBtn = $("rec"), label = $("rec-label"), time = $("rec-time");
  const showReview = () => { $("rec-review").hidden = false; $("rec-row").hidden = true; $("rec-audio").src = recState.url; };
  if(recState.url) showReview();
  recBtn.addEventListener("click", async ()=>{
    if(recState.rec){ recState.rec.stop(); return; }
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)){
      say("rec-msg","Recording doesn't work in this browser. Open the page in Chrome or Safari on your phone."); return; }
    try{ recState.stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ say("rec-msg","The microphone isn't available here. On your phone, allow the microphone when the browser asks."); return; }
    const mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(m=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
    const rec = new MediaRecorder(recState.stream, mime?{mimeType:mime}:undefined);
    recState.rec = rec; recState.chunks = [];
    rec.ondataavailable = ev => { if(ev.data && ev.data.size) recState.chunks.push(ev.data); };
    rec.onstop = async () => {
      clearInterval(recState.tick); recState.stream.getTracks().forEach(tr=>tr.stop());
      const type = rec.mimeType || (recState.chunks[0] && recState.chunks[0].type) || "audio/webm";
      const blob = new Blob(recState.chunks, {type});
      recState.rec = null; recState.stream = null;
      recBtn.classList.remove("on"); label.textContent = "Processing…"; recBtn.disabled = true;
      let file;
      if(/mp4|aac|m4a/.test(type)) file = new File([blob], "recording.m4a", {type:"audio/mp4"});
      else { try{ file = new File([await toWav(blob)], "recording.wav", {type:"audio/wav"}); }catch(e){ file = new File([blob], "recording.webm", {type:"audio/webm"}); } }
      if(recState.url) URL.revokeObjectURL(recState.url);
      recState.file = file; recState.url = URL.createObjectURL(file);
      recBtn.disabled = false; label.textContent = "Start recording"; time.textContent = "";
      showReview();
    };
    rec.start(); recState.t0 = Date.now();
    recBtn.classList.add("on"); label.textContent = "Stop"; $("rec-msg").hidden = true;
    recState.tick = setInterval(()=>{ const s=(Date.now()-recState.t0)/1000; time.textContent = mmss(s); if(s>=300) rec.stop(); }, 250);
  });
  $("rec-again").addEventListener("click",()=>{ $("rec-review").hidden = true; $("rec-row").hidden = false; recBtn.click(); });

  /* sending */
  const synced = () => !!myCode() && syncState!=="unknown" && !isTeacher();
  const usedPhrases = () => [...app.querySelectorAll(".check input")].filter(x=>x.checked).map(x=>{ const l=x.closest("label"); return l ? l.textContent.trim() : ""; }).filter(Boolean);
  const sentMsg = "Sent ✓ Olya's feedback will appear on the homework page — look for 💬. Now tap Finish.";
  async function toTable(type, text){
    const res = await post({action:"submit", code:myCode(), page:PAGE_KEY, date:LESSON.date, task:current.id, title:current.title, type, text, phrases:usedPhrases()});
    if(res.ok){
      const list = work[current.id] = work[current.id] || [];
      const d = new Date(), p2 = n=>String(n).padStart(2,"0");
      const item = {id:res.id, sent:`${p2(d.getDate())}.${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`, type:type==="recording"?"recording":"text", text, feedback:"", seen:false};
      const i = list.findIndex(w=>String(w.id)===String(res.id));
      if(i>-1) list[i] = item; else list.push(item);
      saveWork();
    }
    return res;
  }
  const tag = () => `Over to you · ${LESSON_TAG}${who.value.trim()?" · "+who.value.trim():""}`;
  const done = "If you sent it to Olya, mark the task in our spreadsheet in your colour.";
  $("copy").addEventListener("click", async ()=>{
    const text = txt.value.trim(); if(!text){ say("msg","Write or dictate it first."); return; }
    try{ await navigator.clipboard.writeText(tag()+"\n\n"+text); say("msg","Copied. Paste it into your chat with Olya or into our spreadsheet."); }
    catch(e){ txt.select(); say("msg","Copying didn't work here. Select the text and copy it."); }
  });
  $("send").addEventListener("click", async ()=>{
    if(curMode==="write"){
      const text = txt.value.trim(); if(!text){ say("msg","Write or dictate it first."); return; }
      if(synced()){
        const b = $("send"); b.disabled = true; say("msg","Sending…");
        const res = await toTable("text", text); b.disabled = false;
        say("msg", res.ok ? sentMsg : "It didn't go through — no connection right now. Your text is saved here, so try again in a minute.");
        return;
      }
      if(navigator.share){ try{ await navigator.share({title:tag(), text:tag()+"\n\n"+text}); say("msg",done); return; }catch(e){ if(e && e.name==="AbortError") return; } }
      $("copy").click(); return;
    }
    const f = recState.file; if(!f){ say("msg","Record it first."); return; }
    const named = new File([f], fileBase(who.value)+f.name.slice(f.name.lastIndexOf(".")), {type:f.type});
    if(navigator.canShare && navigator.canShare({files:[named]})){
      try{ await navigator.share({files:[named], title:tag(), text:tag()});
        if(synced()){ const res = await toTable("recording", ""); say("msg", res.ok ? sentMsg : done); } else say("msg",done);
        return; }
      catch(e){ if(e && e.name==="AbortError") return; }
    }
    say("msg", `This browser can't send the file directly. <a href="${recState.url}" download="${esc(named.name)}" id="save-rec">Save the recording</a>, then send it to Olya in Telegram.`);
    const sv = $("save-rec"); if(sv && synced()) sv.addEventListener("click",()=>{ toTable("recording",""); });
  });
  wireNav(()=>{});
}

/* ---------- start ---------- */
/* a student sees only their own group: with a code from the other group, go to that group's list */
function toOwnGroup(gid){
  if(!gid || gid === GROUP_ID || isTeacher()) return false;
  document.body.innerHTML = ""; location.replace("../" + gid + "/index.html"); return true;
}
const start = (location.hash||"").replace("#","");
if(!(myCode() && toOwnGroup(ls.get("hw-gid")))){
  if(start && TASKS.some(t=>t.id===start)) openTask(start); else renderHome();
  if(myCode()) syncNow();
}
</script>
