<title>How did you get into that? homework</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../fonts/homework-sans.css">
<style>
/* Layout: one calm column like a slide on a phone — task list home, then one task step per screen with a sticky action bar. Colours are Olya's deck colours. */
:root{
  --ground:#F6F1DC;      /* the cream frame around her slides */
  --card:#FFFFFF;
  --ink:#1D1D1B;
  --muted:#6B6B6B;
  --line:#D9D2B8;
  --instr:#0693E3;       /* blue instruction box */
  --instr-ink:#FFFFFF;
  --answer:#0000FF;      /* blue answers */
  --label:#E00000;       /* red category labels, key words */
  --hl:#FFFF00;          /* yellow hidden answers */
  --hl-ink:#1D1D1B;
  --share:#00FF00;       /* green: share your reaction */
  --gloss:#0693E3;
  --ipa:#0E8A7E;
  --bubble:#FFFF8C;
  --bubble-ink:#1D1D1B;
  --bubble-line:#1D1D1B;
  --summary:#D9EAD3;     /* green box from the spreadsheet */
  --done:#2E8B3E;
  --date-bg:#FF9900;
  --rec:#D93025;
  --topic-a:#FFF3CF; --topic-b:#E2EFFB;
  --ok-bg:#EAF7EC; --ok-chip:#CDEFD3; --ok-ink:#1E6B2E;
  --no-bg:#FDECEB; --no-chip:#F9D2CF; --no-ink:#A1261B;
  --good-hl:#BFF2B8; --strike:#9A9A9A; --fix-bg:#D6E6FF;
  --date-ink:#1D1D1B;
  --fig-filter:none;
  --font-body:"Homework Sans","Calibri","Carlito","Segoe UI",system-ui,sans-serif;
  --step-0:clamp(1rem,0.96rem + 0.2vw,1.0625rem);
  --step-1:clamp(1.125rem,1.06rem + 0.3vw,1.25rem);
  --step-2:clamp(1.375rem,1.25rem + 0.6vw,1.625rem);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121416; --card:#1C1F23; --ink:#ECECEA; --muted:#A4A7AB; --line:#33373D;
    --instr:#1578C0; --instr-ink:#FFFFFF; --answer:#8FB0FF; --label:#FF7A7A;
    --hl:#FFF34D; --hl-ink:#111111; --share:#52F552; --gloss:#5BB8F5; --ipa:#4CC5B3;
    --bubble:#3B391F; --bubble-ink:#F3F0D0; --bubble-line:#8C8760; --summary:#22362A; --done:#62C774;
    --fig-filter:invert(1) hue-rotate(180deg);
    --ok-bg:#18301E; --ok-chip:#24502E; --ok-ink:#9BE3A8; --no-bg:#3A1E1C; --no-chip:#5A2622; --no-ink:#FFB4AB; --good-hl:#BFF2B8; --strike:#8A8D91; --fix-bg:#22345A; --topic-a:#2A2614; --topic-b:#162636;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121416; --card:#1C1F23; --ink:#ECECEA; --muted:#A4A7AB; --line:#33373D;
  --instr:#1578C0; --instr-ink:#FFFFFF; --answer:#8FB0FF; --label:#FF7A7A;
  --hl:#FFF34D; --hl-ink:#111111; --share:#52F552; --gloss:#5BB8F5; --ipa:#4CC5B3;
  --bubble:#3B391F; --bubble-ink:#F3F0D0; --bubble-line:#8C8760; --summary:#22362A; --done:#62C774;
  --fig-filter:invert(1) hue-rotate(180deg);
  --ok-bg:#18301E; --ok-chip:#24502E; --ok-ink:#9BE3A8; --no-bg:#3A1E1C; --no-chip:#5A2622; --no-ink:#FFB4AB; --good-hl:#BFF2B8; --strike:#8A8D91; --fix-bg:#22345A; --topic-a:#2A2614; --topic-b:#162636;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--font-body);font-size:var(--step-0);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--instr);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- home ---------- */
.lesson-head{display:grid;gap:6px;padding-block:8px 18px}
.date{display:inline-flex;align-self:start;justify-self:start;font-weight:900;letter-spacing:.04em;font-size:.85rem;
  background:var(--date-bg);color:var(--date-ink);padding:3px 10px;border-radius:6px}
.lesson-head h1{font-size:var(--step-2);line-height:1.2;font-weight:900}
.lesson-head p{margin:0;color:var(--muted)}
details.summary{background:var(--summary);border-radius:var(--radius);padding:12px 16px;margin-bottom:22px}
details.summary summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.summary summary::-webkit-details-marker{display:none}
details.summary summary::after{content:"Show";font-weight:400;color:var(--muted)}
details.summary[open] summary::after{content:"Hide"}
.summary ul{margin:10px 0 2px;padding:0;list-style:none;display:grid;gap:6px}
.summary li b{font-weight:700}
.ru{font-style:italic;color:var(--muted)}
.ipa{color:var(--ipa);font-style:normal;white-space:nowrap}
.section{display:grid;gap:10px;margin-bottom:22px}
.section h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:900}
.all-hw{justify-self:start;color:var(--instr);font-weight:700;text-decoration:none;margin-bottom:6px}
.sync{margin:0 0 16px}
.sync-on{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;color:var(--muted);font-size:.95rem}
.sync-card{background:var(--card);border:2px solid var(--instr);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.sync-row{display:flex;gap:8px}
.sync-row input{flex:1;min-width:0;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sync-card .small{margin:0}
.sync-msg:empty{display:none}
.sync-card .sync-msg{color:var(--ink);font-weight:700}
.linklike{background:none;border:0;padding:0;color:var(--instr);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.total{font-size:.92rem}
.slow-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.slow{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.slow[aria-pressed="true"]{border-color:var(--instr);background:var(--instr);color:var(--instr-ink)}
.react{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;font-weight:400;color:var(--ink)}
.chips{display:inline-flex;gap:6px}
.chip{font:inherit;font-weight:700;border:2px solid var(--ok-ink);background:transparent;color:var(--ok-ink);border-radius:99px;padding:4px 12px;cursor:pointer}
.chip.on{background:var(--ok-ink);color:var(--card)}
.ask-box{display:grid;gap:8px;margin-top:10px}
.ask-box textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.react-msg{margin:6px 0 0;font-weight:400}
.react-msg:empty{display:none}
.fb-q{margin:0;font-style:italic}
.teacher .status{display:none}
.teacher .task-btn{padding-right:16px!important}
.teacher-bar{align-items:center}
.preview-bar{align-items:center;background:var(--card);border:2px dashed var(--instr);border-radius:12px;padding:8px 12px;color:var(--ink)}
.chip-t{font:inherit;font-size:.9rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 12px;cursor:pointer}
.chip-t[aria-pressed="true"]{border-color:var(--instr);background:var(--instr);color:var(--instr-ink)}
.t-strip{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;width:100%;margin:0 0 12px;padding:9px 12px;text-align:left;font:inherit;font-size:.95rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;cursor:pointer}
.t-strip.open{border-left-color:var(--instr)}
.t-strip-go{color:var(--instr);font-weight:700;white-space:nowrap}
.t-line{display:flex;flex-wrap:wrap;align-items:center;gap:5px;width:100%;text-align:left;background:transparent;border:0;padding:8px 4px 2px;cursor:pointer;font:inherit}
.t-chip{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-size:.8rem;font-weight:700}
.t-chip.on{background:var(--done);border-color:var(--done);color:#fff}
.t-chip.wide{margin:2px 0}
.t-count{font-weight:700;color:var(--muted);font-size:.9rem}
.t-badges{margin-left:auto;font-size:.88rem;color:var(--muted)}
.t-line.hot .t-badges{color:var(--label)}
.hot{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin:0 0 16px;border-left:5px solid var(--label)}
.hot ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.hot .small{margin:4px 0 0}
.hot.wait{border-left-color:var(--instr)}
.hot.wait li span{color:var(--muted);font-size:.9rem}
.t-item.t-focus{outline:3px solid var(--instr);outline-offset:2px}
.t-panel p{margin:0}
.t-item{margin-top:12px}
.t-task{margin-bottom:12px}
.t-item .task-peek{margin:6px 0 8px}
.t-text{background:var(--ground);border-radius:10px;padding:10px 12px;line-height:1.6}
.t-link{color:var(--instr);font-weight:700}
.t-tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{font:inherit;font-weight:700;border-radius:8px;padding:5px 10px;cursor:pointer;border:2px solid var(--line);background:var(--card)}
.tool.good{background:var(--good-hl);color:var(--hl-ink)}
.tool.del{color:var(--strike);text-decoration:line-through}
.tool.ins{color:#0000FF;background:var(--hl)}
.tool.cmt{color:var(--answer);background:var(--fix-bg)}
.t-ta{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.t-prev{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;min-height:2em}
.t-fb{display:grid;gap:8px;margin-top:8px}
.t-prev-h{margin-bottom:-4px}
.t-copy{margin-left:auto}
.t-msg{align-self:center}
.hot.wait .tool{margin-left:8px;font-size:.9rem;padding:3px 8px}
.t-prev:empty{display:none}
.t-msg:empty{display:none}
.mk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--instr);font:inherit;font-weight:900;font-size:.95rem;line-height:1;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;margin-left:6px;padding:0}
.mk.on{background:var(--instr);border-color:var(--instr);color:var(--instr-ink)}
.mk.demo{width:22px;height:22px;font-size:.8rem;margin:0 2px;cursor:default}
.mk-row{margin:0;display:flex;justify-content:flex-end}
.mk-right{margin-top:-4px}
.mk-hint{margin:0;font-size:.88rem;color:var(--muted);text-align:right}
.ln{position:relative}
.ln .mk{position:absolute;right:8px;top:8px}
.say-a{display:flex;align-items:center;gap:6px}
.say-a .reveal{flex:1}
.ln.has-mk{padding-right:46px}
.flagged{margin-top:10px;display:grid;gap:6px;font-weight:400;color:var(--ink)}
.fl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:var(--card);border-radius:10px;padding:6px 10px}
.fl-s{font-style:italic}
.note-box{display:flex;gap:6px;width:100%}
.note-box input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--ground);color:var(--ink)}
.note-box .btn{min-height:36px;padding:0 12px}
.meter{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin:0 0 16px;display:grid;gap:8px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.meter-top span{font-weight:900;color:var(--ink)}
.strip{display:flex;gap:3px;background:#1D1D1B;border-radius:6px;padding:9px 6px;position:relative}
.strip::before,.strip::after{content:"";position:absolute;left:6px;right:6px;height:3px;background:repeating-linear-gradient(90deg,#F6F1DC 0 5px,transparent 5px 11px);opacity:.55}
.strip::before{top:3px}.strip::after{bottom:3px}
.strip i{flex:1;height:22px;border-radius:2px;background:#3A3A36}
.strip i.on{background:linear-gradient(180deg,#FFE066,#FF9900)}
.meter .small{margin:0}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,520px);background:#1D1D1B;color:#fff;font-weight:700;padding:12px 16px;border-radius:12px;z-index:61;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .5s}
.toast.out{opacity:0}
.topic-earlier{background:var(--card);border:2px dashed var(--line)}
.task-wrap{display:grid;gap:0}
.fb-line{display:block;width:100%;text-align:left;margin-top:-6px;padding:12px 14px 8px;border-radius:0 0 12px 12px;font:inherit;font-size:.92rem;font-weight:700;border:0;background:var(--fix-bg);color:var(--answer);cursor:pointer}
.fb-line.is-new::after{content:" • new";color:var(--label)}
.fb-wait{background:transparent;color:var(--muted);font-weight:400;cursor:default;padding:8px 4px 0;margin-top:0}
.fb-key{margin:0 0 10px}
.fb-item{margin-bottom:12px}
.fb-text{font-size:var(--step-1);line-height:1.6}
.fb-good{background:var(--good-hl);color:var(--hl-ink);border-radius:2px;padding:0 2px;font-weight:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fb-del{text-decoration:line-through;text-decoration-thickness:2px;color:var(--strike)}
.fb-ins{color:#0000FF;font-weight:900;background:var(--hl);border-radius:3px;padding:0 2px;text-decoration:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fb-note{color:var(--answer);font-weight:700;background:var(--fix-bg);border-radius:3px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fb-orig summary{cursor:pointer;color:var(--muted)}
.fb-sent{margin-top:6px;white-space:normal}
.task-row{position:relative}
.task-row .status{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--card);cursor:pointer;padding:0;width:38px;height:38px;font-size:1.05rem}
.task-row.is-done .status{border-color:var(--done);background:var(--done);color:var(--card)}
.task-btn{display:grid;grid-template-columns:1fr;align-items:center;gap:12px;padding-right:62px!important;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;
  transition:transform .12s ease,border-color .12s ease}
.task-btn:hover{border-color:var(--instr)}
.task-btn:active{transform:scale(.99)}
.task-btn .t{font-weight:700;font-size:var(--step-1);line-height:1.3}
.task-btn .m{color:var(--muted);font-size:.9rem;margin-top:2px}
.task-btn .alt{font-size:.9rem;margin-top:6px}
.status{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:transparent}
.done-banner{background:var(--ok-bg);color:var(--ok-ink);font-weight:700;border-radius:12px;padding:10px 14px;margin-bottom:10px}
.foot{color:var(--muted);font-size:.88rem;display:grid;gap:4px;padding-top:6px}

/* ---------- task view ---------- */
.taskbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px 10px;display:grid;gap:8px}
.taskbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--instr);font-weight:700}
.count{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--instr);width:0;transition:width .25s ease}
.task-title{font-size:var(--step-1);font-weight:900;line-height:1.25}
.instr{background:var(--instr);color:var(--instr-ink);font-weight:700;padding:10px 14px;border-radius:4px;margin-block:12px 14px}
.stage{display:grid;gap:16px}
@media (min-width:720px){ .stage.with-box{grid-template-columns:minmax(0,1fr) 250px;align-items:start} }
.panel{background:var(--card);border-radius:var(--radius);padding:16px;min-width:0;display:grid;gap:12px}

/* dialogue with gaps */
.dlg{display:grid;gap:10px;margin:0}
.dlg p{margin:0;line-height:1.9}
.spk{font-style:italic;color:var(--muted)}
.chunk{cursor:pointer;border-radius:3px}
.chunk,.gap,.gap .f,.gap .r,.gap-input,.gap-in{font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0}   /* a ligature (ti, fi) would show a hidden letter */
.gap .f{font-weight:700;color:var(--answer)}
.gap .r{font-weight:700;background:var(--hl);color:transparent;padding:1px 0;border-radius:2px;transition:color .15s ease}
.gap .r:empty{display:none}
.chunk.open .gap .r{color:var(--hl-ink)}
.gap.o .r{background:#F6B26B;font-weight:400}
.chunk.open .gap.o .r{color:#3B2300}
.box.gloss p{line-height:1.7}
.trap{color:var(--muted);text-decoration:line-through}
.say-row .q .en{font-style:normal;color:var(--ink)}
.gap .r::selection{background:var(--hl)}

/* rewrite */
.orig{margin:0;font-size:var(--step-1)}
.panel.checked .orig{font-style:italic;color:var(--muted)}
.key{margin:0;color:var(--label);font-weight:900;font-size:var(--step-1);letter-spacing:.03em}
.target{margin:0;font-size:var(--step-1)}
.blank{color:var(--muted);letter-spacing:.1em}
.ans{color:var(--answer);font-weight:700}
.note{margin:0;font-size:.95rem}
.gap-input{font:inherit;font-weight:700;color:var(--answer);background:var(--ground);border:0;border-bottom:2px dashed var(--muted);border-radius:4px 4px 0 0;
  padding:2px 6px;width:min(100%,13em);margin-block:2px}
.gap-input::placeholder{color:var(--muted);font-weight:400;font-style:italic}
.gap-input:focus{border-bottom-color:var(--instr)}
.yours{margin:0}
.verdict{display:grid;gap:6px;padding:12px 14px;border-radius:12px}
.verdict.ok{background:var(--ok-bg)}
.verdict.no{background:var(--no-bg)}
.chip{justify-self:start;font-weight:900;padding:2px 12px;border-radius:999px;font-size:.92rem}
.verdict.ok .chip{background:var(--ok-chip);color:var(--ok-ink)}
.verdict.no .chip{background:var(--no-chip);color:var(--no-ink)}
.verdict p{margin:0;font-size:var(--step-1);line-height:1.5}
.good{background:var(--good-hl);color:var(--hl-ink);border-radius:2px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.wrong{text-decoration:line-through;text-decoration-thickness:2px;color:var(--strike)}
.fix{color:var(--answer);font-weight:900;background:var(--fix-bg);border-radius:3px;padding:0 2px}
.legend{font-size:.85rem;color:var(--muted)}
.tick{color:var(--done);font-weight:900}

/* say it */
.say{display:grid;gap:10px}
.say-row{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.say-row:first-child{border-top:0;padding-top:0}
.say-row .q{font-style:italic;color:var(--muted)}
.reveal{display:block;width:100%;text-align:left;font-weight:700;background:var(--hl);color:transparent;border:0;border-radius:3px;padding:6px 8px;cursor:pointer;min-height:2.2em}
.reveal.open{color:var(--hl-ink)}
.reveal:not(.open) *{color:transparent !important}   /* marked answers stay hidden until tapped */
.reveal.open .pp,.reveal.open .g{color:#0000FF}.reveal.open .ps{color:#C00000}   /* on yellow: the slide colours, in dark mode too */
.small{font-size:.9rem;color:var(--muted)}
s{color:var(--muted)}

/* share and ask */
.convo{display:grid;gap:12px}
.turn{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;gap:8px}
.turn.b{grid-template-columns:minmax(0,1fr) auto}
.fig{height:84px;width:auto;filter:var(--fig-filter)}
.bubble{position:relative;border:2px solid var(--bubble-line);border-radius:22px;padding:10px 14px;line-height:1.45}
.turn.a .bubble{background:var(--bubble);color:var(--bubble-ink);border-bottom-left-radius:6px}
.turn.b .bubble{background:var(--card);border-bottom-right-radius:6px}
.situation{margin:0;font-style:italic;color:var(--muted)}
.use{margin:0}
.use b{letter-spacing:.03em}
.hint .s,.mark-s{background:var(--share);color:var(--hl-ink)}
.hint .a,.mark-a{background:var(--hl);color:var(--hl-ink)}

async function post(payload, opts={}){
  if(asStudent()) return {ok:true, id:"preview-" + Date.now(), preview:true};   /* Student view: nothing goes to the table */
  try{
    const r = await fetch(SYNC_URL, {method:"POST", body:JSON.stringify(payload), headers:{"Content-Type":"text/plain;charset=utf-8"}, keepalive:!!opts.keepalive});
    return await r.json();

const asStudent = () => !!(SYNC_URL && ls.get("hw-code") && ls.get("hw-role") === "teacher" && ls.get("hw-as-student"));

  ls.set("hw-as-student", on ? "1" : "");

async function syncNow(code, opts={}){
  code = code || myCode(); if(!SYNC_URL || !code || asStudent()) return null;
  if(syncBusy && !opts.keepalive){ syncAgain = true; return null; }
  syncBusy = true;
  const res = await post({ action:"sync", code, page:PAGE_KEY, date:LESSON.date,
      tasks: TASKS.map(t=>({id:t.id, title:t.title, frames:framesOf(t)})),
      events: Object.entries(marks).map(([task,m])=>({task, done:m.done, ts:m.ts})) }, opts);
  syncBusy = false;
  if(!res.ok && res.error === "other-group" && res.gid){ ls.set("hw-code", code); ls.set("hw-role",""); ls.set("hw-who",""); ls.set("hw-gid", res.gid); toOwnGroup(res.gid); return res; }
  if(res.ok) ls.set("hw-gid", res.role === "teacher" ? "" : (res.gid || ""));
  if(res.ok && res.role === "teacher"){
    if(code === myCode()){ ls.set("hw-role","teacher"); ls.set("hw-who", res.name||""); teacherData = res; if(res.group){ groupStats = res.group; } syncState = "ok";
      if(!current){ const y = scrollY; renderHome(); scrollTo(0,y); } }
    if(syncAgain){ syncAgain = false; syncNow(); }
    return res;
  }
  if(res.ok){
    let changed = false;
    Object.entries(res.tasks||{}).forEach(([id,m])=>{
      const mine = marks[id];
      if(!mine || m.ts >= mine.ts){ if(!mine || mine.done !== m.done) changed = true; marks[id] = {done:!!m.done, ts:m.ts}; }
    });
    saveMarks();
    if(res.work){ work = res.work; saveWork(); refreshWork(); }
    if(code === myCode()) flushFlags();
    if(res.group && code === myCode()){ groupStats = res.group; ls.set("hw-group-"+GROUP_ID, JSON.stringify(res.group)); refreshMeter(); checkMilestone(res.group, GROUP_ID); }
    if(code === myCode()){ ls.set("hw-who", res.name||""); if(!ls.get("hw-name") && res.name) ls.set("hw-name", res.name); }
    if(changed) refreshTicks();
  }
  if(code === myCode()){ syncState = res.ok ? "ok" : (res.error==="unknown-code" ? "unknown" : "offline"); refreshSync(); }
  if(syncAgain){ syncAgain = false; syncNow(); }
  return res;
}

/* ---------- group goal: film-strip meter, confetti, milestones ---------- */
const fmtN = n => Number(n||0).toLocaleString("en-GB");
const capFirst = s => String(s||"").charAt(0).toUpperCase() + String(s||"").slice(1);
function meterHTML(gs){
  if(!gs || !gs.goal) return "";
  const pct = Math.min(1, gs.total/gs.goal), n = 20, filled = Math.min(n, Math.round(pct*n));
  return `<section class="meter" aria-label="Our group's goal">
      <div class="meter-top"><b>🎬 Our group</b><span>${gs.reached ? "Goal reached!" : `${fmtN(gs.total)} / ${fmtN(gs.goal)} 🎞`}</span></div>
      <div class="strip" role="img" aria-label="${Math.round(pct*100)}% of the way">${Array.from({length:n},(_,i)=>`<i class="${i<filled?"on":""}"></i>`).join("")}</div>
      <p class="small">${gs.reached ? `🎉 We did it! ${esc(capFirst(gs.reward))} is coming.` : `Every task adds frames — one per minute of work, Over to you counts double. At ${fmtN(gs.goal)} we'll have ${esc(gs.reward)}.`}${gs.size ? ` <b>${gs.week} of ${gs.size}</b> have added something this week.` : ""}</p>
    </section>`;
}
function confetti(big){
  try{ if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; }catch(e){}
  const c = document.createElement("canvas"); c.className = "confetti"; c.setAttribute("aria-hidden","true"); document.body.appendChild(c);
  const d = window.devicePixelRatio || 1, W = c.width = innerWidth*d, H = c.height = innerHeight*d, x = c.getContext("2d");
  if(!x){ c.remove(); return; }
  const cols = ["#0693E3","#FFFF00","#FF9900","#2E8B3E","#E00000","#8FB0FF"];
  const ps = Array.from({length: big ? 170 : 70}, (_,i)=>({ x: W/2 + (Math.random()-.5)*W*(big?.9:.35), y: H*(big?.4:.22),
    vx: (Math.random()-.5)*W*.012, vy: -(Math.random()*.018+.006)*H, s: (5+Math.random()*7)*d, r: Math.random()*6, vr: (Math.random()-.5)*.35, c: cols[i%cols.length] }));
  const t0 = performance.now(), life = big ? 2800 : 1700;
  (function frame(now){
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy += H*.0007; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1-(now-t0)/life); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(now - t0 < life) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg; document.body.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(), 600); }, 4200);
}
/* 25 / 50 / 75 / 100 %: celebrate once per device when the group passes a mark (a new goal starts a new season) */
function checkMilestone(gs, groupId){
  if(!gs || !gs.goal) return;
  const key = "hw-ms-" + groupId + "-" + gs.goal;
  const pct = gs.total/gs.goal*100, ms = pct>=100 ? 100 : pct>=75 ? 75 : pct>=50 ? 50 : pct>=25 ? 25 : 0;
  const seen = ls.get(key);
  if(seen === ""){ ls.set(key, String(ms)); return; }
  if(ms > Number(seen)){
    ls.set(key, String(ms)); confetti(true);
    toast(ms===100 ? `🎉 We did it! ${capFirst(gs.reward)} is coming!` : `🎬 Our group is ${ms}% of the way to ${gs.reward}!`);
  }
}
/* "?" next to an answer: the student marks what's unclear or hard to hear; it goes to Olya when the task is finished */
let flags = (()=>{ try{ return JSON.parse(localStorage.getItem(PAGE_KEY+"-flags")||"{}")||{}; }catch(e){ return {}; } })();
let lastFlagged = [];
const saveFlags = () => { try{ localStorage.setItem(PAGE_KEY+"-flags", JSON.stringify(flags)); }catch(e){} };

const plainText = s => { const d = document.createElement("div"); d.innerHTML = String(s||""); return d.textContent.replace(/\s+/g," ").trim(); };
function markBtn(key, snippet, link){
  if(!canMark() || !current) return "";
  const on = !!(flags[current.id] && flags[current.id][key]);
  return `<button class="mk ${on?"on":""}" data-mk="${esc(key)}" data-s="${esc(snippet)}" data-l="${esc(link||"")}" aria-pressed="${on}" aria-label="${on?"Marked for Olya — tap to unmark":"Not sure? Mark it for Olya"}">?</button>`;
}

document.addEventListener("click", ev=>{

/* send the marks of finished tasks (also retried after the next sync if there was no connection) */
let flagBusy = false;
async function flushFlags(){
  if(flagBusy || !canMark()) return; flagBusy = true;
  for(const id of Object.keys(flags)){
    const t = TASKS.find(x=>x.id===id); if(!t || !done.has(id)) continue;
    for(const k of Object.keys(flags[id])){
      const f = flags[id][k];
      const res = await post({action:"submit", code:myCode(), page:PAGE_KEY, date:LESSON.date, task:id, title:t.title, type:"marked",
                              text: f.s + (f.note ? "\n— " + f.note : "") + (f.l ? "\n" + f.l : "")});
      if(!res.ok){ flagBusy = false; saveFlags(); return; }
      f.id = res.id; f.sent = true; delete flags[id][k];
      const d = new Date(), p2 = n=>String(n).padStart(2,"0");
      (work[id] = work[id] || []).push({id:res.id, sent:`${p2(d.getDate())}.${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`, type:"marked", text:f.s, feedback:"", seen:false});
    }
    if(!Object.keys(flags[id]).length) delete flags[id];
  }
  saveFlags(); saveWork(); refreshWork(); flagBusy = false;
}

/* ---------- teacher view: Olya's own code shows her group on this page ---------- */

function labelsFor(students){
  const words = n => n.trim().split(/\s+/);
  const lv = [n=>n[0], n=>n.slice(0,2), n=>n[0]+(words(n)[1]||" ")[0], n=>n.slice(0,3), n=>n.slice(0,2)+(words(n)[1]||" ")[0], n=>words(n)[0]];
  return students.map((s,i)=>{
    for(const f of lv){ const c = f(s.name).trim(); if(c && students.every((o,j)=>j===i || f(o.name).trim().toLowerCase() !== c.toLowerCase())) return c; }
    return s.name;
  });
}
function teacherCounts(id){
  const w = (teacherData && teacherData.work || []).filter(x=>x.task===id);
  const r = teacherData && teacherData.reactions && teacherData.reactions[id] || {easy:[],ok:[],hard:[]};
  return { marked: w.filter(x=>x.type==="marked").length, questions: w.filter(x=>x.type==="question").length,
           work: w.filter(x=>x.type==="text"||x.type==="recording").length, open: w.filter(x=>!String(x.feedback||"").trim()).length, hard: r.hard.length };
}

async function copyText(s, btn){

/* ✎ Correction = {…}, 💬 Comment = [[…]]: inside the other kind → switch it; words selected → wrap them; nothing selected → an empty pair at the cursor */
function markSel(ta, kind){
  const [a, b] = kind === "note" ? ["[[", "]]"] : ["{", "}"], other = kind === "note" ? /\{([^{}]*)\}/g : /\[\[([\s\S]*?)\]\]/g;
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  const put = (val, from, to) => { ta.value = val; ta.focus(); ta.setSelectionRange(from, to); ta.dispatchEvent(new Event("input")); };
  let m;
  while((m = other.exec(v))){ const from = m.index, to = from + m[0].length;
    if(s >= from && e <= to) return put(v.slice(0, from) + a + m[1] + b + v.slice(to), from + a.length, from + a.length + m[1].length); }
  if(s === e){ const sp = s > 0 && !/\s/.test(v[s-1]) ? " " : ""; return put(v.slice(0, s) + sp + a + b + v.slice(s), s + sp.length + a.length, s + sp.length + a.length); }
  wrapSel(ta, a, b);
}

/* ---------- gapped dialogue ---------- */
function gapLineHTML(line){
  const parts = line.p; let html = "", i = 0;
  while(i < parts.length){
    const x = parts[i];
    if(typeof x === "object" && "r" in x){
      let chunk = "";
      while(i < parts.length){
        const y = parts[i];
        if(typeof y === "object" && "r" in y){ chunk += `<span class="gap${y.o?" o":""}"><span class="f">${esc(y.f)}</span><span class="r">${esc(y.r)}</span></span>`; i++; }
        else if(typeof y === "string" && /^\s+$/.test(y) && typeof parts[i+1] === "object" && parts[i+1] && "r" in parts[i+1]){ chunk += y; i++; }
        else break;
      }
      html += `<span class="chunk" role="button" tabindex="0" aria-label="Show the missing words">${chunk}</span>`;
    } else if(typeof x === "object" && "b" in x){ html += `<b>${esc(x.b)}</b>`; i++; }
    else { html += esc(x); i++; }

  return `<p>${line.s?`<span class="spk">${esc(line.s)}:</span> `:""}${html}</p>`;

/* ---------- rewrite the sentence ---------- */
/* ---------- marking a typed answer: strike only the error, mark what was good, show the change ---------- */
const splitTok = s => String(s).replace(/[’‘]/g,"'").trim().split(/\s+/).filter(Boolean);
const coreOf = w => { const m = w.match(/^([^A-Za-z0-9']*)(.*?)([^A-Za-z0-9']*)$/); return {lead:m[1], core:m[2], trail:m[3]}; };
function lev(a,b){ const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const q=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=q; } } return d[b.length]; }
const similar = (a,b) => a && b && lev(a,b) <= Math.max(1, Math.floor(Math.max(a.length,b.length)/3));
function alignWords(S,T){            /* S, T: lower-case cores */
  const n=S.length, m=T.length, D=Array.from({length:n+1},(_,i)=>Array(m+1).fill(0));
  for(let i=0;i<=n;i++) D[i][0]=i; for(let j=0;j<=m;j++) D[0][j]=j;
  const sub=(a,b)=> a===b?0 : similar(a,b)?0.6 : 1.4;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) D[i][j]=Math.min(D[i-1][j]+1, D[i][j-1]+1, D[i-1][j-1]+sub(S[i-1],T[j-1]));
  const ops=[]; let i=n, j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+sub(S[i-1],T[j-1])){ ops.push({op:S[i-1]===T[j-1]?"eq":(similar(S[i-1],T[j-1])?"near":"sub"),i:i-1,j:j-1}); i--; j--; }
    else if(i>0&&D[i][j]===D[i-1][j]+1){ ops.push({op:"extra",i:i-1}); i--; }
    else { ops.push({op:"miss",j:j-1}); j--; }
  }
  return {cost:D[n][m], ops:ops.reverse()};
}
function charMarks(a,b){            /* which letters of a and of b are outside their longest common subsequence */
  const A=a.toLowerCase(), B=b.toLowerCase(), L=Array.from({length:A.length+1},()=>Array(B.length+1).fill(0));
  for(let i=A.length-1;i>=0;i--) for(let j=B.length-1;j>=0;j--) L[i][j]= A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const ma=Array(A.length).fill(true), mb=Array(B.length).fill(true); let i=0,j=0;
  while(i<A.length&&j<B.length){ if(A[i]===B[j]){ ma[i]=mb[j]=false; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  return {ma, mb};
}
const runs = (word, marks, cls) => { let h="", cur=null, buf=""; const flush=()=>{ if(buf) h += cur ? `<span class="${cls}">${esc(buf)}</span>` : esc(buf); buf=""; };
  [...word].forEach((ch,k)=>{ if(marks[k]!==cur){ flush(); cur=marks[k]; } buf+=ch; }); flush(); return h; };
function markAnswer(val, targets){
  const S = splitTok(val), Sc = S.map(w=>coreOf(w).core.toLowerCase());
  let best=null;
  targets.forEach(tg=>{ const T=splitTok(tg), Tc=T.map(w=>coreOf(w).core.toLowerCase()); const a=alignWords(Sc,Tc); if(!best||a.cost<best.cost) best={...a,T,Tc,tg}; });
  if(best.cost===0) return {ok:true};
  const eq = best.ops.filter(o=>o.op==="eq"||o.op==="near").length;
  if(eq/Math.max(best.T.length,1) < 0.34) return {ok:false, plain:true, target:best.tg};
  let you=[], fix=[];
  best.ops.forEach(o=>{
    if(o.op==="eq"){ const s=coreOf(S[o.i]); you.push(esc(s.lead)+`<span class="good">${esc(s.core)}</span>`+esc(s.trail)); fix.push(esc(best.T[o.j])); }
    else if(o.op==="near"){ const s=coreOf(S[o.i]), t=coreOf(best.T[o.j]), {ma,mb}=charMarks(s.core,t.core);
      you.push(esc(s.lead)+runs(s.core,ma,"wrong")+esc(s.trail)); fix.push(esc(t.lead)+runs(t.core,mb,"fix")+esc(t.trail)); }
    else if(o.op==="sub"){ you.push(`<span class="wrong">${esc(S[o.i])}</span>`); fix.push(`<span class="fix">${esc(best.T[o.j])}</span>`); }
    else if(o.op==="extra"){ you.push(`<span class="wrong">${esc(S[o.i])}</span>`); }
    else { fix.push(`<span class="fix">${esc(best.T[o.j])}</span>`); }
  });
  return {ok:false, you:you.join(" "), fix:fix.join(" ")};
}
/* if the student also typed words of the sentence around the gap, leave those out of the marking */
function stripFrame(val, r){
  const key = w => coreOf(w).core.toLowerCase().replace(/'/g,"");
  let S = splitTok(val);
  const P = splitTok(r.pre).map(key).filter(Boolean), Q = splitTok(r.post).map(key).filter(Boolean);
  for(let k=Math.min(P.length,S.length-1); k>0; k--){ if(S.slice(0,k).every((w,i)=>key(w)===P[P.length-k+i])){ S=S.slice(k); break; } }
  for(let k=Math.min(Q.length,S.length-1); k>0; k--){ if(S.slice(S.length-k).every((w,i)=>key(w)===Q[i])){ S=S.slice(0,S.length-k); break; } }
  return S.join(" ");
}
function verdictHTML(val, r){
  if(!val) return "";
  const core = stripFrame(val, r);
  const expand = s => " "+String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/won't/g,"will not").replace(/can't/g,"can not").replace(/cannot/g,"can not")
    .replace(/n't/g," not").replace(/'ve/g," have").replace(/'ll/g," will").replace(/'re/g," are").replace(/'m/g," am").replace(/'d/g," would")
    .replace(/[.!?,;:]+/g," ").replace(/\s+/g," ").trim()+" ";
  const sameAs = a => [expand(r.pre+val+r.post), expand(val), expand(r.pre+core+r.post)].includes(expand(r.pre+a+r.post));
  const m = r.acc.some(sameAs) ? {ok:true} : markAnswer(core, r.acc);
  if(m.ok) return `<div class="verdict ok"><span class="chip">✓ Correct!</span><p>${esc(val)}</p></div>`;
  if(m.plain) return `<div class="verdict no"><span class="chip">✗ Not quite</span><p>${esc(core)}</p><span class="small">Compare it with the answer above.</span></div>`;
  return `<div class="verdict no"><span class="chip">✗ Not quite</span>
    <p>${m.you}</p><p>→ ${m.fix}</p>
    <span class="legend">green = good · grey = the part to change · blue = the change. Other answers may also be possible.</span></div>`;
}

/* ---------- listening (clips from TubeQuizard, played from YouTube) ---------- */
let ytPromise = null, ytPlayer = null, ytTimer = null, ytWatch = null, ytReady = false, ytVideo = "";
function loadYT(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(!ytPromise){
    ytPromise = new Promise((res, rej)=>{
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if(typeof prev === "function") prev(); res(); };
      const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.async = true;
      s.onerror = () => rej(new Error("blocked")); document.head.appendChild(s);
      setTimeout(()=>{ if(!(window.YT && window.YT.Player)) rej(new Error("timeout")); }, 7000);
    });
  }
  return ytPromise;
}
/* the videos come from YouTube: nothing is loaded from there until the student agrees (remembered on this device) */
const ytConsentHTML = () => `<div class="yt-consent" id="yt-consent"><div>
    <p>The clips play from <b>YouTube</b>. When you load them, YouTube (Google) gets your IP address and may store cookies.${ON_SITE ? ` <a href="../datenschutz.html#youtube">More</a>` : ""}</p>
    <button class="btn primary" id="yt-ok">Load the videos</button>
    <p class="small">Just once on this device.</p></div></div>`;
function stopPlayer(){

}

function pausePlayer(){ clearInterval(ytTimer); clearTimeout(ytWatch); try{ ytPlayer && ytPlayer.pauseVideo(); }catch(e){} }
const playerOnScreen = () => !!(ytPlayer && app.querySelector(".video iframe"));
function clipEnd(lines, i){ return (i+1 < lines.length ? lines[i+1][1] : lines[i][1] + lines[i][2]) + 0.15; }
function partsHTML(parts){
  return parts.map(p => typeof p === "string" ? esc(p) : `<span class="gapbox ${checked?"open":""}">${esc(p.gap)}</span>`).join("");
}
function renderListen(st, count, pct){

        : (k => `<input class="gap-in" data-k="${k}" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"
             aria-label="Type the missing words" style="width:min(100%, ${p.gap.length + 3}ch)" value="${esc(typed[keyOf(k)]||"")}">`)(gk++)).join("")}${i===0?` <span class="whole-note">· whole clip</span>`:""}</span>

  const rest = `

        if(m.ok){ res.className = "gap-res ok"; res.textContent = ans + " ✓"; }
        else {
          res.className = "gap-res ans"; res.textContent = ans;
          const fb = document.createElement("div"); fb.className = "gap-fb";
          fb.innerHTML = m.plain ? `<span class="chip-x">✗</span> You: ${esc(val)}` : `<span class="chip-x">✗</span> ${m.you} → ${m.fix}`;
          inp.closest(".ln").appendChild(fb);
        }
      }
      inp.replaceWith(res);
    });
    if(canMark()){
      app.querySelectorAll(".ln").forEach((row,i)=>{
        const l = lines[i], txt = l[3].map(p=>typeof p==="string"?p:p.gap).join("");
        row.insertAdjacentHTML("beforeend", markBtn(stepIdx+"-"+i, txt, `https://youtu.be/${l[0]}?t=${Math.max(0, Math.floor(l[1]) - 1)}`)); row.classList.add("has-mk");
      });
      const hint = markHint(); if(hint) document.getElementById("after").insertAdjacentHTML("beforebegin", hint.replace("Not sure about something?","Hard to hear?"));
    }
    document.getElementById("after").hidden = false;
    const last = stepIdx === current.steps.length-1;
    document.getElementById("go").textContent = last ? "Finish" : "Next";
  });
}

/* ---------- over to you: your task → plan (pick phrases) → record and send ---------- */
const LESSON_TAG = LESSON.date.slice(0,5);
let recState = {rec:null, stream:null, chunks:[], tick:null, t0:0, file:null, url:null};
function stopRecorder(){
  clearInterval(recState.tick);
  try{ if(recState.rec && recState.rec.state !== "inactive"){ recState.rec.onstop = null; recState.rec.stop(); } }catch(e){}
  if(recState.stream) recState.stream.getTracks().forEach(tr=>tr.stop());
  recState.rec = null; recState.stream = null;
}
/* ls is defined near the top (progress) */
const fileBase = name => `${(name||"student").trim().replace(/[^\p{L}\p{N}]+/gu,"-")}_${LESSON_TAG.replace(".","-")}_conversation`;
const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
async function toWav(blob){
  const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC();
  const audio = await ctx.decodeAudioData(await blob.arrayBuffer()); try{ ctx.close(); }catch(e){}
  const rate = 16000, off = new OfflineAudioContext(1, Math.ceil(audio.duration*rate), rate);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const out = new DataView(new ArrayBuffer(44 + pcm.length*2));
  const w = (o,s)=>[...s].forEach((c,i)=>out.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF"); out.setUint32(4,36+pcm.length*2,true); w(8,"WAVE"); w(12,"fmt "); out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,1,true);
  out.setUint32(24,rate,true); out.setUint32(28,rate*2,true); out.setUint16(32,2,true); out.setUint16(34,16,true); w(36,"data"); out.setUint32(40,pcm.length*2,true);
  pcm.forEach((v,i)=>{ const x=Math.max(-1,Math.min(1,v)); out.setInt16(44+i*2, x<0?x*0x8000:x*0x7FFF, true); });
  return new Blob([out], {type:"audio/wav"});
}
const draftKey = () => "hw-draft-"+PAGE_KEY;
const picksKey = () => "hw-picks-"+PAGE_KEY;
const usedKey = () => "hw-used-"+PAGE_KEY;
const getList = k => { try{ return JSON.parse(ls.get(k) || "[]"); }catch(e){ return []; } };
function plainNext(){ checked = true; return navButtons(); }   /* nothing to check on these screens: the button is Next / Finish */
const taskPeek = () => `<details class="task-peek"><summary><b>Your task</b> <span class="small">tap to see</span></summary><div class="task-card">${TASK_HTML}</div></details>`;
const modelHTML = () => !MODEL.length ? "" : `<details class="model-peek"><summary><b>${typeof MODEL_TITLE!=="undefined"?MODEL_TITLE:"The conversation from class"}</b></summary>
  ${READ_INTRO?`<p class="situation">${READ_INTRO}</p>`:""}<div class="model">${MODEL.map(([sp,line])=>`<p><span class="spk">${sp}:</span> ${line}</p>`).join("")}</div></details>`;

/* 1. the task, short enough to keep in your head */
function renderTaskCard(st, count, pct){
  shell({count, pct, instr:"Here's your task. Keep it in mind.",
    stageHTML:`<div class="panel task-card">${TASK_HTML}</div>`, actionsHTML: plainNext()});
  wireNav(()=>{});
}

/* 2. plan: tap the phrases you'll use */
function renderPlan(st, count, pct){
  const picks = new Set(getList(picksKey()));
  const list = MAP.map((g,gi)=>`<h4 class="pick-h">${g.h}</h4>${g.items.map((it,ii)=>{ const [en,r,mean] = it, id = gi+"-"+ii;
      return `<button class="pick ${picks.has(id)?"on":""}" data-id="${id}" aria-pressed="${picks.has(id)}"><span class="tick" aria-hidden="true"></span>
        <span class="p-txt"><span class="p-en">${en}</span>${mean?` <span class="mean">— ${mean}</span>`:""}${ru(r)}</span></button>`; }).join("")}`).join("");
  shell({count, pct, instr:PLAN_INSTR,
    stageHTML:`<div class="panel">
        ${taskPeek()}
        <div class="pick-count small" id="pc" aria-live="polite"></div>
        <div class="picks">${list}</div>
        ${TENSES?`<p class="small tenses"><b>Tenses:</b> ${TENSES}</p>`:""}
        ${modelHTML()}
      </div>`,
    actionsHTML: plainNext()});
  const pc = document.getElementById("pc");
  const upd = () => { const n = picks.size; pc.textContent = n ? `Picked: ${n}${n>=(typeof PICK_MIN!=="undefined"?PICK_MIN:3)?" ✓":""}` : "Nothing picked yet"; };
  upd();
  app.querySelectorAll(".pick").forEach(b=>b.addEventListener("click",()=>{
    const id = b.dataset.id; if(picks.has(id)) picks.delete(id); else picks.add(id);
    b.classList.toggle("on", picks.has(id)); b.setAttribute("aria-pressed", picks.has(id));
    ls.set(picksKey(), JSON.stringify([...picks])); upd();
  }));
  wireNav(()=>{});
}

/* 3. record it (or write it), tick the phrases you used, send it */
function renderProduce(st, count, pct){
  const mode = ls.get("hw-mode") || "write";
  const picks = getList(picksKey()), used = new Set(getList(usedKey()));
  const picked = picks.map(id=>{ const [gi,ii] = id.split("-").map(Number); const it = MAP[gi] && MAP[gi].items[ii]; return it ? {id, en:it[0]} : null; }).filter(Boolean);
  shell({count, pct, instr:PRODUCE_INSTR,
    stageHTML:`<div class="panel">
        ${taskPeek()}
        <div class="seg" role="tablist">
          <button class="seg-btn ${mode==="write"?"on":""}" data-mode="write" role="tab" aria-selected="${mode==="write"}">Write it</button>
          <button class="seg-btn ${mode==="record"?"on":""}" data-mode="record" role="tab" aria-selected="${mode==="record"}">Record it</button>
        </div>
        <div id="m-record" ${mode==="record"?"":"hidden"} class="mode">
          <div class="rec-row" id="rec-row">
            <button class="rec-btn" id="rec"><span class="dot" aria-hidden="true"></span><span id="rec-label">Start recording</span></button>
            <span class="count" id="rec-time" aria-live="polite"></span>
          </div>
          <div id="rec-review" hidden class="mode">
            <audio id="rec-audio" controls preload="metadata"></audio>
            <div class="row-btns"><button class="btn" id="rec-again">Record again</button></div>
            ${PRODUCE_NOTE}
          </div>
          <p class="small" id="rec-msg" hidden></p>
        </div>
        <div id="m-write" ${mode==="write"?"":"hidden"} class="mode">
          <textarea id="txt" rows="7" placeholder="${typeof PRODUCE_PH!=="undefined"?PRODUCE_PH:"A: …&#10;B: …"}&#10;(Tap the microphone on your keyboard to dictate.)">${esc(ls.get(draftKey()))}</textarea>
        </div>
        <fieldset class="check">
          <legend>Your phrases</legend>
          ${picked.length ? `<span class="small">Did you use them? Tick the ones you did.</span>
            ${picked.map(p=>`<label><input type="checkbox" data-u="${p.id}" ${used.has(p.id)?"checked":""}><span>${p.en}</span></label>`).join("")}`
            : `<span class="small">You didn't pick any phrases. Tap Back to choose some — or just go ahead.</span>`}
        </fieldset>
        <label class="field"><span class="small">Your name</span><input id="who" type="text" autocomplete="given-name" placeholder="Your name" value="${esc(ls.get("hw-name"))}"></label>
        <div class="row-btns">
          <button class="btn" id="copy" ${mode==="write"?"":"hidden"}>Copy</button>
          <button class="btn primary grow" id="send">Send to Olya</button>
        </div>
        <p class="small" id="msg" hidden></p>
      </div>`,
    actionsHTML: plainNext()});
  const $ = id => document.getElementById(id), who = $("who");
  const say = (id, html) => { const el=$(id); el.hidden=false; el.innerHTML=html; };
  let curMode = mode;
  app.querySelectorAll(".seg-btn").forEach(b=>b.addEventListener("click",()=>{
    curMode = b.dataset.mode; ls.set("hw-mode", curMode);
    app.querySelectorAll(".seg-btn").forEach(x=>{ x.classList.toggle("on", x===b); x.setAttribute("aria-selected", x===b); });
    $("m-record").hidden = curMode!=="record"; $("m-write").hidden = curMode!=="write"; $("copy").hidden = curMode!=="write";
  }));
  who.addEventListener("input",()=>ls.set("hw-name", who.value.trim()));
  app.querySelectorAll(".check input").forEach(cb=>cb.addEventListener("change",()=>{
    ls.set(usedKey(), JSON.stringify([...app.querySelectorAll(".check input")].filter(x=>x.checked).map(x=>x.dataset.u)));
  }));
  const txt = $("txt"); txt.addEventListener("input",()=>ls.set(draftKey(), txt.value));

  /* recording */
  const recBtn = $("rec"), label = $("rec-label"), time = $("rec-time");
  const showReview = () => { $("rec-review").hidden = false; $("rec-row").hidden = true; $("rec-audio").src = recState.url; };
  if(recState.url) showReview();
  recBtn.addEventListener("click", async ()=>{
    if(recState.rec){ recState.rec.stop(); return; }
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)){
      say("rec-msg","Recording doesn't work in this browser. Open the page in Chrome or Safari on your phone."); return; }
    try{ recState.stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ say("rec-msg","The microphone isn't available here. On your phone, allow the microphone when the browser asks."); return; }
    const mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(m=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
    const rec = new MediaRecorder(recState.stream, mime?{mimeType:mime}:undefined);
    recState.rec = rec; recState.chunks = [];
    rec.ondataavailable = ev => { if(ev.data && ev.data.size) recState.chunks.push(ev.data); };
    rec.onstop = async () => {
      clearInterval(recState.tick); recState.stream.getTracks().forEach(tr=>tr.stop());
      const type = rec.mimeType || (recState.chunks[0] && recState.chunks[0].type) || "audio/webm";
      const blob = new Blob(recState.chunks, {type});
      recState.rec = null; recState.stream = null;
      recBtn.classList.remove("on"); label.textContent = "Processing…"; recBtn.disabled = true;
      let file;
      if(/mp4|aac|m4a/.test(type)) file = new File([blob], "recording.m4a", {type:"audio/mp4"});
      else { try{ file = new File([await toWav(blob)], "recording.wav", {type:"audio/wav"}); }catch(e){ file = new File([blob], "recording.webm", {type:"audio/webm"}); } }
      if(recState.url) URL.revokeObjectURL(recState.url);
      recState.file = file; recState.url = URL.createObjectURL(file);
      recBtn.disabled = false; label.textContent = "Start recording"; time.textContent = "";
      showReview();
    };
    rec.start(); recState.t0 = Date.now();
    recBtn.classList.add("on"); label.textContent = "Stop"; $("rec-msg").hidden = true;
    recState.tick = setInterval(()=>{ const s=(Date.now()-recState.t0)/1000; time.textContent = mmss(s); if(s>=300) rec.stop(); }, 250);
  });
  $("rec-again").addEventListener("click",()=>{ $("rec-review").hidden = true; $("rec-row").hidden = false; recBtn.click(); });

  /* sending */
  const synced = () => !!myCode() && syncState!=="unknown" && !isTeacher();
  const usedPhrases = () => [...app.querySelectorAll(".check input")].filter(x=>x.checked).map(x=>{ const l=x.closest("label"); return l ? l.textContent.trim() : ""; }).filter(Boolean);
  const sentMsg = "Sent ✓ Olya's feedback will appear on the homework page — look for 💬. Now tap Finish.";
  async function toTable(type, text){
    const res = await post({action:"submit", code:myCode(), page:PAGE_KEY, date:LESSON.date, task:current.id, title:current.title, type, text, phrases:usedPhrases()});
    if(res.ok){
      const list = work[current.id] = work[current.id] || [];
      const d = new Date(), p2 = n=>String(n).padStart(2,"0");
      const item = {id:res.id, sent:`${p2(d.getDate())}.${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`, type:type==="recording"?"recording":"text", text, feedback:"", seen:false};
      const i = list.findIndex(w=>String(w.id)===String(res.id));
      if(i>-1) list[i] = item; else list.push(item);
      saveWork();
    }
    return res;
  }
  const tag = () => `Over to you · ${LESSON_TAG}${who.value.trim()?" · "+who.value.trim():""}`;
  const done = "If you sent it to Olya, mark the task in our spreadsheet in your colour.";
  $("copy").addEventListener("click", async ()=>{
    const text = txt.value.trim(); if(!text){ say("msg","Write or dictate it first."); return; }
    try{ await navigator.clipboard.writeText(tag()+"\n\n"+text); say("msg","Copied. Paste it into your chat with Olya or into our spreadsheet."); }
    catch(e){ txt.select(); say("msg","Copying didn't work here. Select the text and copy it."); }
  });
  $("send").addEventListener("click", async ()=>{
    if(curMode==="write"){
      const text = txt.value.trim(); if(!text){ say("msg","Write or dictate it first."); return; }
      if(synced()){
        const b = $("send"); b.disabled = true; say("msg","Sending…");
        const res = await toTable("text", text); b.disabled = false;
        say("msg", res.ok ? sentMsg : "It didn't go through — no connection right now. Your text is saved here, so try again in a minute.");
        return;
      }
      if(navigator.share){ try{ await navigator.share({title:tag(), text:tag()+"\n\n"+text}); say("msg",done); return; }catch(e){ if(e && e.name==="AbortError") return; } }
      $("copy").click(); return;
    }
    const f = recState.file; if(!f){ say("msg","Record it first."); return; }
    const named = new File([f], fileBase(who.value)+f.name.slice(f.name.lastIndexOf(".")), {type:f.type});
    if(navigator.canShare && navigator.canShare({files:[named]})){
      try{ await navigator.share({files:[named], title:tag(), text:tag()});
        if(synced()){ const res = await toTable("recording", ""); say("msg", res.ok ? sentMsg : done); } else say("msg",done);
        return; }
      catch(e){ if(e && e.name==="AbortError") return; }
    }
    say("msg", `This browser can't send the file directly. <a href="${recState.url}" download="${esc(named.name)}" id="save-rec">Save the recording</a>, then send it to Olya in Telegram.`);
    const sv = $("save-rec"); if(sv && synced()) sv.addEventListener("click",()=>{ toTable("recording",""); });
  });
  wireNav(()=>{});
}

function toOwnGroup(gid){
  if(!gid || gid === GROUP_ID || isTeacher()) return false;
  document.body.innerHTML = ""; location.replace("../" + gid + "/index.html"); return true;
}

if(!(myCode() && toOwnGroup(ls.get("hw-gid")))){
  if(start && TASKS.some(t=>t.id===start)) openTask(start); else renderHome();
  if(myCode()) syncNow();
}
