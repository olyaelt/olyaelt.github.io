<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The curriculum meeting · Part 3</title>
<link rel="stylesheet" href="../../fonts/homework-sans.css">
<style>
/* tools 10: the situation is a chip on the title line, so it costs no height while closed; opened, it drops below the title as a card */
.sit-fold{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:2px 12px}
.sit-fold summary{cursor:pointer;font-weight:900;font-size:.92rem;color:var(--muted);list-style:none;white-space:nowrap}
.sit-fold summary::-webkit-details-marker{display:none}
.sit-fold summary::after{content:" ▸"}
.sit-fold[open]{flex-basis:100%;order:9;border:0;border-left:6px solid var(--date-bg);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow)}
.sit-fold[open] summary{color:var(--ink)}
.sit-fold[open] summary::after{content:" ▾"}
.sit-fold p{margin:6px 0 2px;font-size:1.05rem}
/* Lesson tools (pages students open in a breakout room and share on Zoom, ~1280×720).
   Same colours and font as the homework pages; bigger type; task on the left, Useful language on the right. */
:root{
  --ground:#F6F1DC; --card:#FFFFFF; --ink:#1D1D1B; --muted:#6B6B6B; --line:#D9D2B8;
  --instr:#0693E3; --instr-ink:#FFFFFF; --label:#E00000; --ipa:#0E8A7E;
  --hl:#FFFF00; --hl-ink:#1D1D1B; --bubble:#FFFF8C; --bubble-ink:#1D1D1B;
  --date-bg:#FF9900; --date-ink:#1D1D1B;
  --ok:#2E8B3E; --ok-bg:#EAF7EC; --ok-chip:#CDEFD3; --ok-ink:#1E6B2E;
  --no:#C0392B; --no-bg:#FDECEB; --no-chip:#F9D2CF; --no-ink:#A1261B;
  --used:#BFF2B8; --used-ink:#1D1D1B;
  --a:#0693E3; --a-ink:#FFFFFF; --b:#FF9900; --b-ink:#1D1D1B;
  --again:#E67E00; --on-ok:#FFFFFF; --on-no:#FFFFFF; --flip-ink:#0679BD; --tick:#B9B092; --instr-text:#0693E3;
  --shadow:0 2px 0 rgba(29,29,27,.08), 0 10px 28px rgba(29,29,27,.08);
  --font-body:"Homework Sans","Calibri","Carlito","Segoe UI",system-ui,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121416; --card:#1C1F23; --ink:#ECECEA; --muted:#A4A7AB; --line:#33373D;
    --instr:#1578C0; --label:#FF7A7A; --ipa:#4CC5B3; --hl:#FFF34D; --hl-ink:#111111;
    --bubble:#3B391F; --bubble-ink:#F3F0D0;
    --ok:#62C774; --ok-bg:#18301E; --ok-chip:#24502E; --ok-ink:#9BE3A8;
    --no:#FF8A80; --no-bg:#3A1E1C; --no-chip:#5A2622; --no-ink:#FFB4AB;
    --used:#2F5E35; --used-ink:#F1FFF0; --a:#1578C0; --again:#FFB14A; --on-ok:#0F2412; --on-no:#2A0D0A; --flip-ink:#6CC3FF; --tick:#70757C; --instr-text:#6CC3FF;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121416; --card:#1C1F23; --ink:#ECECEA; --muted:#A4A7AB; --line:#33373D;
  --instr:#1578C0; --label:#FF7A7A; --ipa:#4CC5B3; --hl:#FFF34D; --hl-ink:#111111;
  --bubble:#3B391F; --bubble-ink:#F3F0D0;
  --ok:#62C774; --ok-bg:#18301E; --ok-chip:#24502E; --ok-ink:#9BE3A8;
  --no:#FF8A80; --no-bg:#3A1E1C; --no-chip:#5A2622; --no-ink:#FFB4AB;
  --used:#2F5E35; --used-ink:#F1FFF0; --a:#1578C0; --again:#FFB14A; --on-ok:#0F2412; --on-no:#2A0D0A; --flip-ink:#6CC3FF; --tick:#70757C; --instr-text:#6CC3FF;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* the page grows with the screen, like a slide (her slides keep everything at 15 pt or more), and with its height: a laptop screen minus the browser bar is wider than 16:9, so the size is the smaller of the two (the Useful language box should fit without scrolling) */
html{font-size:clamp(15px, min(1.4vw, 2.55vh), 28px)}
html,body{background:var(--ground);margin:0}
body{color:var(--ink);font-family:var(--font-body);line-height:1.45;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--instr);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:72rem;margin:0 auto;padding:12px 0 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,30rem);gap:16px 1.4rem;align-items:start}
.main{display:grid;gap:12px;min-width:0}
/* the box stays in view while the task scrolls; a box taller than the screen scrolls with the page (no hidden inner scroll) */
.side{position:sticky;top:10px;display:grid;gap:10px;padding:0 4px 4px 12px;margin-left:-12px}
@media (max-width:860px){ .wrap{grid-template-columns:1fr} .side{position:static} }

/* header */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.part{font-weight:900;letter-spacing:.04em;font-size:.85rem;background:var(--date-bg);color:var(--date-ink);padding:3px 10px;border-radius:6px}
.head h1{font-size:1.85rem;line-height:1.1;font-weight:900}
.gear{margin-left:auto;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-weight:700;font-size:1rem;color:var(--muted);min-height:38px}
.instr{background:var(--instr);color:var(--instr-ink);border-radius:12px;padding:8px 14px;font-weight:700;font-size:1rem;margin:0}
.hint-top{background:var(--card);border-left:6px solid var(--instr);border-radius:12px;padding:8px 14px;font-weight:700;font-size:1.15rem;margin:0;box-shadow:var(--shadow)}
.situation{background:var(--card);border-left:6px solid var(--date-bg);border-radius:12px;padding:12px 16px;font-size:1.1rem;margin:0;box-shadow:var(--shadow)}
.settings{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.95rem}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--instr);color:var(--instr-ink)}

/* buttons */
.btn{border:2px solid var(--instr);background:transparent;color:var(--instr-text);border-radius:12px;padding:10px 20px;font-weight:900;font-size:1.05rem;min-height:48px}
.btn.primary{background:var(--instr);color:var(--instr-ink)}
.btn.big{font-size:1.4rem;padding:16px 30px;border-radius:16px}
.btn:disabled{opacity:.35}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok.on,.btn.ok.solid{background:var(--ok);color:var(--on-ok)}
.btn.no{border-color:var(--no);color:var(--no)}
.btn.no.on{background:var(--no);color:var(--on-no)}
.btn.again{border-color:var(--again);color:var(--again)}
.linkish{border:0;background:none;color:var(--instr-text);font-weight:700;text-decoration:underline;padding:4px}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Useful language box (as on her slides and the homework pages) */
.box{background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:8px 12px 10px;position:relative;display:grid;gap:1px;margin-top:2rem}
.box .sticker{width:8.5rem;height:auto;margin:-1.8rem 0 -4px -8px}
.box-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.box-top .linkish{font-size:.9rem;margin-top:-6px}
.box h4{margin:6px 0 1px;color:var(--label);font-size:.92rem;letter-spacing:.07em;font-weight:900;text-transform:uppercase}
.box h4:first-of-type{margin-top:2px}
.ph{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:1px 8px 1px 1.5rem;margin:0 0 0 -8px;line-height:1.2;font-size:1.12rem;position:relative}
.ph::before{content:"";position:absolute;left:8px;top:.5em;width:.5em;height:.5em;border-radius:50%;border:2px solid var(--line)}
button.ph:hover{background:color-mix(in srgb, var(--used) 35%, transparent)}
.ph.used{background:var(--used);color:var(--used-ink)}
.ph .gloss{color:var(--muted);font-style:italic;font-size:.86em}
.ph .bx{font-weight:900}
.ph.used::before{content:"✓";border:0;width:auto;height:auto;top:.18em;left:7px;font-weight:900;color:var(--ok)}
.box.static .ph{cursor:default}
.box.static .ph::before{display:none}
.box.static .ph{padding-left:8px}
.peek{display:grid;gap:8px;justify-items:start;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.peek p{margin:0;color:var(--muted)}
.extra{margin:0;font-weight:700;background:var(--bubble);color:var(--bubble-ink);border-radius:10px;padding:8px 12px}

/* If you're done: the speaking tasks */
.speak{background:var(--bubble);color:var(--bubble-ink);border-radius:18px;padding:18px 22px;display:grid;gap:12px;box-shadow:var(--shadow)}
.speak.pop{animation:popsoft .35s ease-out}
.speak-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.speak-h{font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;font-weight:900;color:var(--label)}
.speak-dots{display:flex;gap:0;margin:-6px -5px}
.speak-dots button{border:0;background:none;padding:6px 5px;line-height:0}
.speak-dots button::before{content:"";display:block;width:.6rem;height:.6rem;border-radius:50%;background:color-mix(in srgb, var(--bubble-ink) 22%, transparent);transition:transform .15s}
.speak-dots button.was::before{background:color-mix(in srgb, var(--bubble-ink) 50%, transparent)}
.speak-dots button.on::before{background:var(--instr);transform:scale(1.25)}   /* "you are here" is blue on every page (tools 6) */
.speak-dots button:hover::before{transform:scale(1.35)}
.speak-task{margin:0;font-size:1.45rem;font-weight:700;line-height:1.35}
.speak-task .bx,.follow-q .bx{color:var(--flip-ink);font-weight:900}
/* the stages */
.stages{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-left:auto}
.stage-btn{border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:4px 14px;font-weight:900;font-size:1.02rem}
.stage-btn:hover{border-color:var(--instr);color:var(--instr-text)}
.stage-btn[aria-current="step"]{background:var(--instr);border-color:var(--instr);color:var(--instr-ink)}
.stage-arrow{color:var(--muted);font-weight:900}
@media (max-width:560px){ .stages{margin-left:0} }
/* 📋 all of it, folded */
details.all{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px 16px}
.side details.all{background:transparent;border:2px dashed var(--line);font-size:.92rem;padding:2px 14px}
.side details.all[open]{background:var(--card)}
details.all summary{cursor:pointer;font-weight:900;padding:8px 0;color:var(--muted);list-style:none}
details.all summary::-webkit-details-marker{display:none}
details.all summary::after{content:" ▸";}
details.all[open] summary::after{content:" ▾";}
details.all[open] summary{color:var(--ink)}
.all-in{display:grid;gap:10px;padding:2px 0 14px}
.all-row{display:grid;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.all-row .f{color:var(--ink)} .all-row .f .ctx{color:var(--muted)}
.all-row .b{color:var(--flip-ink);font-weight:900}
.all-h{color:var(--label);font-size:.88rem;letter-spacing:.07em;text-transform:uppercase;font-weight:900;margin-top:6px}
.all-sub{font-weight:900}
.all-row p{margin:0}
.all-row .bx{color:var(--flip-ink)}
.all-side{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;font-weight:900;color:var(--muted)}
/* tactile feedback */
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes popsoft{0%{transform:scale(1)}35%{transform:scale(1.035)}100%{transform:scale(1)}}
.pop{animation:pop .38s cubic-bezier(.3,1.4,.5,1)}
.ph.pop{animation:popsoft .32s ease-out}
.legal{max-width:72rem;margin:0 auto;padding:6px 0 18px;font-size:.8rem;color:var(--muted)}
.legal a{color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
.btn.slim{min-height:38px;padding:4px 14px;font-size:.95rem;border-radius:10px}
/* live version (tools 7): Olya's edit buttons and bar — only on her screen */
.live-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--card);border:2px dashed var(--instr);border-radius:12px;padding:6px 12px;margin-bottom:10px;font-size:.95rem}
.live-bar #live-status{color:var(--muted)}
.live-removed{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.live-chip,.live-reset{border:2px solid var(--line);background:var(--ground);color:var(--ink);border-radius:99px;padding:1px 10px;font-weight:700;font-size:.9rem}
.live-reset{margin-left:auto;border-color:var(--no);color:var(--no)}
.live-host{display:flex;align-items:flex-start;gap:8px}
.live-host > :first-child{flex:1}
.live-tools{display:inline-flex;gap:4px;flex:none}
.live-b{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:1px 6px;font-size:1rem;line-height:1.4}
.live-b:hover{border-color:var(--instr)}
.speak-dots.draggable button{cursor:grab;touch-action:none}
.speak-dots.draggable button::before{width:.85rem;height:.85rem}
.speak-dots button.dragging{cursor:grabbing;z-index:2;position:relative}
.speak-dots button.dragging::before{transform:scale(1.5);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.speak-dots button.drop-here::before{outline:3px solid var(--instr);outline-offset:2px}
.live-host.is-hidden{flex-direction:column-reverse;gap:4px}   /* hidden, not deleted: greyed, with "Hidden from the groups · ✏️ · Show" on its own line above */
.live-host.is-hidden > :first-child{opacity:.45}
.live-host.is-hidden .live-tools{align-self:flex-start}
.all-row.is-hidden > span:first-child{opacity:.45}
.live-hidden-tag{align-self:center;font-size:.8rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.live-b.live-show{border-color:var(--instr);background:var(--instr);color:var(--instr-ink);font-weight:900;padding:1px 10px}
.live-b[data-live-hide]{font-weight:700;font-size:.9rem;padding:1px 8px}
.speak-dots button.hid::before{background:transparent !important;box-shadow:inset 0 0 0 2px var(--muted)}
.live-edit{display:grid;gap:8px;background:var(--card);border:2px solid var(--instr);border-radius:12px;padding:10px 12px}
.live-edit label{display:grid;gap:2px;font-size:.85rem;font-weight:700;color:var(--muted)}
.live-edit textarea{font:inherit;font-size:1.05rem;font-weight:400;color:var(--ink);background:var(--ground);border:2px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;resize:vertical}

/* ---------- the school council: draw a subject, roll for reasons, decide ---------- */
.stage-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.subj-count{flex:none;border:2px solid var(--line);border-radius:99px;padding:2px 12px;font-weight:700;font-size:.95rem;color:var(--ink)}
.head-btns{margin-left:auto;display:flex;gap:8px;align-items:center}
.stage-wrap.enter{animation:enterR .45s cubic-bezier(.2,.8,.2,1)}
.head-btns .gear{margin-left:0}
/* tools 6: the dice range sits at the end of the hint text, not on a line of its own, so the whole subject fits on a 720 px Zoom screen */
.dice-hint{display:block;line-height:1.3}
/* the stage buttons a touch smaller here, so they fit on the title line (three long labels) */
.head .stage-btn{font-size:.92rem;padding:3px 11px}
.head .stage-arrow{margin:0 -1px}
.dice-hint .seg{display:inline-flex;vertical-align:middle;margin-left:10px}
.dice-hint .seg{font-size:.85rem;font-weight:700;flex:none}
.dice-hint .seg button{padding:2px 10px}
@media (max-width:560px){ .head-btns{margin-left:0;flex-wrap:wrap} .stage{padding:14px} .stage-top{flex-wrap:wrap}
  .st{grid-template-columns:1.8rem minmax(0,1fr) auto;gap:8px;padding:7px 9px} .st .choice{grid-column:2 / 4} .st.st-dec{grid-template-columns:1.8rem minmax(0,1fr)} .subj{font-size:1.8rem} }
.stage{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 20px;display:grid;gap:10px;align-content:start;min-height:300px}
.stage.empty{place-content:center;justify-items:center;text-align:center;gap:14px}
.stage.empty p{margin:0;color:var(--muted);font-size:1.05rem}
.stage.enter{animation:enterR .55s cubic-bezier(.2,.8,.2,1)}
@keyframes enterR{from{opacity:0;transform:translateX(70px) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.subj-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.subj-top .subj-label{flex-basis:100%}
.subj-label{color:var(--label);font-weight:900;letter-spacing:.07em;text-transform:uppercase;font-size:.9rem}
.subj{font-size:2.2rem;font-weight:900;line-height:1.08}
.subj-meta{color:var(--muted);font-size:1.05rem}
.subj-meta .ipa{color:var(--ipa);white-space:nowrap}
.subj-meta .ru{font-style:italic}
.steps{display:grid;gap:8px}
.st{display:grid;grid-template-columns:2.1rem minmax(0,1fr) auto;align-items:center;gap:12px;padding:7px 12px;border-radius:12px;background:var(--ground);transition:opacity .25s;min-height:3.9rem}
.st .n{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--card);border:2px solid var(--line)}
.st.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.st.gave .n{background:var(--bubble);border-color:var(--again);font-size:1.05rem}
.st.off{opacity:.42}
.st-t{font-weight:900;font-size:1.15rem}
.st-sub{color:var(--muted);font-size:.92rem}
.dots{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px}
/* one grey tick per reason: tap it when the reason has been given, it fills green */
.dot{width:1.75rem;height:1.75rem;border-radius:50%;border:2px solid var(--tick);background:var(--card);color:var(--tick);padding:0;
  font-weight:900;font-size:1rem;line-height:1;display:grid;place-items:center;transition:background .15s, transform .15s, color .15s}
.dot:hover{border-color:var(--ok);color:var(--ok)}
.dot{position:relative;overflow:hidden}
.dot::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok);transform:scale(0)}
.dot > span{position:relative;z-index:1}
.dot.on{border-color:var(--ok);color:var(--on-ok);transform:scale(1.08)}
.dot.on::before{transform:scale(1)}
.dot.fill{animation:tickpop .45s cubic-bezier(.3,1.5,.5,1)}
.dot.fill::before{animation:tickfill .3s ease-out}
@keyframes tickfill{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes tickpop{0%{transform:scale(1)}45%{transform:scale(1.45)}100%{transform:scale(1.08)}}
.dot.monkey{border-color:transparent;background:transparent;font-size:1.25rem;cursor:default}
.dot.monkey::before{display:none}
.giveup{border:2px dashed var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:1px 12px;font-weight:700;font-size:.92rem;margin-left:4px}
.giveup:hover{border-color:var(--again);color:var(--again)}
.gave-tag{font-weight:700;font-size:.92rem;color:var(--again);margin-left:4px}
.exbtn.sm{padding:2px 12px;font-size:.9rem;margin-left:4px}
.ex-step{position:relative;background:var(--bubble);color:var(--bubble-ink);border-radius:12px;padding:8px 16px 10px 58px;margin:-4px 0 2px}
/* tools 10: no label row (the 💡 says it), so a whole subject fits on a 720 px screen */
.ex-step .ex-ic{position:absolute;left:21px;top:7px;font-size:1.2rem;line-height:1.35}
.ex-step .ex-hide{float:right;margin:0 0 0 14px;line-height:1.35}
.ex-step .live-host + .live-host{margin-top:5px}
.ex-step.opening{animation:enter .35s ease-out}
.ex-step p{margin:0;line-height:1.35}
.ex-step .bx{color:var(--flip-ink)}
.btn.meh{border-color:var(--muted);color:var(--muted)}
.btn.meh.on{background:var(--date-bg);border-color:var(--date-bg);color:var(--date-ink)}   /* tools 6: grey looked switched off */
.chip.meh{background:color-mix(in srgb, var(--date-bg) 35%, var(--card));color:var(--ink)}
.die{width:3.3rem;height:3.3rem;border-radius:11px;background:#FFFFFF;border:3px solid #1D1D1B;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:.45rem;box-shadow:0 4px 0 #1D1D1B}
.die i{width:.62rem;height:.62rem;border-radius:50%;background:#1D1D1B;place-self:center;visibility:hidden}
.die i.p{visibility:visible}
.die-wrap{display:flex;align-items:center;gap:10px}
.die-n{font-weight:900;font-size:1.05rem;color:var(--muted);min-width:5.5em}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice .btn{min-height:44px;padding:6px 16px}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* tools 10: the decision row: "Together: …?" above, the three choices and Next subject on one line under it */
.st.st-dec{grid-template-columns:2.1rem minmax(0,1fr);row-gap:6px}
.st.st-dec .n{align-self:start}
.st.st-dec .choice{grid-column:2 / -1}
.choice .next-btn{margin-left:auto}
.exbtn{border:2px solid var(--bubble-line, #E6D96A);background:var(--bubble);color:var(--bubble-ink);border-radius:99px;padding:6px 16px;font-weight:900;font-size:1rem}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;background:var(--bubble);color:var(--bubble-ink);border-radius:14px;padding:12px 16px;animation:enter .3s ease-out}
@media (max-width:640px){ .ex{grid-template-columns:1fr} }
.ex-col{display:grid;gap:6px;align-content:start}
.ex-h{font-size:.88rem;letter-spacing:.07em;text-transform:uppercase;font-weight:900;color:var(--label)}
.ex p{margin:0;line-height:1.35}
.ex .bx{color:var(--flip-ink)}
.sofar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.sofar b{margin-right:4px}
.chip{border-radius:99px;padding:2px 12px;font-weight:700;font-size:.95rem}
.chip-in{animation:chipin .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes chipin{from{opacity:0;transform:translateY(-14px) scale(.6)}to{opacity:1;transform:none}}
.dot.appear,.giveup.appear{animation:appear .38s both cubic-bezier(.3,1.6,.5,1)}
@keyframes appear{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.die{will-change:transform}
.chip.yes{background:var(--ok-chip);color:var(--ok-ink)} .chip.nope{background:var(--no-chip);color:var(--no-ink)}
.foot-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel{background:var(--bubble);color:var(--bubble-ink);border-radius:14px;padding:14px 18px;font-size:1.15rem}
.panel b{display:block;font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
/* decide */
.decide-top{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.decide h2{font-size:1.6rem;font-weight:900}
.decide .lead{margin:0;font-size:1.05rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){ .cols{grid-template-columns:1fr} }
.col{display:grid;gap:5px;align-content:start}
.col-h{display:flex;justify-content:space-between;align-items:baseline}
.col-h .cnt{color:var(--muted);font-weight:700}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:4px 12px;font-size:1rem;font-weight:700}
.pick .was{font-weight:600;font-size:.92rem;color:color-mix(in srgb, var(--ink) 70%, transparent);white-space:nowrap}
.pick.on.cut{border-color:var(--no);background:var(--no-bg)}
.pick.on.add{border-color:var(--ok);background:var(--ok-bg)}
.pick .mark{font-weight:900}
.frame{background:var(--bubble);color:var(--bubble-ink);border-radius:14px;padding:14px 18px;font-size:1.3rem;font-weight:700;line-height:1.4}
.follow{background:var(--card);border:2px solid var(--bubble);border-left:8px solid var(--date-bg);border-radius:14px;padding:12px 18px;display:grid;gap:8px}
.follow-in{animation:enterR .45s cubic-bezier(.2,.8,.2,1)}
.follow-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.follow-h{font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;font-weight:900;color:var(--label)}
.follow-q{margin:0;font-size:1.25rem;font-weight:700;line-height:1.35}
.follow .speak-dots button::before{background:var(--line)} .follow .speak-dots button.was::before{background:var(--muted)} .follow .speak-dots button.on::before{background:var(--instr)}
.frame small{display:block;font-size:.88rem;letter-spacing:.07em;text-transform:uppercase;font-weight:900;margin-bottom:4px}
</style>
</head>

const D = {"type": "dice-council", "title": "The curriculum meeting", "part": "Part 3", "situation": "An international school is changing its curriculum. Next year it wants to add two new subjects, so two things have to go. Parents, teachers and students are meeting tonight to decide.", "lists": [{"kind": "add", "label": "Could be added", "items": [{"t": "managing money", "ex": {"for": ["**Nobody ever taught us how to** make a budget, and my first credit card was a disaster.", "It's **more important than you'd think** — one bad loan can leave you in debt for years."], "against": ["**You pick it up along the way**, like everyone does.", "**What's the point of** a school subject? Every family handles money differently."]}}, {"t": "first aid", "ex": {"for": ["**You never know when it might come in handy** — it can save a life.", "**Nobody ever taught us how to** help someone who's choking."], "against": ["**School only gets you so far** — if you don't practise it, you forget it within a year.", "**My kids' school is very hands-on** — they already have a first-aid day every year."]}}, {"t": "cooking", "ex": {"for": ["**Nobody ever taught us how to** cook, so I lived on pasta for a year.", "**My kids' school is very hands-on** — they cook every Friday, and they love it."], "against": ["**You pick it up along the way** — from your parents or from YouTube.", "**Back in my day**, we had cooking classes, but we spent most of the lesson waiting for the oven — **a complete waste of time**."]}}, {"t": "doing your taxes", "ex": {"for": ["**Nobody ever taught us how to** do our taxes, and my first tax return took a whole weekend.", "It's **more complicated than you'd think**, so everyone needs at least the basics."], "against": ["**What's the point of** teaching it at fifteen? The rules change every year.", "When we moved abroad, **I had to start from scratch** — the tax system was completely different."]}}, {"t": "public speaking", "ex": {"for": ["Explaining an idea so that people get it — **that's where I really add value** at work.", "**Nobody ever taught us how to** speak in front of people, and I was terrified for years."], "against": ["**What's the point of** making every shy kid give speeches?", "**School only gets you so far** — confidence comes from doing it for real, not from one lesson a week."]}}, {"t": "using AI well (and checking it)", "ex": {"for": ["**They're handing** more and more work **over to AI**, so someone has to check it.", "**I taught myself, the hard way** — kids shouldn't have to."], "against": ["The tools change every month, so what they learn will be **out of date** by the time they leave school.", "Kids **pick it up** on their own — and very fast."]}}, {"t": "how to learn", "ex": {"for": ["Everything goes **out of date**, so **you need to adapt** — and that means knowing how to learn.", "When I changed careers, **I had to start from scratch**, and nobody had ever shown me how to learn."], "against": ["**I picked it up on the job** — you learn how to learn by doing it, not in a lesson.", "**School only gets you so far** — everyone learns differently, so you have to find your own way."]}}, {"t": "dealing with difficult people", "ex": {"for": ["My first year as a manager **was a steep learning curve** — nobody had taught me any of it.", "**I picked it up on the job, the hard way**, and I'd love my kids to have it easier."], "against": ["**School only gets you so far** — you learn it from real people, not from role-plays.", "It's **more complicated than you'd think** — every difficult person is different, so a school course can't really prepare you."]}}]}, {"kind": "cut", "label": "Could be cut", "items": [{"t": "Latin", "ex": {"for": ["It's **more useful than you'd think**: loads of medical and legal words come from Latin.", "**It was hard, but it paid off** — Spanish and Italian were much easier for me later."], "against": ["**What's the point of** Latin? Nobody speaks it.", "I did five years of it, and **I've never used it since**."]}}, {"t": "memorising dates in history", "ex": {"for": ["It's **more useful than you'd think**: key dates help you put events in order and see how they're connected.", "**You never know when it might come in handy** — like when your kids need help with their homework."], "against": ["We learned hundreds of dates **by heart**, but never talked about why they mattered — **a complete waste of time**.", "**What's the point of** memorising dates? You can look them up."]}}, {"t": "trigonometry", "ex": {"for": ["**You never know when it might come in handy** — you might end up as an engineer or a game designer.", "**It was hard, but it paid off** when I studied engineering."], "against": ["**I've never used it since** — not once.", "**It was out of touch with real life** — we never knew what it was for."]}}, {"t": "the periodic table", "ex": {"for": ["It's **more useful than you'd think** — it helps explain why things burn, rust or explode.", "**You never know when it might come in handy** — you might end up working in a lab."], "against": ["We learned the whole table **by heart**, and **I've never used it since**.", "The way we learned it **was out of touch with real life** — just symbols and numbers."]}}, {"t": "foreign languages", "ex": {"for": ["**You never know when it might come in handy** — I never thought I'd live abroad.", "Translation apps **only get you so far** — try making friends through one."], "against": ["AI translates everything now — **what's the point of** six years of French?", "I did French at school, but when I moved to France, **I had to start from scratch**."]}}, {"t": "reading the classics", "ex": {"for": ["**It was hard, but it paid off** — I read much faster now, and I can concentrate for hours.", "It's **more useful than you'd think** — you learn a lot about people and why they do what they do."], "against": ["**What's the point of** reading 800 pages at fourteen? You don't understand it at that age.", "**It was a complete waste of time** — we all just read the summaries anyway."]}}, {"t": "PE", "ex": {"for": ["Kids sit in front of screens all day — it's **more important than you'd think**.", "**You never know when it might come in handy** — I learned to swim at school."], "against": ["I was always picked last. **It was a complete waste of time**, and I hated every minute.", "Two hours a week **only gets you so far** — you won't get fit on that alone."]}}, {"t": "music and art", "ex": {"for": ["AI can make a picture in seconds, so creativity is **where we really add value** now — and that's what art teaches.", "**It was hard, but it paid off** — I still play the piano."], "against": ["**What's the point of** drawing lessons if you have no talent?", "**It's out of date** — kids make videos and designs on their computers, and at school they're still drawing vases of flowers."]}}]}], "box": [{"h": "BACK THEN", "items": ["**Back in my day**, … My kids' school is very **hands-on**.", "It was **out of touch with real life**. We learned it **by heart**.", "**Nobody ever taught us how to** …"]}, {"h": "USEFUL OR NOT?", "items": ["It was **a complete waste of time**. I've **never used it since**.", "You **never know when it might come in handy**.", "It's **more … than you'd think**. **What's the point of** …?", "It was hard, but it **paid off**.", "It's **out of date**. You need to **adapt**.", "They're **handing** it **over to AI**.", "That's where I really **add value**."]}, {"h": "LEARNING", "items": ["It was a **steep learning curve**. I **taught myself**.", "I **picked it up on the job**, **the hard way**.", "You **pick it up along the way**.", "I had to **start from scratch**. School **only gets you so far**."]}, {"h": "MAKING ROOM", "items": ["The curriculum is already **packed**.", "How are we going to **fit it all in**?", "**Something has to go**.", "What do we cut to **make room for it**?"]}], "report": "We've decided to add … and …, and cut … and … to make room. We'd rather keep … because …", "decideLead": "Agree on two to add first. Then the hard part: cut two to make room. Tap them.", "followUp": ["The principal says no to one of your four changes. Which one, do you think? What two arguments could change her mind? A phrase from the box for each.", "A parent says: \"We learned Latin and it never did us any harm.\" What two things would you say back?", "A student says: \"Why read Tolstoy when you can just read the summary online?\" What two things would you say back?", "Now the school wants to add one more subject from the list. Which one? What would you cut to make room for it, and who'd be most upset?"], "speaking": ["Think back to your own school: each of you, two subjects you would have cut and one you would have added. Anything in common?", "A 20-year-old relative asks: \"What should I study, now that AI can do half the jobs out there?\" What three pieces of advice would you give, with a phrase from the box for each?", "Cooking · public speaking · managing money · Latin · foreign languages: which two would you keep for a 16-year-old, and which one would you drop? Why?"], "hint": "The dice tells you how many reasons to give, for and against — a phrase from the box for each, changed to fit. Add two subjects first. Then the hard part: cut two to make room.", "_pids": {"lists.0.items": [0, 1, 2, 3, 4, 5, 6, 7], "lists.1.items": [0, 1, 2, 3, 4, 5, 6, 7], "followUp": [0, 1, 2, 3], "speaking": [0, 1, 2]}};

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k) || "null"); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

/* a small burst of confetti from an element (the end of a deck): brand colours, falls and fades in about a second; none with reduced motion */
function confetti(from){
  if(calm() || !from) return;
  const r = from.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const css = getComputedStyle(document.documentElement), col = ["--instr", "--date-bg", "--hl", "--ok", "--label"].map(v => css.getPropertyValue(v).trim() || "#0693E3");
  for(let i = 0; i < 46; i++){
    const p = document.createElement("i"), a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 170, w = 6 + Math.random() * 6;
    p.className = "confetti"; p.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:${w}px;height:${w * .45}px;background:${col[i % col.length]};border-radius:2px;pointer-events:none;z-index:50`;
    document.body.appendChild(p);
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d * .6 - 60, spin = (Math.random() - .5) * 720;
    p.animate([{transform: "translate(-50%, -50%) rotate(0)", opacity: 1},
               {transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${spin / 2}deg)`, opacity: 1, offset: .45},
               {transform: `translate(calc(-50% + ${dx * 1.15}px), calc(-50% + ${dy + 160}px)) rotate(${spin}deg)`, opacity: 0}],
              {duration: 1100 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.4,1)"}).onfinish = () => p.remove();
  }
}

/* where a group is in a run of tasks (speaking tasks, follow-ups). It counts which tasks they have SEEN, not positions, so that
   when Olya moves or removes tasks during the lesson (live version) no group skips anything (her catch, 28.10: on slides she could
   say "go back to slide 74"; here nobody could). Next = the next unseen task after this one in the current order, then any unseen
   one they jumped over; Previous = back the way they came; the end buttons come only when everything has been seen. */
const newCursor = () => ({key: null, seen: new Set(), hist: [], move: 0, go: null});
function cursorPick(cur, list){
  const has = k => list.some(x => x.k === k), unseen = x => !cur.seen.has(x.k) && x.k !== cur.key && !x.hidden;
  let key = cur.key;
  if(cur.go != null && has(cur.go)){ if(has(key)) cur.hist.push(key); key = cur.go; }
  else if(cur.move > 0){ const at = list.findIndex(x => x.k === key), nx = list.slice(at + 1).find(unseen) || list.find(unseen);
    if(nx){ if(has(key)) cur.hist.push(key); key = nx.k; } }
  else if(cur.move < 0){ while(cur.hist.length){ const pk = cur.hist.pop(); if(has(pk)){ key = pk; break; } } }
  if(key == null || !has(key)){ const nx = list.find(x => !cur.seen.has(x.k)) || list[0]; key = nx.k; }
  cur.key = key; cur.move = 0; cur.go = null; cur.seen.add(key);
  return {i: list.findIndex(x => x.k === key), more: list.some(x => !cur.seen.has(x.k) && !x.hidden), back: cur.hist.some(has)};
}

/* ---------- live version (tools 7, her wish 28.10): Olya removes, moves or corrects items during a lesson ----------
   Only on the "-live" pages (LIVE_ON). The page as built is the default; her changes come from her table
   (sheet "Live", one row per page) when the page opens and every 30 s, and are applied at the group's next tap,
   so nothing changes under their eyes. If the table doesn't answer, the page simply shows what it was built with.
   Her own code on this site (typed on any homework page) turns on the edit buttons: ✏️ correct, ⤓ to the end, Hide / Show.
   Hide, not delete (her wish, 28.10): a hidden item stays on HER screen, greyed, so she can correct it and show it again. */
let LV = {hide: [], last: [], text: {}, order: {}}, livePending = null, liveRerender = () => {}, liveBusy = false, liveMsg = "";
const liveCacheKey = "tool-live-" + PAGE_ID;
const liveSame = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const liveNorm = v => ({hide: (v && v.hide) || [], last: (v && v.last) || [], text: (v && v.text) || {}, order: (v && v.order) || {}});
if(LIVE_ON){ const c = store.get(liveCacheKey); if(c) LV = liveNorm(c); }
/* permanent numbers (tools 13, her decision 30.10): her table keeps live changes by an item's permanent number (D._pids, from the build's
   register), not by its place in the data, so a rebuild that inserts or moves items never moves her ✏️ / Hide / order onto another item.
   The page works with places; these turn a path into its stored form and back ("cards.4.1" ↔ "cards.<number>.1"). No numbers → the same. */
const PIDS = (typeof D !== "undefined" && D && D._pids) || {};
const PID_KEYS = Object.keys(PIDS).sort((a, b) => b.length - a.length);
const pidOf = (base, k) => PIDS[base] && PIDS[base][k] != null ? PIDS[base][k] : k;
const idxOf = (base, pid) => PIDS[base] ? PIDS[base].indexOf(+pid) : +pid;
function pathMap(path, fn){
  path = String(path); const key = PID_KEYS.find(k => path.startsWith(k + "."));
  if(!key) return path;
  const rest = path.slice(key.length + 1), seg = rest.split(".")[0]; if(!/^\d+$/.test(seg)) return path;
  const n = fn(key, +seg); return n == null || n < 0 ? null : key + "." + n + rest.slice(seg.length);
}
const toStore = path => pathMap(path, pidOf);
const fromStore = path => pathMap(path, idxOf);
const liveTeacher = () => { if(!LIVE_ON) return false; try{ return localStorage.getItem("hw-role") === "teacher" && !!localStorage.getItem("hw-code"); }catch(e){ return false; } };
const pathGet = (o, path) => String(path).split(".").reduce((x, k) => x == null ? x : x[k], o);
const liveText = (path, dflt) => { const p = toStore(path); return Object.prototype.hasOwnProperty.call(LV.text, p) ? LV.text[p] : dflt; };
const liveHidden = path => LV.hide.includes(toStore(path));
/* a list as the groups see it now: in the order she dragged it into, removed ones out, corrected texts in
   (an item she brought back after ordering goes to the end) */
function liveList(arr, base){
  const mine = liveTeacher();   /* her screen keeps the hidden ones (greyed), the groups' screens leave them out */
  let items = (arr || []).map((t, k) => ({k, t: typeof t === "string" ? liveText(base + "." + k, t) : t, hidden: liveHidden(base + "." + k)})).filter(x => mine || !x.hidden);
  const ord = Array.isArray(LV.order[base]) ? LV.order[base].map(p => idxOf(base, p)).filter(k => k > -1) : null;   /* stored by permanent number */
  if(ord) items = ord.map(k => items.find(x => x.k === k)).filter(Boolean).concat(items.filter(x => !ord.includes(x.k)));
  const lastKs = LV.last.filter(p => p.startsWith(base + ".") && /^\d+$/.test(p.slice(base.length + 1))).map(p => idxOf(base, +p.slice(base.length + 1))).filter(k => k > -1);
  return items.filter(x => !lastKs.includes(x.k)).concat(lastKs.map(k => items.find(x => x.k === k)).filter(Boolean));
}
/* "⤓ to the end" and dragging a dot both send the whole new order of that list */
const liveViews = {};
function liveMoveTo(base, key, to){
  const keys = (liveViews[base] || []).map(x => x.k), from = keys.indexOf(key); if(from < 0) return;
  keys.splice(from, 1); keys.splice(Math.max(0, Math.min(to, keys.length)), 0, key);
  return liveOp("order", base, JSON.stringify(keys.map(k => pidOf(base, k))));
}
async function livePost(body){
  try{ const r = await fetch(LIVE_URL, {method: "POST", body: JSON.stringify(body), headers: {"Content-Type": "text/plain;charset=utf-8"}}); return await r.json(); }
  catch(e){ return {ok: false, error: "offline"}; }
}
/* new changes wait for the group's next tap (render calls liveApply first); hers apply at once */
function liveApply(){ if(!livePending) return false; LV = livePending; livePending = null; if(typeof liveAdjust === "function") liveAdjust(); return true; }
async function liveFetch(first){
  if(!LIVE_ON || !LIVE_URL) return;
  const res = await livePost({action: "live", tool: PAGE_ID});
  if(!res.ok || !res.live) return;
  const v = liveNorm(res.live); store.set(liveCacheKey, v);
  if(liveSame(v, LV)) { livePending = null; return; }
  livePending = v; if(first || liveTeacher()){ liveApply(); if(first && typeof liveFresh === "function") liveFresh(); liveRerender(); }
}
if(LIVE_ON){ setTimeout(() => liveFetch(true), 50); setInterval(() => liveFetch(false), 30000); }
async function liveOp(kind, path, text){
  if(liveBusy) return; liveBusy = true; liveMsg = "saving…"; liveStatus();
  const res = await livePost({action: "liveOp", code: localStorage.getItem("hw-code") || "", tool: PAGE_ID, op: {kind, path: kind === "order" || kind === "reset" ? path : toStore(path), text}});
  liveBusy = false;
  /* on her own screen, removing or moving the task she's looking at shows what takes its place */
  /* hiding the task she's on: she stays on it (greyed) to correct it and show it again */
  if(res.ok && res.live){ LV = liveNorm(res.live); livePending = null; store.set(liveCacheKey, LV); if(typeof liveAdjust === "function") liveAdjust(); liveMsg = "saved ✓ — the groups get it when they move on"; liveRerender(); }
  else { liveMsg = res.error === "offline" ? "not saved: no connection" : res.error === "unknown-code" ? "not saved: your code isn't in the table" : "not saved: " + (res.error || "error"); liveStatus(); }
}
const liveStatus = () => { const s = document.getElementById("live-status"); if(s) s.textContent = liveMsg; };
/* her buttons next to an item; "fields" = several texts edited together (a card: sentence, answer, key word) */
/* dragging a dot (her screen only): the task moves to where the dot is dropped; a plain tap still opens the task */
function wireDrag(root){
  if(!liveTeacher()) return;
  root.querySelectorAll(".speak-dots[data-drag]").forEach(row => {
    const base = row.dataset.drag, dots = [...row.querySelectorAll("button[data-k]")];
    dots.forEach(dot => dot.addEventListener("pointerdown", e => {
      if(e.button !== 0) return;
      const x0 = e.clientX, key = +dot.dataset.k, centers = dots.map(d => { const r = d.getBoundingClientRect(); return r.left + r.width / 2; });
      let moved = false, to = dots.indexOf(dot);
      const move = ev => { const dx = ev.clientX - x0; if(!moved && Math.abs(dx) < 5) return; moved = true;
        dot.classList.add("dragging"); dot.style.transform = `translateX(${dx}px)`;
        to = centers.reduce((best, c, j) => Math.abs(ev.clientX - c) < Math.abs(ev.clientX - centers[best]) ? j : best, 0);
        dots.forEach((d, j) => d.classList.toggle("drop-here", j === to && d !== dot)); };
      const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up);
        if(!moved) return;
        dot.addEventListener("click", ev => { ev.stopImmediatePropagation(); ev.preventDefault(); }, {capture: true, once: true});
        liveMoveTo(base, key, to); };
      addEventListener("pointermove", move); addEventListener("pointerup", up);
    }));
  });
}
const liveTools = (path, {last = false, edit = true, fields = ""} = {}) => !(liveTeacher() && path) ? "" : liveHidden(path)
  ? `<span class="live-tools"><span class="live-hidden-tag">Hidden from the groups</span>${edit ? `<button class="live-b" data-live-edit="${fields || path}" title="Correct the text" aria-label="Correct the text">✏️</button>` : ""}<button class="live-b live-show" data-live-unhide="${path}" title="Show it to the groups again">Show</button></span>`

    ${removed ? `<span class="live-removed">Hidden: ${removed}</span>` : ""}${n ? `<button class="live-chip" data-live-copy title="For the lesson debrief: what you changed live, to put into the slides and the page">📋 My changes</button><button class="live-reset" data-live-reset>Reset all</button>` : ""}</div>`;

/* 📋 My changes (her wish 30.10 07:36): after the lesson, the debrief puts them into her slides and the page; plain words, the item's own text */
let liveLabelOf = p => p;
function liveChangesText(){
  const lab = p => { const t = String(liveLabelOf(p) || p).replace(/\*\*|\(\(|\)\)/g, ""); return t.length > 90 ? t.slice(0, 90) + "…" : t; }, out = [];

/* ---------- state ---------- */
const DIE_OPTIONS = [3, 4, 6];
let faces = DIE_OPTIONS.includes(+params.get("dice")) ? +params.get("dice") : 6;
const LISTS = Object.fromEntries(D.lists.map(l => [l.kind, l]));
const ORDER = D.lists.map(l => l.kind);            /* cut, add, cut, add… */
/* tools 10 (council-3, her decision 28.10: add two first, then the hard part, cut two to make room): the Decide columns
   follow the order of the lists in the data, and the line above them can come from the data (decideLead) */
const KINDS = [...new Set(ORDER)];
/* a subject as the groups see it now: her corrected title and example lines (live version); D itself never changes */
const LIDX = Object.fromEntries(D.lists.map((l, L) => [l.kind, L]));
const itemPath = (kind, i) => `lists.${LIDX[kind]}.items.${i}`;
const exLive = (p, arr) => (arr || []).map((s, j) => ({p: `${p}.${j}`, t: liveText(`${p}.${j}`, s)})).filter(x => liveTeacher() || !liveHidden(x.p));   /* her screen keeps hidden lines, greyed */
const itemOf = (kind, i) => { const it = LISTS[kind].items[i], p = itemPath(kind, i);
  return {...it, t: liveText(p + ".t", it.t), exl: it.ex ? {for: exLive(p + ".ex.for", it.ex.for), against: exLive(p + ".ex.against", it.ex.against)} : null}; };
const itemGone = (kind, i) => liveHidden(itemPath(kind, i));
const TOTAL = () => D.lists.reduce((a, l) => a + l.items.filter((_, i) => !itemGone(l.kind, i)).length, 0);
/* her changes arrive: removed subjects leave the pile (the one on the table stays until Next) */
function liveAdjust(){ ORDER.forEach(k => { S.pools[k] = S.pools[k].filter(i => !itemGone(k, i)); }); }
let S;
function newGame(){
  S = { draws: 0, pools: Object.fromEntries(D.lists.map(l => [l.kind, shuffle(l.items.map((_, i) => i))])),
        cur: null, done: [], view: "game", picks: {cut: new Set(), add: new Set()}, peek: false, fu: 0, fuShown: false };
  draw();     /* the first subject is on the table straight away (her wish: no "Draw" button) */
}
newGame();
const WORDS = {
  /* no "it" / "that" in the labels (her point, 27.10): students lift wording from the screen, and the right pronoun depends on the subject */
  cut: {keep: "Reasons to keep", drop: "Reasons to cut", q: "Keep or cut?", yes: "Keep", no: "Cut", yesTag: "keep", noTag: "cut"},
  add: {keep: "Reasons to add", drop: "Reasons not to add", q: "Add or not?", yes: "Add", no: "Don't add", yesTag: "add", noTag: "don't add"}
};
/* the first answer from her table, before anyone has played: start again without what she removed */
const liveFresh = () => { if(S && !S.done.length && S.view === "game" && S.cur && S.cur.r[0].n === null && itemGone(S.cur.kind, S.cur.i)) newGame(); };
const liveCursorHook = p => { if(S && S.fuCur && p === "followUp." + S.fuCur.key) S.fuCur.move = 1; };
const liveLabel = p => { const v = pathGet(D, p); return typeof v === "string" ? v : v && v.t ? v.t : p; };
/* a row is done when every reason is ticked or they gave up; the next row (and the decision) waits for it (her rule, 27.10) */
const rowDone = r => r.n !== null && (r.got >= r.n || !!r.gaveUp);

function draw(sameKind){
  let kind = sameKind || ORDER[S.draws % ORDER.length];
  liveAdjust();
  if(!S.pools[kind].length) kind = ORDER.find(k => S.pools[k].length);
  if(!kind){ S.cur = null; return; }
  const i = S.pools[kind].shift();
  S.cur = {kind, i, r: [{n: null, got: 0}, {n: null, got: 0}], dec: null, exOpen: [false, false]};
  if(!sameKind) S.draws++;
}
function swap(){
  if(!S.cur || S.cur.r[0].n !== null) return;
  const {kind, i} = S.cur, pool = S.pools[kind];
  if(!pool.length) return;
  pool.splice(1 + Math.floor(Math.random() * pool.length), 0, i);
  draw(kind); render(true);
}
function next(){
  if(!S.cur || S.cur.dec === null || S.busy) return;
  const go = () => { S.busy = false; S.done.push(S.cur); S.popChip = true; draw(); render(true); S.popChip = false; };
  const stage = document.querySelector(".stage");
  if(!stage || calm()){ go(); return; }
  S.busy = true;   /* the subject slides away, the next one comes in */
  stage.animate([{transform: "none", opacity: 1}, {transform: "translateX(-70px) rotate(-2deg)", opacity: 0}], {duration: 420, easing: "cubic-bezier(.5,0,.75,0)"}).onfinish = go;
}

/* ---------- the die ---------- */
const PIPS = {1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9]};
const dieHTML = n => `<span class="die" aria-label="${n}">${Array.from({length: 9}, (_, k) => `<i class="${PIPS[n].includes(k + 1) ? "p" : ""}"></i>`).join("")}</span>`;
/* the example opens by itself every time a row is finished (all ticked or "We give up"), even if it was opened and hidden before:
   that is the moment to look at it (her wish, 27.10). Already open → it stays as it is, no re-animation */
/* only one example is open at a time (tools 6): with both open, the decision row and Next went below a 720 px Zoom screen */
function openEx(k){ const c = S.cur; if(!c || !exOf(k) || c.exOpen[k]) return; c.exOpen = c.exOpen.map(() => false); c.exOpen[k] = true; S.exAnim = k; }
const setFace = (die, n) => die.querySelectorAll("i").forEach((p, j) => p.classList.toggle("p", PIPS[n].includes(j + 1)));
/* the roll: the die tumbles and slows down smoothly, as in the first version she liked (two whole turns, faces changing more and more slowly);
   for the last, slowest part it already shows the result and keeps it, and it simply stops, upright — no bounce, no change at the end
   (her husband's point and hers, 27.10: the slowing down is the nicest part, a real die just stops). Then the ticks appear one by one */
function roll(k){
  const r = S.cur.r[k]; if(r.n !== null || S.busy) return;
  const final = 1 + Math.floor(Math.random() * faces), any = () => 1 + Math.floor(Math.random() * faces);
  const slot = document.querySelector(`[data-die-slot="${k}"]`);
  if(!slot || calm()){ r.n = final; S.justRolled = k; render(); S.justRolled = null; return; }
  S.busy = true;
  slot.closest(".st").querySelectorAll("button").forEach(b => b.disabled = true);
  const first = any(); slot.innerHTML = dieHTML(first);
  const die = slot.firstElementChild, gaps = [50, 55, 60, 70, 80, 95, 115, 140, 175, 220, 280];
  const total = gaps.reduce((a, b) => a + b, 0);
  /* -720deg = two whole turns: it ends exactly as it started, dark edge at the bottom, so nothing jumps when the page redraws it */
  die.animate([
    {transform: "translate(0, 0) rotate(0deg)"},
    {transform: "translate(-8px, -22px) rotate(-240deg)", offset: .22},
    {transform: "translate(4px, 0) rotate(-470deg)", offset: .5},
    {transform: "translate(-2px, -8px) rotate(-610deg)", offset: .74},
    {transform: "translate(0, 0) rotate(-700deg)", offset: .9},
    {transform: "translate(0, 0) rotate(-720deg)"}], {duration: total, easing: "cubic-bezier(.12,.75,.3,1)"});
  /* the faces change more and more slowly while it turns; the 7th change (about half a second in, with a last ~40° still to turn)
     is the result, and it keeps it while it slows down to a stop. Before, the faces kept flickering after the die had all but
     stopped, and the result popped up at the very end with a bounce */
  const LAND = 6;
  let t = 0, prev = first;
  gaps.forEach((g, i) => { t += g; if(i > LAND) return;
    setTimeout(() => { let f = final; if(i < LAND){ do f = any(); while(faces > 1 && (f === prev || (i === LAND - 1 && f === final))); } prev = f; setFace(die, f); }, t); });
  setTimeout(() => { S.busy = false; r.n = final; S.justRolled = k; render(); S.justRolled = null; }, total + 150);
}

/* ---------- views ---------- */
const metaHTML = it => [it.ipa ? `<span class="ipa">${esc(it.ipa)}</span>` : "", it.note ? esc(it.note) : "", it.ru ? `<span class="ru">${esc(it.ru)}</span>` : ""].filter(Boolean).join(" · ");
function stepHTML(k){
  const c = S.cur, w = WORDS[c.kind], r = c.r[k];
  const off = k === 1 && r.n === null && !rowDone(c.r[0]), full = r.n !== null && r.got >= r.n, done = full || r.gaveUp;
  const fresh = S.justRolled === k, delay = j => fresh ? ` style="animation-delay:${j * 90}ms"` : "";
  const gave = r.gaveUp && !full, monkeys = S.justGave === k;
  const dots = r.n === null ? "" : `<div class="dots">${Array.from({length: r.n}, (_, j) => j >= r.got && gave
        ? `<span class="dot monkey ${monkeys ? "appear" : ""}"${monkeys ? ` style="animation-delay:${(j - r.got) * 110}ms"` : ""} aria-label="gave up">🙈</span>`
        : `<button class="dot ${j < r.got ? "on" : ""} ${fresh ? "appear" : ""} ${S.popTick === k + "." + j ? "fill" : ""}"${delay(j)} data-dot="${k}.${j}" aria-label="reason ${j + 1}" aria-pressed="${j < r.got}"><span>✓</span></button>`).join("")}
      ${full ? "" : gave ? `<button class="linkish" data-giveup="${k}">undo</button>` : `<button class="giveup ${fresh ? "appear" : ""}"${delay(r.n)} data-giveup="${k}">🙈 We give up</button>`}
      ${exOf(k) && !c.exOpen[k] ? `<button class="exbtn sm" data-ex="${k}">💡 Example</button>` : ""}</div>`;
  return `<div class="st ${off ? "off" : ""} ${done ? "done" : ""} ${gave ? "gave" : ""}">
    <span class="n">${gave ? "🙈" : done ? "✓" : k + 1}</span>
    <div><div class="st-t">${k === 0 ? w.keep : w.drop}${r.n !== null ? `: ${r.n}` : ""}</div>
      ${r.n === null ? "" : dots}</div>
    <div class="die-wrap" data-die-slot="${k}">${r.n === null ? `<button class="btn primary" data-roll="${k}" ${off ? "disabled" : ""}>🎲 Roll</button>` : dieHTML(r.n)}</div>
  </div>`;
}
function gameHTML(anim){
  const c = S.cur;
  if(!c) return `<section class="stage empty ${anim ? "enter" : ""}"><p>That's all the subjects.</p>
      <button class="btn primary big" data-decide>Time to decide →</button></section>${sofarHTML()}`;
  const it = itemOf(c.kind, c.i), w = WORDS[c.kind], ready = rowDone(c.r[1]) || c.dec !== null;
  return `<section class="stage ${anim ? "enter" : ""}">
      <div class="stage-top"><div class="subj-top"><span class="subj-label">${esc(LISTS[c.kind].label)}</span>
        <div class="live-host ${liveDim(itemPath(c.kind, c.i))}" data-live-host><h2 class="subj">${esc(it.t)}</h2>${liveTools(itemPath(c.kind, c.i), {fields: itemPath(c.kind, c.i) + ".t"})}</div>${metaHTML(it) ? `<div class="subj-meta">${metaHTML(it)}</div>` : ""}</div>
        <span class="subj-count" aria-label="Subject ${S.done.length + 1} of ${Math.max(TOTAL(), S.done.length + 1)}">${S.done.length + 1} of ${Math.max(TOTAL(), S.done.length + 1)}</span></div>
      <div class="steps">${stepHTML(0)}${exStepHTML(0)}${stepHTML(1)}${exStepHTML(1)}
        <div class="st st-dec ${ready ? "" : "off"} ${c.dec !== null ? "done" : ""}"><span class="n">${c.dec !== null ? "✓" : 3}</span>
          <div><div class="st-t">Together: ${w.q}</div></div>
          <div class="choice"><button class="btn ok ${c.dec === true ? "on" : ""}" data-dec="1" ${ready ? "" : "disabled"}>${w.yes}</button>
            <button class="btn no ${c.dec === false ? "on" : ""}" data-dec="0" ${ready ? "" : "disabled"}>${w.no}</button>
            <button class="btn meh ${c.dec === "agree" ? "on" : ""}" data-dec="agree" ${ready ? "" : "disabled"}>🤝 Agree to disagree</button>
            <button class="btn primary next-btn" data-next ${c.dec === null ? "disabled" : ""}>Next subject →</button></div></div></div>
      ${c.r[0].n === null && S.pools[c.kind].length ? `<div class="next-row"><button class="linkish" data-swap>Another subject</button></div>` : ""}
    </section>${sofarHTML()}`;
}
/* 💡 Example: two model reasons for each side, written in the lesson chat (box phrases in **bold**).
   It opens by itself under a reason row once that row is done (all ticked, or "We give up"), so they try first; 💡 opens it earlier */
const exLine = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b class="bx">$1</b>');
const exOf = k => { const c = S.cur, it = c && itemOf(c.kind, c.i), l = it && it.exl && c.r[k].n !== null ? (k === 0 ? it.exl.for : it.exl.against) : null; return l && l.length ? l : null; };
const exLineHTML = x => `<div class="live-host ${liveDim(x.p)}" data-live-host><p>${exLine(x.t)}</p>${liveTools(x.p)}</div>`;
const exStepHTML = k => { const lines = exOf(k); if(!lines || !S.cur.exOpen[k]) return "";
  return `<div class="ex-step ${S.exAnim === k ? "opening" : ""}" role="region" aria-label="Example"><span class="ex-ic" aria-hidden="true">💡</span><button class="linkish ex-hide" data-ex-hide="${k}">hide</button>${lines.map(exLineHTML).join("")}</div>`; };
const allExamplesHTML = () => D.lists.some(l => l.items.some(it => it.ex)) ? allHTML("All the examples", D.lists.map(l => { const w = WORDS[l.kind];
    return `<span class="all-h">${esc(l.label)}</span>` + l.items.map((_, i) => i).filter(i => l.items[i].ex && (liveTeacher() || !itemGone(l.kind, i))).map(i => { const it = itemOf(l.kind, i), p = itemPath(l.kind, i);
      return `<div class="all-row"><div class="live-host ${liveDim(p)}" data-live-host><span class="all-sub">${esc(it.t)}</span>${liveTools(p, {fields: p + ".t"})}</div>
      <span class="all-side">${w.keep}</span>${it.exl.for.map(exLineHTML).join("")}
      <span class="all-side">${w.drop}</span>${it.exl.against.map(exLineHTML).join("")}</div>`; }).join(""); }).join("")) : "";
const decTag = (d, w) => d.dec === "agree" ? "agree to disagree" : d.dec ? w.yesTag : w.noTag;
const sofarHTML = () => S.done.length ? `<div class="sofar"><b>So far:</b>${S.done.map((d, i) => { const w = WORDS[d.kind];
    return `<span class="chip ${d.dec === "agree" ? "meh" : d.dec ? "yes" : "nope"} ${S.popChip && i === S.done.length - 1 ? "chip-in" : ""}">${esc(itemOf(d.kind, d.i).t)} · ${decTag(d, w)}</span>`; }).join("")}</div>` : "";
const speakStage = () => `<section class="stage-wrap ${S.enter ? "enter" : ""}">${speakHTML(liveList(D.speaking, "speaking"), `<button class="btn" data-back>← The subjects you haven't discussed</button><button class="btn primary" data-restart>Start again</button>`, "Extra speaking", "speaking")}</section>`;
/* follow-up questions: they come in once two to cut and two to add are picked, one at a time */
function followHTML(){
  const F = liveList(D.followUp, "followUp");
  if(!F.length || S.picks.cut.size < 2 || S.picks.add.size < 2) return "";
  /* the group stays on the same question when her changes arrive (as with the speaking tasks) */
  S.fuCur = S.fuCur || newCursor();
  const {i, more, back} = cursorPick(S.fuCur, F), first = !S.fuShown; S.fuShown = true; S.fuView = F; liveViews.followUp = F;
  return `<div class="follow ${first ? "follow-in" : ""}"><div class="follow-top"><span class="follow-h">➕ Follow-up</span>
      ${dotsHTML(F.length, i, "data-fu-go", "Follow-up question", F, "followUp", S.fuCur.seen)}</div>
    <div class="live-host" data-live-host><p class="follow-q">${boxMarks(F[i].t)}</p>${liveTools("followUp." + F[i].k, {last: true})}</div>
    ${back || more ? `<div class="row-actions">${back ? `<button class="btn slim" data-fu-prev>← Previous</button>` : ""}${more ? `<button class="btn slim" data-fu-next>Next question →</button>` : ""}</div>` : ""}</div>`;
}
function decideHTML(){
  const col = kind => { const l = LISTS[kind], w = WORDS[kind], picked = S.picks[kind];
    return `<div class="col"><div class="col-h"><span class="subj-label">${esc(l.label)}</span><span class="cnt">${kind === "cut" ? "two to cut" : "two to add"}${picked.size ? ` · ${picked.size} picked` : ""}</span></div>
      ${l.items.map((_, i) => itemGone(kind, i) ? "" : (it => { const d = S.done.find(x => x.kind === kind && x.i === i), on = picked.has(i);
        return `<button class="pick ${kind} ${on ? "on" : ""}" data-pick="${kind}.${i}" aria-pressed="${on}"><span>${on ? `<span class="mark">${kind === "cut" ? "✂" : "＋"}</span> ` : ""}${esc(it.t)}</span>${d ? `<span class="was">you said: ${decTag(d, w)}</span>` : ""}</button>`; })(itemOf(kind, i))).join("")}</div>`; };
  return `<section class="stage decide ${S.enter ? "enter" : ""}"><div class="decide-top"><h2>Decide together</h2>
    <p class="lead">${esc(D.decideLead || "Agree on two to cut and two to add. Tap them.")}</p></div>
    <div class="cols">${KINDS.map(col).join("")}</div>
    <div class="frame"><small>Your decision</small>${esc(D.report)}</div>
    ${followHTML()}
    <div class="row-actions"><button class="btn" data-back>← Back to the reasons</button>${D.speaking && D.speaking.length ? `<button class="btn" data-stage="speak">💬 Extra speaking →</button>` : ""}</div>
  </section>`;
}
function goStage(v){ if(S.view === v || S.busy) return; S.view = v; S.enter = true; render(); S.enter = false; scrollTo(0, 0); }
function headHTML(){
  return `<header class="head"><span class="part">${esc(D.part)}</span><h1>${esc(D.title)}</h1>${S.view !== "speak" ? sitFoldHTML() : ""}
      ${stagesHTML([["game", "🎲 Reasons"], ["decide", "🤝 Decide"], ["speak", "💬 Extra speaking"]], S.view)}</header>
    ${S.view !== "game" ? "" : `<div class="hint-top dice-hint"><span>🎲 ${esc(D.hint || "The dice tells you how many reasons to give, for and against — a phrase from the box for each, changed to fit.")}</span>
      <span class="seg" role="group" aria-label="Dice">${DIE_OPTIONS.map(n => `<button data-faces="${n}" aria-pressed="${faces === n}">1–${n}</button>`).join("")}</span></div>`}
`;
}
/* tools 10: while the box is on screen, the situation folds into a chip on the title line (it is read on the slide first),
   so the box and the whole subject fit on a 1280×720 Zoom screen (her rule: no scrolling); behind 👀 Peek it stays beside */
const boxShown = () => !D.boxHidden || S.peek;
const sitFoldHTML = () => D.situation && boxShown() ? `<details class="sit-fold" ${S.sitOpen ? "open" : ""}><summary>📍 The situation</summary><p>${esc(D.situation)}</p></details>` : "";
function sideHTML(){
  const extra = (D.situation && !boxShown() ? `<p class="situation">${esc(D.situation)}</p>` : "") + (D.extra ? `<p class="extra">${esc(D.extra)}</p>` : "");
  if(D.boxHidden && !S.peek) return `${extra}<div class="peek"><p>Try not to look at the box.</p><button class="btn" data-peek>👀 Peek</button></div>`;
  return `${extra}${boxHTML(D.box, {clickable: true, collapsible: D.boxHidden})}`;
}
function render(anim){
  liveApply();   /* her latest changes, at the group's tap (live version) */
  const main = document.getElementById("main"), side = document.getElementById("side");
  main.innerHTML = liveBarHTML(liveLabel) + headHTML() + (S.view === "decide" ? decideHTML() : S.view === "speak" ? speakStage() : gameHTML(anim));
  /* 📋 under the box: a fallback for her, not something to invite a click (27.10) */
  const st = side.scrollTop; side.innerHTML = sideHTML() + allExamplesHTML(); side.scrollTop = st;
  wireAll(side); wireBox(side); wireSpeak(main, render); S.exAnim = null;
  wireLive(main, p => pathGet(D, p)); wireLive(side, p => pathGet(D, p));
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(b => b.addEventListener("click", () => fn(b)));
  on("[data-roll]", b => roll(+b.dataset.roll));
  on("[data-giveup]", b => { const k = +b.dataset.giveup, r = S.cur.r[k]; r.gaveUp = !r.gaveUp; if(r.gaveUp){ S.justGave = k; openEx(k); } render(); S.justGave = null; });
  on("[data-dot]", b => { const [k, j] = b.dataset.dot.split(".").map(Number), r = S.cur.r[k]; r.got = j < r.got ? j : j + 1; S.popTick = j < r.got ? `${k}.${j}` : null;
    const complete = r.got >= r.n; if(complete) setTimeout(() => { openEx(k); render(); pop(document.querySelectorAll(".st .n")[k]); }, 420);
    render(); S.popTick = null; });
  on("[data-dec]", b => { S.cur.dec = b.dataset.dec === "agree" ? "agree" : b.dataset.dec === "1"; render(); pop(document.querySelector(`[data-dec="${b.dataset.dec}"]`)); pop(document.querySelectorAll(".st .n")[2]); });
  on("[data-next]", next);
  on("[data-swap]", swap);
  on("[data-ex]", b => { openEx(+b.dataset.ex); render(); });
  on("[data-ex-hide]", b => { S.cur.exOpen[+b.dataset.exHide] = false; render(); });
  on("[data-decide]", () => goStage("decide"));
  on("[data-stage]", b => goStage(b.dataset.stage));
  on("[data-back]", () => { S.view = "game"; render(); });
  const fuShow = () => { render(); pop(document.querySelector(".follow")); };
  on("[data-fu-next]", () => { S.fuCur.move = 1; fuShow(); });
  on("[data-fu-prev]", () => { S.fuCur.move = -1; fuShow(); });
  on("[data-fu-go]", b => { const k = +b.dataset.fuGo; S.fuCur.go = S.fuView && S.fuView[k] ? S.fuView[k].k : null; fuShow(); });   /* her dragging of these dots: wireSpeak → wireDrag */
  on("[data-pick]", b => { const [kind, i] = b.dataset.pick.split("."), set = S.picks[kind]; set.has(+i) ? set.delete(+i) : set.add(+i); render(); if(set.has(+i)) pop(document.querySelector(`[data-pick="${kind}.${i}"]`)); });
  on("[data-faces]", b => { faces = +b.dataset.faces; render(); });
  on("[data-restart]", () => { usedPhrases.clear(); spkReset(); newGame(); render(true); });
  on("[data-peek]", () => { S.peek = true; render(); });
  document.querySelectorAll(".sit-fold").forEach(d => d.addEventListener("toggle", () => { S.sitOpen = d.open; }));   /* stays open through rolls */
  on("[data-box-toggle]", () => { S.peek = false; render(); });
}
liveRerender = () => render();
render();
</script>
</body>
</html>
