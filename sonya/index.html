<style>
/* Layout: one calm card in the middle of the screen, big buttons, the "how I feel" bar always at the bottom */
:root{
  --bg:#eef3f6; --card:#ffffff; --ink:#1d2a33; --soft:#5c6f7b; --line:#d5e0e6;
  --accent:#f2a516; --accent-ink:#3b2a00; --calm:#5f8fa6; --calm-bg:#e1edf2;
  --der:#2864c7; --die:#cf3d35; --das:#24894f; --ok:#24894f; --warn:#b5651d;
  --display:"Fredoka","Nunito","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a1f; --card:#1b262d; --ink:#e7eef2; --soft:#9db0bb; --line:#2c3a43;
  --accent:#f5b53d; --accent-ink:#2a1d00; --calm:#86b3c8; --calm-bg:#20323b;
  --der:#5b93ef; --die:#ef6a62; --das:#4cc07d; --ok:#4cc07d; --warn:#e09a55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a1f; --card:#1b262d; --ink:#e7eef2; --soft:#9db0bb; --line:#2c3a43;
  --accent:#f5b53d; --accent-ink:#2a1d00; --calm:#86b3c8; --calm-bg:#20323b;
  --der:#5b93ef; --die:#ef6a62; --das:#4cc07d; --ok:#4cc07d; --warn:#e09a55; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:24px}
h2{font-size:22px}
.stars{font-family:var(--display);font-size:19px;background:var(--card);border:2px solid var(--accent);border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stars.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.25)}}
main{flex:1;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.task-label{font-size:15px;color:var(--soft);display:flex;justify-content:space-between;gap:8px;align-items:center}
.hl{font-size:13px;margin-left:6px}
.help-q{background:none;border:1.5px solid var(--line);color:var(--soft);border-radius:999px;font:inherit;font-size:14px;padding:2px 10px;cursor:pointer}
.big-pic{font-size:88px;text-align:center;line-height:1.1}
.word{font-family:var(--display);font-size:40px;text-align:center}
.word .art{display:inline-block;min-width:2.4em;border-bottom:4px dashed var(--line);color:var(--soft)}
/* v10.17: gap-fill sentence; the active blank is marked, a filled article takes the gender colour and lights up */
.gapsent{font-family:var(--display);font-size:30px;text-align:center;line-height:1.6;margin:4px 0}
.gapsent .slot{display:inline-block;min-width:2.1em;border-bottom:4px dashed var(--line);color:var(--soft);text-align:center;border-radius:4px}
.gapsent .slot.cur{border-bottom-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.gapsent .slot.ok{border-bottom-color:transparent;font-weight:700}.gapsent .slot.okg{color:var(--ok)}
.gapsent .slot.der{color:var(--der)}.gapsent .slot.die{color:var(--die)}.gapsent .slot.das{color:var(--das)}
/* v10.26: gap cards («пробелы»): the right line big, her line struck grey (the same «wrong» mark as in Robo's bubble), two chunks to choose from */
.gcs{text-align:center;font-family:var(--display);font-size:26px;line-height:1.5}.gcs .chg{background:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:6px;padding:0 4px}
.gc-mem{font-family:var(--display);font-size:40px;font-weight:600;text-align:center;letter-spacing:.04em;color:var(--accent);line-height:1.1}
.gc-ru{font-size:22px;color:var(--ink);text-align:center;margin-top:6px;font-weight:600}
.gcopts .btn .ru{display:block;font-family:var(--body);font-size:19px;font-weight:600;margin-top:2px;opacity:.9}
.gc-wrong{text-align:center;margin-top:8px;font-size:19px}.gc-wrong .struck{color:var(--soft);text-decoration:line-through;opacity:.75}
.gcopts{display:flex;flex-direction:column;gap:10px;margin-top:6px}.gcopts .btn{font-family:var(--display);font-size:26px;min-height:60px}
.btn.struck{color:var(--soft);text-decoration:line-through}
.gcrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.gcpic{font-size:28px;line-height:1.2}.gctxt{flex:1;font-size:16px}
.gcrow .struck{color:var(--soft);text-decoration:line-through}.gcbtns{display:flex;flex-direction:column;gap:4px}.gcbtns .btn{min-height:40px;font-size:15px;padding:6px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0}
button{font-family:var(--display);font-weight:600;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font-size:22px;border:none;border-radius:16px;padding:16px 10px;background:var(--calm-bg);color:var(--ink);min-height:64px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.der{background:var(--der);color:#fff}.btn.die{background:var(--die);color:#fff}.btn.das{background:var(--das);color:#fff}
.btn.small{font-size:17px;min-height:48px;padding:10px}
.msg{border-radius:14px;padding:12px 14px;background:var(--calm-bg);font-size:18px}
.msg.good{border-left:6px solid var(--ok)}
.nodet{border-bottom:2px dotted var(--soft)}

function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(events)); } catch(e){} }
function logEv(ev){
  ev.id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  ev.ts = new Date().toISOString(); ev.sid = session ? session.sid : null; if(session){ ev.lvl = session.level; if(session.hl) ev.hl = session.hl; } if(testMode) ev.test = true;
  events.push(ev); saveLocal();
  if (col) { const c = col; writeChain = writeChain.then(()=>c.doc(ev.id).set(ev)).catch(()=>{}); }
}
(async()=>{
  if(!window.claude) return;
  await null;   // v10.12: the rest runs after the page script has loaded, so the settings helpers below exist
  try{
    const [db,user] = await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const uid = await user.id(); if(!uid) return;
    col = db.collection("data/users/"+uid);
    // pages of 1000 (the store's cap), ordered by document id = by time (ids start with the timestamp in base 36)
    const t0 = Date.now(); let remote = [], last = "";
    for(let k=0;k<30;k++){
      const q = last ? col.where("id", ">", last).limit(1000) : col.limit(1000);
      const snap = await q.get(); const page = snap.docs.map(d=>d.data()).filter(x=>x&&x.id);
      remote = remote.concat(page); if(page.length<1000) break; last = page[page.length-1].id;
    }
    const have = new Set(remote.map(e=>e.id));
    const localOnly = events.filter(e=>!have.has(e.id));
    events = remote.concat(localOnly).sort((a,b)=>a.ts<b.ts?-1:1); saveLocal();
    localOnly.forEach(ev=>{ writeChain = writeChain.then(()=>col.doc(ev.id).set(ev)).catch(()=>{}); });
    logEv({kind:"dbload", n:remote.length, local:localOnly.length, ms:Date.now()-t0, stars:0});   // diagnostics for the journal, never shown
    restoreSettings(); settingsPending=false;
    if(view==="home") renderHome(); if(view==="parent") renderParent();
  }catch(e){ try{ logEv({kind:"dbload", err:String((e&&e.code)||e).slice(0,80), stars:0}); }catch(_){} }
  finally{ settingsLoaded(); }
})();

// a photo or a drawing-app screenshot comes on a solid background (white paper, red canvas): cut away the background colour
// found in the corners where it touches the edges; a strongly coloured background is also removed inside (gaps between hair and neck),
// a white one is not, so white gloves and eyes inside the figure stay
function cutBg(c){
  const ctx=c.getContext("2d"), W=c.width, H=c.height, im=ctx.getImageData(0,0,W,H), d=im.data, seen=new Uint8Array(W*H), q=[];
  const at=i=>[d[i*4],d[i*4+1],d[i*4+2]];
  const cs=[at(0),at(W-1),at((H-1)*W),at(H*W-1)], bg=[0,1,2].map(k=>Math.round(cs.reduce((a,c)=>a+c[k],0)/4));
  const near=i=>{ const p=at(i); return Math.abs(p[0]-bg[0])+Math.abs(p[1]-bg[1])+Math.abs(p[2]-bg[2])<100; };
  const push=i=>{ if(!seen[i] && near(i)){ seen[i]=1; q.push(i); } };
  for(let x=0;x<W;x++){ push(x); push((H-1)*W+x); } for(let y=0;y<H;y++){ push(y*W); push(y*W+W-1); }
  while(q.length){ const i=q.pop(); d[i*4+3]=0; const x=i%W, y=(i-x)/W; if(x>0) push(i-1); if(x<W-1) push(i+1); if(y>0) push(i-W); if(y<H-1) push(i+W); }
  if(Math.max(...bg)-Math.min(...bg)>100){ for(let i=0;i<W*H;i++) if(near(i)) d[i*4+3]=0; }
  ctx.putImageData(im,0,0);
}

function amyValid(r, found, text){   // keep only answers that name a noun of the sentence and stay short

  if(!r || typeof r!=="object") return null;
  if(r.unclear===true) return {kind:"unclear"};
  // v10.25: the recast is kept only when it is one short sentence that differs from hers (≤ 12 words, no second sentence, no explanation)
  const besser = (typeof r.besser==="string" && r.besser.trim() && r.besser.trim().split(/\s+/).length<=12 && !/[.!?].+[.!?]/.test(r.besser.trim()) && normSent(r.besser)!==normSent(text)) ? r.besser.trim() : null;
  const ru = (besser && typeof r.ru==="string" && r.ru.trim().length<=80) ? r.ru.trim() : "";   // v10.26: the card's Russian line
  const sh = x=> typeof x==="string" && x.trim() && x.trim().length<=40 ? x.trim() : "";   // v10.27: card extras
  const gx = besser ? {kind: r.art==="wort" ? "meaning" : r.art==="form" ? "form" : "", aRu: sh(r.teil_ru), far: sh(r.weit) && sh(r.weit).split(/\s+/).length<=4 ? {t:sh(r.weit), ru:sh(r.weit_ru)} : null} : null;
  const unsure = (besser && r.sure!==true) ? besser : null;   // v10.26 (Olya): a guessed meaning is never shown to Sonya; parents see it as a card «Клод не уверен»
  if(r.ok===true){ const ch=(Array.isArray(r.chunks)?r.chunks:[]).filter(okChunk).map(x=>x.trim()); return ch.length?{kind:"ok", chunks:ch, besser:unsure?null:besser, unsure, ru, gx}:null; }
  if(r.ok===false && r.fix && okChunk(r.fix.to) && typeof r.fix.from==="string") return {kind:"fix", from:r.fix.from.trim(), to:r.fix.to.trim(), besser:unsure?null:besser, unsure, ru, gx};
  return null;
}

// Olya 28.10 night: a second example after her sentence was never looked at («through the Beispiel her attention is elsewhere»);
// instead, give her the sentence she could not formulate, with blanks ONLY where the articles go, so the attention is on the article.
// Process: recognition inside the sentence context (one unknown per blank: the noun's gender; everything else is given).
// Comes in the next session for a scene where an article in her own sentence was wrong, BEFORE she speaks that scene again.
// Blanks: der/die/das in the gender's own form (three buttons) and ein/eine (two buttons); oblique forms stay as text.
function gapSlots(s){
  const a = analyse(s), slots = [];
  a.found.forEach(f=>{
    if(f.detIdx<0) return; const d = f.det.toLowerCase();
    if(d===ART[f.g]) slots.push({idx:f.detIdx, w:f.w, g:f.g, ans:ART[f.g], opts:["der","die","das"]});
    else if((d==="ein"&&f.g!=="f")||(d==="eine"&&f.g==="f")) slots.push({idx:f.detIdx, w:f.w, g:f.g, ans:d, opts:["ein","eine"]});
  });
  return {toks:a.toks, slots};
}

function picFor(s){
  const all = SCENES_BASE.concat(SCENES_SCHOOL).find(sc=>sc.s===s); if(all) return all.e;
  const f = analyse(s).found[0]; if(!f) return "❓";
  const n = ALL_NOUNS.find(x=>x.w===f.w); if(!n) return "❓";
  const list = PRED_OWN[n.w] || PRED_SETS[NOUN_CAT[n.w]||"t"] || [];
  const hit = list.find(([pe,pd])=>s.endsWith(pd+"."));
  return n.e + (hit ? hit[0] : "");
}
function errScenes(){
  const since = Date.now()-7*864e5, bad = {}, done = {}, pic = {};
  live().forEach(e=>{
    if(!e.ts || !e.scene) return; const t = new Date(e.ts).getTime(); if(t<since) return;
    if(e.kind==="speech" && Array.isArray(e.nouns) && e.nouns.some(x=>x&&x.ok===false)){ bad[e.scene] = Math.max(bad[e.scene]||0, t); if(e.pic) pic[e.scene]=e.pic; }
    if(e.kind==="gap-done") done[e.scene] = Math.max(done[e.scene]||0, t);
  });
  return Object.keys(bad).filter(s=>!(done[s]>bad[s])).map(s=>({e:pic[s]||picFor(s), s, w:analyse(s).found[0]&&analyse(s).found[0].w}));
}

const DET = {der:"mf",die:"f",das:"n",den:"m",dem:"mn",des:"mn",ein:"mn",eine:"f",einen:"m",einem:"mn",einer:"f",eines:"mn",
  dieser:"mf",diese:"f",dieses:"n",diesen:"m",diesem:"mn",im:"mn",am:"mn",vom:"mn",zum:"mn",beim:"mn",zur:"f",ins:"n",ans:"n",aufs:"n"};
function detGenders(tok){

    if(tok.startsWith(p)){ const r="ein"+tok.slice(p.length); if(DET[r]) return DET[r]; }

}
const NOUN_BY_NORM = Object.fromEntries(ALL_NOUNS.map(n=>[norm(n.w),n]));   // speech and recall understand both themes
// v10.19 (Olya 29.10 04:25: «Ja, der Hund, das Bett» after «im Bett» can be heard as «in das Bett»): a noun group after a preposition
// (or with a merged form im/am/zum…) is judged for GENDER only. A fitting one still lights up and pays, but Эми never echoes it and never
// rewrites it in the nominative; a bare article after a preposition with the wrong gender is left unjudged (ok=null): the right form
// depends on the case, which the engine cannot see. Case and preposition are Claude's part (amyAI below).
const PREPS = new Set(["in","an","auf","unter","über","neben","vor","hinter","zwischen","mit","bei","von","zu","nach","aus","seit","für","ohne","gegen","um","durch"]);
const MERGED = new Set(["im","am","vom","zum","beim","zur","ins","ans","aufs"]);
// v10.21 (Olya 29.10 04:54: «а здесь точно можно eine Milch? оно uncountable»): mass nouns normally take no article; an indefinite article
// on them is left unjudged (gender fits, the form does not: nothing lights, nothing is paid, Эми does not echo it), and the bare noun gets
// no dotted «article missing» mark. The zero article is not taught yet: it is a form of its own for a later step of the ladder.
const MASS = new Set(["Milch"]);
function analyse(text){
  const toks = text.split(/[^A-Za-zÄÖÜäöüß]+/).filter(Boolean);
  const found = [];
  toks.forEach((tk,i)=>{
    const n = NOUN_BY_NORM[norm(tk)]; if(!n) return;
    let det=null;
    for(let j=i-1;j>=Math.max(0,i-3);j--){ const g=detGenders(toks[j].toLowerCase()); if(g){ det={tok:toks[j],g,idx:j}; break; } if(NOUN_BY_NORM[norm(toks[j])]) break; }
    const f = {w:n.w, g:n.g, det:det?det.tok:null, detIdx:det?det.idx:-1, ok:det?det.g.includes(n.g):null, idx:i};
    if(det){
      const low = det.tok.toLowerCase();
      f.merged = MERGED.has(low); f.prep = det.idx>0 && PREPS.has(toks[det.idx-1].toLowerCase());
      f.quiet = f.merged || f.prep;                                  // never echoed, never recast
      if(f.prep && !f.merged && f.ok===false && /^(der|die|das|ein|eine)$/.test(low)) f.ok = null;   // case unknown: not judged
      if(MASS.has(n.w) && f.ok===true && /^ein/.test(low)){ f.ok = null; f.quiet = true; f.massArt = true; }   // «eine Milch»: unjudged (v10.21)
    }
    f.mass = MASS.has(n.w);
    found.push(f);
  });
  return {toks, found};
}
function analysisHtml(a, reveal, pay){

// v10.16: the reveal of her sentence. Tokens come one by one; a fitting article lights up (.lit) and, if it is paid this time (.pay),
// one currency picture flies to the counter, which ticks when it lands (holdBack keeps the header behind until then).
// A tap on the sentence shows everything at once; reduced-motion skips the choreography.
let holdBack = 0;
function flyTo(fromEl, toEl, emoji, delay, onLand){
  const r1=fromEl.getBoundingClientRect(), r2=toEl.getBoundingClientRect();
  if(!r2.width){ setTimeout(()=>onLand&&onLand(), delay+200); return; }
  const f=document.createElement("div"); f.className="fly"; f.textContent=emoji;
  f.style.left=(r1.left+r1.width/2)+"px"; f.style.top=(r1.top+r1.height/2)+"px";
  document.body.appendChild(f);
  const dx=(r2.left+r2.width/2)-(r1.left+r1.width/2), dy=(r2.top+r2.height/2)-(r1.top+r1.height/2);
  setTimeout(()=>{ f.style.transform=`translate(${dx}px,${dy}px) scale(.55)`; f.style.opacity=".85"; }, delay);
  setTimeout(()=>{ f.remove(); onLand&&onLand(); }, delay+950);
}
function revealSentence(box, onDone){
  const toks=[...box.querySelectorAll(".tok")], target=$("#stars");

  const finish=()=>{ if(finished) return; finished=true; timers.forEach(clearTimeout); toks.forEach(t=>t.classList.remove("hid")); document.querySelectorAll(".fly").forEach(f=>f.remove()); box.onclick=null; onDone(); };

  if(reduced || !toks.length){ finish(); return {finish}; }
  toks.forEach(t=>t.classList.add("hid"));
  const step=()=>{ if(finished) return;
    if(i>=toks.length){ timers.push(setTimeout(finish, 600)); return; }
    const t=toks[i++]; t.classList.remove("hid");
    const ok=t.querySelector(".okw"), fix=t.querySelector(".fix"); let wait=300;
    if(ok||fix){ (ok||fix).classList.add("lit"); wait=950; }
    if(ok && ok.classList.contains("pay")) flyTo(ok, target, CI(), 400, ()=>{ if(holdBack>0){ holdBack--; showStars(); } });
    timers.push(setTimeout(step, wait)); };

  step();

}

// «meinem → meiner» before Katze. Only the gender is corrected (the app teaches articles, not cases); an unknown form falls back to the nominative.
const DET_FIX = {der:{n:"das"}, die:{m:"der",n:"das"}, das:{m:"der",f:"die"}, den:{f:"die",n:"das"}, dem:{f:"der"}, des:{f:"der"},
  ein:{f:"eine"}, eine:{m:"ein",n:"ein"}, einen:{f:"eine",n:"ein"}, einem:{f:"einer"}, einer:{m:"einem",n:"einem"}, eines:{f:"einer"},
  dieser:{n:"dieses"}, diese:{m:"dieser",n:"dieses"}, dieses:{m:"dieser",f:"diese"}, diesen:{f:"diese",n:"dieses"}, diesem:{f:"dieser"},
  im:{f:"in der"}, am:{f:"an der"}, vom:{f:"von der"}, zum:{f:"zur"}, beim:{f:"bei der"}, zur:{m:"zum",n:"zum"}, ins:{m:"in den",f:"in die"}, ans:{m:"an den",f:"an die"}, aufs:{m:"auf den",f:"auf die"}};
function fixDet(tok, g){
  const low = tok.toLowerCase(); let fix = (DET_FIX[low]||{})[g];
  if(!fix){ for(const p of ["mein","dein","sein","kein","unser","euer","eur","ihr"]){ if(low.startsWith(p)){ const f=(DET_FIX["ein"+low.slice(p.length)]||{})[g]; if(f && f.startsWith("ein")) fix = p+f.slice(3); break; } } }

  main.innerHTML = `<div class="card"><h2>Пауза</h2>${breathHtml()}

    if(k>=N){ clearInterval(iv); $("#pb").innerHTML=`<button class="btn main" id="go2" style="margin-top:12px;width:100%">Начать занятие</button>`; $("#go2").onclick=startSession; }

const DRAW_LS = "sonya-de-draw-since";
function drawPause(){
  view="pause";
  let since = 0; try{ since = +localStorage.getItem(DRAW_LS)||0; }catch(e){}
  if(!since || Date.now()-since > 60*60*1000){ since = Date.now(); try{ localStorage.setItem(DRAW_LS, String(since)); }catch(e){} logEv({kind:"pause", how:"draw", stars:0}); }
  main.innerHTML = `<div class="card"><h2>Порисуй 🎨</h2>
    <div class="msg">Поставь себе таймер на <b>${DRAW_MIN} минут</b> и иди рисовать.<br>Когда вернёшься, нажми «Я вернулась». Я спрошу слова, которые были сегодня: скажешь артикль сама ${CI()} +${RECALL_SAY_STARS}, выберешь из трёх ${CI()} +${RECALL_STARS}.<br>Это проверка памяти, а не экзамен. Ошибаться можно.</div>
    <button class="btn main" id="backFromDraw" style="margin-top:12px;width:100%">Я вернулась</button>
    <button class="linkbtn" id="back">На главную</button></div>`;
  $("#back").onclick=renderHome;
  $("#backFromDraw").onclick=()=>{
    const min = Math.round((Date.now()-since)/60000);
    if(min < DRAW_MIN){
      main.innerHTML = `<div class="card"><h2>Рано 🙂</h2>
        <div class="msg">Прошло ${min===0?"меньше минуты":min+" "+plural(min,"минута","минуты","минут")} из ${DRAW_MIN}. Можно ещё порисовать, я подожду.</div>
        <div class="row" style="margin-top:12px"><button class="btn main" id="moreDraw">Ещё порисую</button><button class="btn" id="noCheck">Начать без проверки</button></div></div>`;
      $("#moreDraw").onclick=drawPause; $("#noCheck").onclick=()=>{ logEv({kind:"pause", how:"draw-early", min, stars:0}); clearDraw(); startSession(); };
      return;
    }
    clearDraw(); logEv({kind:"pause", how:"draw-done", min, stars:0}); delayedRecall(min);
  };
}
function clearDraw(){ try{ localStorage.removeItem(DRAW_LS); }catch(e){} }
// memory check after a real break: today's words, mistakes first
function delayedRecall(gapMin){
  const d = todayKey(), seenW = new Set();
  live().forEach(e=>{ if(e.ts && localDay(e.ts)===d && e.word && (e.kind==="article"||e.kind==="robot"||e.kind==="recall")) seenW.add(e.word); });
  const missed = new Set(missedToday().map(n=>n.w));
  const seen = NOUNS.filter(n=>seenW.has(n.w));
  const pick = shuffle(seen.filter(n=>missed.has(n.w))).slice(0,3);
  for(const n of shuffle(seen.filter(n=>!missed.has(n.w)))){ if(pick.length>=4) break; pick.push(n); }
  if(pick.length<2) return startSession();
  session = { sid: Date.now().toString(36), i:0, stars:0, fixed:0, spoke:0, level:roundLevel(visitRounds()), tasks:[], recall:{ok:0, all:pick.length}, delayed:true };
  recallExtra = {delayed:true, gapMin};
  $("#feel").hidden=true; view="recall";
  recallOne(pick, 0, missed, ()=>{
    recallExtra = {};
    const r = session.recall;
    main.innerHTML = `<div class="card"><h2>Проверка памяти 🧠</h2>
      <div class="msg good">После рисования ты вспомнила <b>${r.ok}</b> из ${r.all} слов.</div>
      <button class="btn main" id="go2" style="margin-top:12px;width:100%">Начать занятие</button></div>`;
    $("#go2").onclick=startSession;
  });
}

  main.querySelectorAll("#rateRow button").forEach(b=>b.onclick=()=>{ setRate(rate()+parseFloat(b.dataset.d)); renderParent(); });
  $("#reset").onclick=()=>{
    $("#resetRow").innerHTML=`<button class="btn small main" id="resetYes">Да, обнулить</button><button class="btn small" id="resetNo">Нет</button>`;
    $("#resetNo").onclick=renderParent;
    $("#resetYes").onclick=()=>{ const was=totalStars(); words={}; try{ localStorage.removeItem(WORDS_LS); }catch(e){} logEv({kind:"reset", before:was, stars:0}); showStars(); renderParent(); $("#resetRow").innerHTML=`<span class="hint">Обнулено. Было ${CI()} ${was}, теперь 0.</span>`; };
  };
  $("#back").onclick=renderHome;
  $("#saveNote").onclick=()=>{ const v=$("#note").value.trim(); if(!v) return; logEv({kind:"note", text:v}); renderParent(); };
  $("#save").onclick=()=>{ try{ const b=new Blob([JSON.stringify(events)],{type:"application/json"}), a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="sonya-zhurnal-"+todayKey()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); $("#copied").textContent="Файл сохранён в загрузки. Его можно отправить Claude."; }catch(e){ $("#copied").textContent="Не получилось сохранить файл."; } };
  $("#load").onclick=()=>$("#loadF").click();
  $("#loadF").onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ const arr=JSON.parse(t); if(!Array.isArray(arr)) throw 0; const have=new Set(events.map(x=>x.id)); const add=arr.filter(x=>x&&x.id&&x.ts&&!have.has(x.id)); events=events.concat(add).sort((a,b)=>a.ts<b.ts?-1:1); saveLocal(); restoreSettings(); renderParent(); $("#copied").textContent="Добавлено записей: "+add.length+"."; }).catch(()=>{ $("#copied").textContent="Это не файл журнала."; }); };
  $("#copy").onclick=()=>{ const txt=JSON.stringify(events); navigator.clipboard.writeText(txt).then(()=>$("#copied").textContent="Скопировано. Можно вставить в чат с Claude.",()=>{$("#copied").textContent="Не получилось скопировать. Если данные сохраняются в аккаунте, Claude прочитает их и так.";}); };
}

renderHome();
</script>
</body>
</html>
