<style>
:root{
  --ground:#F6F1DC;      /* the cream frame around her slides */
  --card:#FFFFFF;
  --ink:#1D1D1B;
  --muted:#6B6B6B;
  --line:#D9D2B8;
  --instr:#0693E3;       /* blue instruction box */
  --instr-ink:#FFFFFF;
  --answer:#0000FF;      /* blue answers */
  --label:#E00000;       /* red category labels, key words */
  --hl:#FFFF00;          /* yellow hidden answers */
  --hl-ink:#1D1D1B;
  --share:#00FF00;       /* green: share your reaction */
  --gloss:#0693E3;
  --ipa:#0E8A7E;
  --bubble:#FFFF8C;
  --bubble-ink:#1D1D1B;
  --bubble-line:#1D1D1B;

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121416; --card:#1C1F23; --ink:#ECECEA; --muted:#A4A7AB; --line:#33373D;
    --instr:#1578C0; --instr-ink:#FFFFFF; --answer:#8FB0FF; --label:#FF7A7A;

    --bubble:#3B391F; --bubble-ink:#F3F0D0; --bubble-line:#8C8760; --summary:#22362A; --done:#62C774;
    --fig-filter:invert(1) hue-rotate(180deg);
    --ok-bg:#18301E; --ok-chip:#24502E; --ok-ink:#9BE3A8; --no-bg:#3A1E1C; --no-chip:#5A2622; --no-ink:#FFB4AB; --good-hl:#BFF2B8; --strike:#8A8D91; --fix-bg:#22345A; --topic-a:#2A2614; --topic-b:#162636;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121416; --card:#1C1F23; --ink:#ECECEA; --muted:#A4A7AB; --line:#33373D;
  --instr:#1578C0; --instr-ink:#FFFFFF; --answer:#8FB0FF; --label:#FF7A7A;
  --hl:#FFF34D; --hl-ink:#111111; --share:#52F552; --gloss:#5BB8F5; --ipa:#4CC5B3;
  --bubble:#3B391F; --bubble-ink:#F3F0D0; --bubble-line:#8C8760; --summary:#22362A; --done:#62C774;
  --fig-filter:invert(1) hue-rotate(180deg);
  --ok-bg:#18301E; --ok-chip:#24502E; --ok-ink:#9BE3A8; --no-bg:#3A1E1C; --no-chip:#5A2622; --no-ink:#FFB4AB; --good-hl:#BFF2B8; --strike:#8A8D91; --fix-bg:#22345A; --topic-a:#2A2614; --topic-b:#162636;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);margin:0}
body{color:var(--ink);font-family:var(--font-body);font-size:var(--step-0);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--instr);outline-offset:2px;border-radius:6px}
h1{margin:0;font-size:var(--step-2);line-height:1.2;font-weight:900}
.head{display:grid;gap:4px;padding-block:4px 18px}
.head p{margin:0;color:var(--muted)}
.to-start{justify-self:start;color:var(--instr);font-weight:700;text-decoration:none;margin-bottom:6px}
.small{font-size:.9rem;color:var(--muted)}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--instr);background:transparent;color:var(--instr);font-weight:900;cursor:pointer}
.btn.primary{background:var(--instr);color:var(--instr-ink)}
.btn:disabled{opacity:.5}

.sync{margin:0 0 16px}
.sync-on{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;color:var(--muted);font-size:.95rem}

.list{display:grid;gap:14px}
.hw{display:grid;gap:10px;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.hw:hover{border-color:var(--instr)}

.hw-top{display:flex;align-items:center;gap:10px}

.hw.unl{border-style:dashed}
.unl-tag{color:var(--muted)}
.tag{font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--instr)}
.go{margin-left:auto;color:var(--instr);font-weight:900}
.topics{display:grid;gap:8px}
.topic{border-radius:10px;padding:8px 12px;display:grid;gap:1px}
.topic.t0{background:var(--topic-a)} .topic.t1{background:var(--topic-b)}
.topic b{font-size:var(--step-1);line-height:1.3}
.topic span{color:var(--muted);font-size:.92rem}
.prog{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}

.prog .bar i{display:block;height:100%;background:var(--done);border-radius:99px}

.hw.todo{border-color:var(--label)}
.hw.fbnew{border-color:var(--label)}

.fb-alert b{color:var(--label)}
.fb-alert a{color:var(--answer);font-weight:700}
.tb{font-size:.92rem;color:var(--muted)}
.tb b{color:var(--label)}
.t-sum{margin:0 0 14px;font-weight:900;color:var(--label)}
.t-sum.none{color:var(--done)}
.t-sum.checking{color:var(--muted)}

.foot{color:var(--muted);font-size:.88rem;margin-top:22px}
.meter{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin:0 0 16px;display:grid;gap:8px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.meter-top span{font-weight:900;color:var(--ink)}
.strip{display:flex;gap:3px;background:#1D1D1B;border-radius:6px;padding:9px 6px;position:relative}
.strip::before,.strip::after{content:"";position:absolute;left:6px;right:6px;height:3px;background:repeating-linear-gradient(90deg,#F6F1DC 0 5px,transparent 5px 11px);opacity:.55}
.strip::before{top:3px}.strip::after{bottom:3px}
.strip i{flex:1;height:22px;border-radius:2px;background:#3A3A36}
.strip i.on{background:linear-gradient(180deg,#FFE066,#FF9900)}
.meter .small{margin:0}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,520px);background:#1D1D1B;color:#fff;font-weight:700;padding:12px 16px;border-radius:12px;z-index:61;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .5s}
.toast.out{opacity:0}

.legal{max-width:var(--maxw,760px);margin:0 auto;padding:18px 16px 28px;color:var(--muted);font-size:.85rem;text-align:center}
.legal a{color:inherit}
.chip-t{font:inherit;font-size:.9rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 12px;cursor:pointer}
.preview-bar{align-items:center;background:var(--card);border:2px dashed var(--instr);border-radius:12px;padding:8px 12px;color:var(--ink)}
</style>

<div class="wrap" id="app"></div>
<footer class="legal"><a href="../impressum.html">Impressum</a> · <a href="../datenschutz.html">Datenschutz</a></footer>
<script>
const HW_ALL = [{"file": "2026-10-23.html", "key": "hw-ge-c1-2026-10-23", "date": "23.10.26", "topics": [{"title": "The clocks go back", "sub": "Moving a call when the clocks change"}, {"title": "How did you get into that?", "sub": "Talking about your studies and your career path"}], "tasks": ["clocks-text", "clock-listen", "clock-practice", "career-rewrite", "career-finish", "career-listen", "write"]}, {"file": "2026-10-21.html", "key": "hw-ge-c1-2026-10-21", "date": "21.10.26", "topics": [{"title": "How did you get into that?", "sub": "Talking about your studies and your career path"}], "tasks": ["traps", "dan-text", "ruth-text", "yg-get", "yg-easy", "yg-training"]}, {"file": "2026-10-16.html", "key": "hw-ge-c1-2026-10-16", "date": "16.10.26", "topics": [{"title": "Getting to know someone and catching up", "sub": "Meeting someone new, and catching up with someone you haven't seen for ages"}], "tasks": ["coffee-text", "later-text", "practice", "convos", "listen1", "listen2", "listen3", "write"]}];
const SYNC_URL = "https://script.google.com/macros/s/AKfycbwHqzwA-2z09POg7JSqiMhqglOKbD8bxs-UG-NcFKZPzTyzmdEW79ct3zHGktUGyLM_/exec";
const lsMem = {};   /* if the browser blocks storage (private mode), remember things for this visit at least */
const ls = { get:k=>{ try{ const v = localStorage.getItem(k); if(v != null) return v; }catch(e){} return lsMem[k] || ""; }, set:(k,v)=>{ lsMem[k] = v; try{ localStorage.setItem(k,v); }catch(e){} } };
/* students see published homework only. A draft ("listed": false, 🔒 in her teacher view) joins their list
   once she taps Publish on its page: her table says which drafts are published (remembered here for the next visit) */
const PUB_KEY = "hw-pub-" + ((HW_ALL[0] && HW_ALL[0].key.split("-")[2]) || "group");
let PUB = new Set((()=>{ try{ return JSON.parse(ls.get(PUB_KEY) || "[]"); }catch(e){ return []; } })());
const isPub = h => !h.unlisted || PUB.has(h.key);
let HW = HW_ALL.filter(isPub);
function gotPub(list){ if(!Array.isArray(list)) return; PUB = new Set(list); ls.set(PUB_KEY, JSON.stringify(list)); HW = HW_ALL.filter(isPub); }
const teacherList = () => teacherView() ? HW_ALL : HW;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = document.getElementById("app");
let server = null, syncState = "";
const myCode = () => SYNC_URL ? ls.get("hw-code") : "";
/* Olya's "Student view": her own code, but the page behaves like a student's page, and nothing is sent to the table.
   Switching in or out starts from a clean page (her own ticks and marks on this device are cleared). */
const asStudent = () => !!(SYNC_URL && ls.get("hw-code") && ls.get("hw-role") === "teacher" && ls.get("hw-as-student"));
function setStudentView(on){
  ls.set("hw-as-student", on ? "1" : "");
  try{ Object.keys(localStorage).filter(k => /^hw-ge-/.test(k) || k === "hw-mark-used").forEach(k => localStorage.removeItem(k)); }catch(e){}
  location.reload();
}
document.addEventListener("click", ev => { const b = ev.target.closest && ev.target.closest("#as-student, #as-teacher"); if(b) setStudentView(b.id === "as-student"); });
const GROUP_ID = (HW_ALL[0] && HW_ALL[0].key.split("-")[2]) || "group";
/* a student sees only their own group: with a code from the other group, go to that group's list */
function toOwnGroup(gid){
  if(!gid || gid === GROUP_ID || ls.get("hw-role") === "teacher") return false;
  document.body.innerHTML = ""; location.replace("../" + gid + "/index.html"); return true;
}
function otherGroup(res, code){
  if(res.ok || res.error !== "other-group" || !res.gid) return false;
  ls.set("hw-code", code); ls.set("hw-role", ""); ls.set("hw-who", ""); ls.set("hw-gid", res.gid); return toOwnGroup(res.gid);
}
let groupStats = (()=>{ try{ return JSON.parse(localStorage.getItem("hw-group-"+GROUP_ID)||"null"); }catch(e){ return null; } })();
/* ---------- group goal: film-strip meter, confetti, milestones ---------- */
const fmtN = n => Number(n||0).toLocaleString("en-GB");
const capFirst = s => String(s||"").charAt(0).toUpperCase() + String(s||"").slice(1);
function meterHTML(gs){
  if(!gs || !gs.goal) return "";
  const pct = Math.min(1, gs.total/gs.goal), n = 20, filled = Math.min(n, Math.round(pct*n));
  return `<section class="meter" aria-label="Our group's goal">
      <div class="meter-top"><b>🎬 Our group</b><span>${gs.reached ? "Goal reached!" : `${fmtN(gs.total)} / ${fmtN(gs.goal)} 🎞`}</span></div>
      <div class="strip" role="img" aria-label="${Math.round(pct*100)}% of the way">${Array.from({length:n},(_,i)=>`<i class="${i<filled?"on":""}"></i>`).join("")}</div>
      <p class="small">${gs.reached ? `🎉 We did it! ${esc(capFirst(gs.reward))} is coming.` : `Every task adds frames — one per minute of work, Over to you counts double. At ${fmtN(gs.goal)} we'll have ${esc(gs.reward)}.`}${gs.size ? ` <b>${gs.week} of ${gs.size}</b> have added something this week.` : ""}</p>
    </section>`;
}
function confetti(big){
  try{ if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; }catch(e){}
  const c = document.createElement("canvas"); c.className = "confetti"; c.setAttribute("aria-hidden","true"); document.body.appendChild(c);
  const d = window.devicePixelRatio || 1, W = c.width = innerWidth*d, H = c.height = innerHeight*d, x = c.getContext("2d");
  if(!x){ c.remove(); return; }
  const cols = ["#0693E3","#FFFF00","#FF9900","#2E8B3E","#E00000","#8FB0FF"];
  const ps = Array.from({length: big ? 170 : 70}, (_,i)=>({ x: W/2 + (Math.random()-.5)*W*(big?.9:.35), y: H*(big?.4:.22),
    vx: (Math.random()-.5)*W*.012, vy: -(Math.random()*.018+.006)*H, s: (5+Math.random()*7)*d, r: Math.random()*6, vr: (Math.random()-.5)*.35, c: cols[i%cols.length] }));
  const t0 = performance.now(), life = big ? 2800 : 1700;
  (function frame(now){
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy += H*.0007; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1-(now-t0)/life); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(now - t0 < life) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg; document.body.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(), 600); }, 4200);
}
/* 25 / 50 / 75 / 100 %: celebrate once per device when the group passes a mark (a new goal starts a new season) */
function checkMilestone(gs, groupId){
  if(!gs || !gs.goal) return;
  const key = "hw-ms-" + groupId + "-" + gs.goal;
  const pct = gs.total/gs.goal*100, ms = pct>=100 ? 100 : pct>=75 ? 75 : pct>=50 ? 50 : pct>=25 ? 25 : 0;
  const seen = ls.get(key);
  if(seen === ""){ ls.set(key, String(ms)); return; }
  if(ms > Number(seen)){
    ls.set(key, String(ms)); confetti(true);
    toast(ms===100 ? `🎉 We did it! ${capFirst(gs.reward)} is coming!` : `🎬 Our group is ${ms}% of the way to ${gs.reward}!`);
  }
}


async function post(payload){
  try{
    const r = await fetch(SYNC_URL, {method:"POST", body:JSON.stringify(payload), headers:{"Content-Type":"text/plain;charset=utf-8"}});
    return await r.json();
  }catch(e){ return {ok:false, error:"offline"}; }
}
const json = k => { try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } };
function stats(h){
  /* Olya's table knows this homework once its page has synced; until then, show what's on this device */
  const s = server && server.pages ? server.pages[h.key] : null;
  if(s) return { done: h.tasks.filter(id=>s.done.includes(id)).length, fb: s.fb, fbNew: s.fbNew };
  const d = new Set(json(h.key) || []);
  const w = Object.values(json(h.key+"-work") || {}).flat().filter(x=>x && String(x.feedback||"").trim());
  return { done: h.tasks.filter(id=>d.has(id)).length, fb: w.length, fbNew: w.filter(x=>!x.seen).length };
}
/* teacher view: what waits for Olya on each homework (the same data the homework page shows her) */
let tdata = null, tpending = 0, tfailed = 0;
const teacherView = () => !!(myCode() && ls.get("hw-role")==="teacher" && !asStudent() && syncState!=="unknown");
function tcounts(res){
  const w = res.work || [], ticked = new Set(); Object.values(res.done || {}).forEach(a => a.forEach(i => ticked.add(i)));
  return { toAnswer: w.filter(x=>!String(x.feedback||"").trim() && (x.type!=="marked" || /\n— /.test(String(x.text||"")))).length, marked: w.filter(x=>x.type==="marked").length,
           questions: w.filter(x=>x.type==="question").length, work: w.filter(x=>x.type==="text"||x.type==="recording").length,
           started: ticked.size, students: (res.students || []).length };
}
/* her table answers one request at a time: ask two homeworks at a time, try again once if it was busy */
async function inTurn(items, fn, width=2){
  let next = 0;
  const worker = async () => { while(next < items.length){ const it = items[next++]; await fn(it); } };
  await Promise.all(Array.from({length: Math.min(width, items.length)}, worker));
}
async function teacherSync(code, key){
  for(let attempt = 0; attempt < 2; attempt++){
    const res = await post({action:"sync", code, page:key});
    if(res.ok || res.error === "unknown-code" || res.error === "other-group") return res;
  }
  return {ok:false, error:"busy"};
}
/* one request for all the homework; an older Code.gs answers "no-page", and then each homework is asked in turn */
async function overview(code, keys, stats){
  let res = {ok:false};
  for(let attempt = 0; attempt < 2 && !res.ok; attempt++){
    res = await post({action:"overview", code, pages:keys, stats:!!stats});
    if(res.error === "no-page" || res.error === "unknown-code") break;
  }
  return res;
}
async function loadTeacher(){
  const code = myCode(), L = HW_ALL; tdata = {}; tpending = L.length; tfailed = 0; render();
  const all = await overview(code, L.map(h=>h.key));
  if(code !== myCode() || !teacherView()) return;
  if(all.ok && all.pages){ gotPub(all.published); L.forEach(h=>{ if(all.pages[h.key]) tdata[h.key] = all.pages[h.key]; else tfailed++; }); tpending = 0; render(); return; }
  if(all.error !== "no-page"){ tpending = 0; tfailed = L.length; render(); return; }
  await inTurn(L, async h => {
    const res = await teacherSync(code, h.key);
    if(code !== myCode() || !teacherView()) return;
    tpending--;
    if(res.ok && res.role==="teacher") tdata[h.key] = tcounts(res); else tfailed++;
    render();
  });
}
function teacherSum(){
  if(!teacherView()) return "";
  if(!tdata) return `<p class="t-sum checking">Checking what waits for your answer…</p>`;
  const total = Object.values(tdata).reduce((s,c)=>s+c.toAnswer, 0);
  /* never say "nothing waiting" before every homework has answered */
  if(tpending === HW_ALL.length) return `<p class="t-sum checking">Checking what waits for your answer…</p>`;
  if(tpending) return `<p class="t-sum checking">${total ? `💬 ${total} waiting for your answer so far · ` : ""}checking… ${HW_ALL.length - tpending} of ${HW_ALL.length}</p>`;
  if(tfailed) return `<p class="t-sum">${total ? `💬 ${total} waiting for your answer · ` : ""}⚠️ ${tfailed} homework didn't answer — reload the page</p>`;
  return `<p class="t-sum ${total?"":"none"}">${total ? `💬 ${total} waiting for your answer — open the homework with the red frame` : "✓ Nothing waiting for your answer"}</p>`;
}
/* a student's new feedback, on top of the list (red) */
function studentFbHTML(){
  if(!myCode() || syncState==="unknown" || teacherView()) return "";
  const list = HW.filter(h=>stats(h).fbNew);
  if(!list.length) return "";
  return `<div class="fb-alert" role="status"><b>💬 New feedback from Olya</b> on ${list.map(h=>`<a href="${esc(h.file)}">${esc(h.date)}</a>`).join(", ")}. Open the homework and tap the red box on top.</div>`;
}
function card(h, i){
  const st = stats(h), n = h.tasks.length, all = n && st.done >= n;
  if(teacherView()){
    const c = tdata && tdata[h.key];
    const badges = c ? [c.toAnswer?`<b>💬 ${c.toAnswer} to answer</b>`:"", `${c.started} of ${c.students} started`, c.marked?`❔ ${c.marked}`:"", c.questions?`❓ ${c.questions}`:"", c.work?`✍️ ${c.work}`:""].filter(Boolean).join(" · ") : (tpending ? "checking…" : "didn't answer — reload the page");
    const latest = h === HW[0];
    return `<a class="hw ${latest?"latest":""} ${c && c.toAnswer ? "todo" : ""} ${isPub(h)?"":"unl"}" href="${esc(h.file)}">
    <div class="hw-top"><span class="date">${esc(h.date)}</span>${!isPub(h)?`<span class="tag unl-tag">🔒 Not published</span>`:latest?`<span class="tag">Latest</span>`:""}<span class="go" aria-hidden="true">→</span></div>
    <div class="topics">${h.topics.map((tp,k)=>`<div class="topic t${k%2}"><b>${esc(tp.title)}</b><span>${esc(tp.sub)}</span></div>`).join("")}</div>
    <div class="tb">${badges}</div>
  </a>`;
  }
  return `<a class="hw ${i===0?"latest":""} ${st.fbNew?"fbnew":""}" href="${esc(h.file)}">
    <div class="hw-top"><span class="date">${esc(h.date)}</span>${i===0?`<span class="tag">Latest</span>`:""}<span class="go" aria-hidden="true">→</span></div>
    <div class="topics">${h.topics.map((tp,k)=>`<div class="topic t${k%2}"><b>${esc(tp.title)}</b><span>${esc(tp.sub)}</span></div>`).join("")}</div>
    <div class="prog ${all?"all":""}"><div class="bar" aria-hidden="true"><i style="width:${n?Math.round(st.done/n*100):0}%"></i></div><span>${all?"All done ✓":`${st.done} of ${n} tasks done`}</span></div>
    ${st.fbNew ? `<div class="fb new">💬 New feedback from Olya — open to read</div>` : st.fb ? `<div class="fb">💬 Feedback from Olya</div>` : ""}
  </a>`;
}
function syncHTML(){
  if(!SYNC_URL) return "";
  const code = myCode(), who = ls.get("hw-who");
  if(asStudent()) return `<div class="sync sync-on preview-bar"><span>👀 <b>Student view</b> — what your students see. Nothing is sent to the table.</span>
      <button class="chip-t" id="as-teacher">Back to teacher view</button></div>`;
  if(code && syncState!=="unknown" && ls.get("hw-role")==="teacher") return `<div class="sync sync-on">
      <span>👩‍🏫 <b>Teacher view</b>${who?` — ${esc(who)}`:""}. Open a homework page to see your group on each task.</span>
      <button class="chip-t" id="as-student">👀 Student view</button>
      <button class="linklike" id="code-change">Not you?</button></div>`;
  if(code && syncState!=="unknown") return `<div class="sync sync-on">
      <span>✓ ${who?`Hi, ${esc(who)}! `:""}Olya can see your progress${syncState==="offline"?" — no connection right now, so this shows what's saved on this device.":"."}</span>
      <button class="linklike" id="code-change">Not you?</button></div>`;
  return `<div class="sync sync-card">
      <label for="code"><b>Your code from Olya</b></label>
      <div class="sync-row"><input id="code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. lemon42" value="${esc(code)}">
        <button class="btn primary" id="code-go">Save</button></div>
      <p class="small">Olya will see your progress, and your ticks will be the same on your phone and computer.</p>
      <p class="small sync-msg" id="sync-msg" aria-live="polite">${syncState==="unknown"?"Hmm, Olya's list doesn't have this code. Check it with her.":""}</p>
    </div>`;
}
const standalone = () => { try{ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }catch(e){ return false; } };
function tipHTML(){
  let phone = true; try{ phone = window.matchMedia("(pointer: coarse)").matches; }catch(e){}
  if(ls.get("hw-tip-done") || standalone() || !phone) return "";
  return `<div class="tip" id="tip"><span>📱 <b>Keep this page on your phone.</b> iPhone (Safari): tap <b>Share</b> → <b>Add to Home Screen</b>. Android (Chrome): tap <b>⋮</b> → <b>Add to Home screen</b>.</span>
    <button class="linklike" id="tip-x">Got it</button></div>`;
}
function render(){
  app.innerHTML = `
    <header class="head">${teacherView() ? `<a class="to-start" href="../index.html">← Both groups</a>` : ""}<h1>Homework</h1><p><b>Wed Fri 20.15</b> · All our homework in one place. The newest is at the top.</p></header>
    <div id="sync-slot">${syncHTML()}</div>
    ${studentFbHTML()}
    ${(myCode() && syncState!=="unknown") ? meterHTML(groupStats) : ""}
    ${tipHTML()}
    ${teacherSum()}
    <div class="list">${teacherList().map(card).join("")}</div>
    <p class="foot">Open a homework page, do the tasks and tick them off. Your ticks show up here.</p>`;
  const x = document.getElementById("tip-x"); if(x) x.addEventListener("click",()=>{ ls.set("hw-tip-done","1"); document.getElementById("tip").remove(); });
  const ch = document.getElementById("code-change");
  if(ch) ch.addEventListener("click",()=>{ ls.set("hw-code",""); ls.set("hw-who",""); ls.set("hw-role",""); ls.set("hw-gid",""); ls.set("hw-as-student",""); server = null; syncState = ""; render(); const i=document.getElementById("code"); if(i) i.focus(); });
  const go = document.getElementById("code-go"), inp = document.getElementById("code");
  if(go && inp){
    const save = async ()=>{
      const code = inp.value.trim().toLowerCase(), msg = document.getElementById("sync-msg");
      if(!code){ msg.textContent = "Type the code Olya sent you."; return; }
      go.disabled = true; msg.textContent = "Checking…";
      const res = await post({action:"summary", code, pages:HW_ALL.map(h=>h.key)});
      go.disabled = false;
      if(res.ok) gotPub(res.published);
      if(otherGroup(res, code)) return;
      if(res.ok){ ls.set("hw-code", code); ls.set("hw-gid", res.role==="teacher" ? "" : (res.gid||"")); ls.set("hw-role", res.role==="teacher" ? "teacher" : ""); ls.set("hw-who", res.name||""); if(!ls.get("hw-name") && res.name) ls.set("hw-name", res.name); server = res; syncState = "ok"; gotGroup(res.group); render(); if(teacherView()) loadTeacher(); }
      else msg.textContent = res.error==="unknown-code" ? "Hmm, Olya's list doesn't have this code. Check it with her." : "Can't reach Olya's list right now. Try again in a minute.";
    };
    go.addEventListener("click", save);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") save(); });
  }
}
function gotGroup(g){ if(!g) return; groupStats = g; ls.set("hw-group-"+GROUP_ID, JSON.stringify(g)); setTimeout(()=>checkMilestone(g, GROUP_ID), 50); }
async function refresh(){
  const code = myCode();
  if(!code && SYNC_URL && HW_ALL.some(h=>h.unlisted)){   /* no code: only which drafts are published */
    const res = await post({action:"published", pages:HW_ALL.filter(h=>h.unlisted).map(h=>h.key)});
    if(res.ok && !myCode()){ gotPub(res.published); render(); }
    return;
  }
  if(!code || asStudent()) return;
  const res = await post({action:"summary", code, pages:HW_ALL.map(h=>h.key)});
  if(code !== myCode()) return;
  if(otherGroup(res, code)) return;
  if(res.ok){ gotPub(res.published); ls.set("hw-gid", res.role==="teacher" ? "" : (res.gid||"")); server = res.role==="teacher" ? null : res; syncState = "ok"; ls.set("hw-who", res.name||""); ls.set("hw-role", res.role==="teacher" ? "teacher" : ""); gotGroup(res.group); }
  else syncState = res.error==="unknown-code" ? "unknown" : "offline";
  render();
  if(teacherView()) loadTeacher();
}
if(!(myCode() && toOwnGroup(ls.get("hw-gid")))){ render(); refresh(); }
window.addEventListener("pageshow", e=>{ if(e.persisted && !(myCode() && toOwnGroup(ls.get("hw-gid")))){ render(); refresh(); } });
</script>
</body>
</html>
